/* ============================================================
   Cost — what a run would cost before you start it
   ============================================================
   Print history already costs a print after the fact, filament by weight plus
   machine time. This asks the same question forwards: this model, this many
   times, what does that come to, and is there enough on the spool.

   The numbers start from whatever the slicer put in the gcode, so for anything
   already sliced this is not an estimate, and they stay editable for anything
   that is not. */
const Cost = {
  open(modelId){
    const m = Store.model(modelId); if(!m) return;
    const est = m.est || {};
    const fils = Store.filaments.filter(f=>!f.archived);
    // Prefer a spool of the material the gcode was sliced for.
    const pick = fils.find(f=>est.material && f.material === est.material) || fils[0];

    Cost._m = m;
    Modal.open('Cost of printing "'+U.esc(m.name)+'"',
      '<div class="fr">'+
        '<div class="f"><label>How many</label>'+
          '<input type="number" id="cQty" min="1" step="1" value="1" oninput="PV.Cost.recalc()"></div>'+
        '<div class="f"><label>Filament</label><select id="cFil" onchange="PV.Cost.onFil()">'+
          '<option value="">Not from a spool</option>'+
          fils.map(f=>'<option value="'+U.attr(f.id)+'"'+(pick && f.id===pick.id?' selected':'')+'>'+
            U.esc(f.brand+' '+f.material+(f.colorName?' '+f.colorName:''))+'</option>').join('')+
          '</select></div>'+
      '</div>'+
      '<div class="fr">'+
        '<div class="f"><label>Grams each</label>'+
          '<input type="number" id="cG" min="0" step="0.1" value="'+U.attr(est.grams != null ? est.grams : '')+'" '+
          'placeholder="from the gcode" oninput="PV.Cost.recalc()"></div>'+
        '<div class="f"><label>Minutes each</label>'+
          '<input type="number" id="cT" min="0" step="1" value="'+U.attr(est.timeMin != null ? est.timeMin : '')+'" '+
          'placeholder="from the gcode" oninput="PV.Cost.recalc()"></div>'+
      '</div>'+
      '<div class="fr">'+
        '<div class="f"><label>Cost per kg</label>'+
          '<input type="number" id="cKg" min="0" step="0.01" oninput="PV.Cost.recalc()"></div>'+
        '<div class="f"><label>Running cost per hour</label>'+
          '<input type="number" id="cHr" min="0" step="0.01" value="'+U.attr(Store.settings.costPerHour||0)+'" '+
          'oninput="PV.Cost.recalc()"></div>'+
      '</div>'+
      (est.grams == null && est.timeMin == null
        ? '<div class="note">Nothing here has been sliced yet, so there are no figures to start from. '+
          'Put in what you expect and it will do the arithmetic.</div>' : '')+
      '<div id="cOut" style="margin-top:14px"></div>',
      '<div class="sp"></div><button class="b" onclick="PV.Modal.back()">Close</button>');

    Cost.onFil();
  },

  onFil(){
    const f = Store.filament(Modal.val('cFil'));
    const kg = document.getElementById('cKg');
    if(kg) kg.value = f && f.costPerKg != null ? f.costPerKg : '';
    Cost.recalc();
  },

  recalc(){
    const out = document.getElementById('cOut'); if(!out) return;
    const qty = Math.max(1, Math.round(Modal.num('cQty') || 1));
    const g = Modal.num('cG'), t = Modal.num('cT');
    const perKg = Modal.num('cKg'), perHr = Modal.num('cHr');
    const f = Store.filament(Modal.val('cFil'));

    const gTotal = (g || 0) * qty;
    const tTotal = (t || 0) * qty;
    const fCost = perKg ? gTotal / 1000 * perKg : 0;
    const mCost = perHr ? tTotal / 60 * perHr : 0;
    const total = fCost + mCost;

    const row = (label, val, note)=>
      '<div style="display:flex;gap:10px;align-items:baseline;padding:5px 0">'+
        '<span style="color:var(--dim);font-size:12.5px;min-width:130px">'+label+'</span>'+
        '<b>'+val+'</b>'+
        (note ? '<span class="z" style="color:var(--dim2)">'+note+'</span>' : '')+
      '</div>';

    let h = row('Filament', U.money(fCost), U.num(gTotal,1)+' g'+(perKg?'':' — no price set'))+
            row('Machine time', U.money(mCost), U.dur(tTotal))+
            '<hr style="margin:8px 0">'+
            row('Total', '<span style="font-size:1.25rem">'+U.money(total)+'</span>',
                qty > 1 ? U.money(total/qty)+' each' : '');

    /* The question people actually mean by "can I print ten of these" is
       usually whether there is enough on the spool, not what it costs. */
    if(f && gTotal){
      const left = f.remainingG || 0;
      const short = gTotal - left;
      h += '<div class="note'+(short > 0 ? ' bad' : '')+'" style="margin-top:12px"><p>'+
        (short > 0
          ? 'That needs <b>'+U.num(gTotal,0)+' g</b> and <b>'+U.esc(f.brand+' '+f.material)+'</b> has '+
            U.num(left,0)+' g left. <b>'+U.num(short,0)+' g short</b>, about '+
            Math.floor(left / (g||1))+' of them from this spool.'
          : 'Enough on the spool: '+U.num(left,0)+' g left, this needs '+U.num(gTotal,0)+' g.')+
        '</p></div>';
    }
    out.innerHTML = h;
  }
};

/* ============================================================
   SliceWatch — notice the gcode when it lands
   ============================================================
   Slicing from inside the app turned out not to be worth having. OrcaSlicer's
   Windows build boots its whole interface when handed command line arguments
   and never slices headlessly, and it only writes errors to a console it
   inherits directly, so anything driving it cannot even report why it failed.

   This does the useful half instead. When you send a model to a slicer, the
   folder it lives in is noted along with the gcode already in it. Come back to
   the window later and Printery looks once more: if gcode has appeared, it
   scans and tells you. No process spawning, no profiles, and it works with
   every slicer rather than one. */
const SliceWatch = {
  _pending: null,
  // Nobody slices for four hours and comes back expecting this. Past that it
  // is stale, and rescanning on a stranger's schedule is just surprising.
  MAX_AGE: 4 * 60 * 60 * 1000,

  async expect(file){
    const m = Store.model(file.modelId);
    const folder = m ? (U.dir(m.path) === '' && m.path ? m.path : (U.dir(file.path) || '')) : U.dir(file.path);
    let before = [];
    try{ before = (await FS.listDir(file.rootId, folder)).filter(f=>SliceWatch.isGcode(f.name)).map(f=>f.name); }
    catch(e){ /* cannot list it now, so nothing to compare against later */ return; }
    SliceWatch._pending = {
      rootId: file.rootId, folder, modelId: file.modelId,
      modelName: m ? m.name : file.name,
      before, at: Date.now()
    };
  },

  isGcode(name){ return /\.(gcode|gco|g|bgcode|ufp|gx|mgcode)(\.3mf)?$/i.test(String(name||'')); },

  /* Called when the window gets focus back. Cheap: it lists one folder, and
     only pays for a scan when something actually turned up. */
  async check(){
    const p = SliceWatch._pending;
    if(!p) return;
    if(Date.now() - p.at > SliceWatch.MAX_AGE){ SliceWatch._pending = null; return; }
    if(Scan.busy) return;

    let now = [];
    try{ now = (await FS.listDir(p.rootId, p.folder)).filter(f=>SliceWatch.isGcode(f.name)).map(f=>f.name); }
    catch(e){ return; }                       // folder gone or unreadable, leave it alone

    const seen = new Set(p.before);
    const fresh = now.filter(n=>!seen.has(n));
    if(!fresh.length) return;

    // Only look once. Finding it again on every focus would be nagging.
    SliceWatch._pending = null;
    Toast.ok(fresh.length === 1
      ? 'New gcode for "'+p.modelName+'", indexing it'
      : fresh.length+' new gcode files for "'+p.modelName+'", indexing them');
    await Scan.run([p.rootId]);
  }
};

/* ============================================================
   Quarantine — what was removed, and the way back
   ============================================================
   Removing a duplicate or a whole model moves files here rather than deleting
   them, and the scanner skips the folder so they never reappear as models.
   That made it a one way door: the safety net existed but there was no way
   back up without opening a file manager. This is the ladder.

   The folder mirrors the original paths, so restoring is the same move in
   reverse and needs no record of where anything came from. */
const Quarantine = {
  dir(){ return Store.settings.quarantineDir || '_PrintVault_quarantine'; },

  async list(){
    const qdir = Quarantine.dir();
    const out = [];
    for(const r of Store.roots){
      let files = [];
      try{ files = await FS.listDir(r.id, qdir); }catch(e){ continue; }
      files.forEach(f=>out.push({
        rootId: r.id, rootName: r.name,
        // path inside quarantine, which is also where it came from
        orig: f.path,
        full: qdir + '/' + f.path,
        name: f.name, size: f.size, mtime: f.mtime
      }));
    }
    return out.sort((a,b)=>(b.mtime||0)-(a.mtime||0));
  },

  async open(){
    Prog.start('Looking in the quarantine folder...');
    let files = [];
    try{ files = await Quarantine.list(); }
    catch(e){ Prog.stop(); return Toast.err('Could not read the quarantine folder: '+(e&&e.message||e)); }
    Prog.stop();
    Quarantine.render(files);
  },

  render(files){
    const qdir = Quarantine.dir();
    if(!files.length){
      return Modal.open('Quarantine',
        '<div class="note">Nothing in <b>'+U.esc(qdir)+'</b>.</div>'+
        '<p style="color:var(--dim);font-size:12.5px;line-height:1.6">Files land here when you remove a '+
        'duplicate or delete a model while the removal setting is on quarantine. They keep their original '+
        'paths, so anything here can be put back exactly where it came from.</p>',
        '<div class="sp"></div><button class="b" onclick="PV.Modal.back()">Close</button>');
    }
    const total = files.reduce((s,f)=>s+(f.size||0), 0);
    const rows = files.slice(0, 300).map((f,i)=>
      '<div class="filerow">'+I.doc+
        '<span class="n" title="'+U.attr(f.orig)+'">'+U.esc(f.orig)+'</span>'+
        (Store.roots.length > 1 ? '<span class="z">'+U.esc(f.rootName)+'</span>' : '')+
        '<span class="z" style="min-width:56px;text-align:right">'+U.bytes(f.size)+'</span>'+
        '<button class="b g sm ico" title="Put this back" onclick="PV.Quarantine.restoreOne('+i+')">'+I.up+'</button>'+
      '</div>').join('');

    Quarantine._files = files;
    Modal.open('Quarantine ('+files.length+')',
      '<div class="note">These are in <b>'+U.esc(qdir)+'</b>, inside your library. Putting one back returns it '+
        'to the path it came from.</div>'+
      '<div class="filelist">'+rows+'</div>'+
      (files.length > 300 ? '<div style="color:var(--dim2);font-size:12px;padding-top:6px">Showing the newest 300 of '+files.length+'.</div>' : '')+
      '<p style="color:var(--dim);font-size:12.5px;margin:12px 0 0">Holding <b>'+U.bytes(total)+'</b>.</p>',
      '<button class="b d" onclick="PV.Quarantine.empty()">'+I.trash+' Empty quarantine</button>'+
      '<div class="sp"></div>'+
      '<button class="b" onclick="PV.Modal.back()">Close</button>'+
      '<button class="b p" onclick="PV.Quarantine.restoreAll()">'+I.up+' Put everything back</button>');
  },

  async restoreOne(i){
    const f = (Quarantine._files||[])[i];
    if(!f) return;

    /* Only the move itself may report a failed restore. Everything after it
       is bookkeeping, and the file is already back by then, so reporting a
       rescan failure as "could not put it back" sends people hunting for a
       file that is sitting exactly where they asked for it. */
    try{
      // Same guard restoreAll has. Without it, restoring over something that
      // took the old path in the meantime would overwrite it without a word.
      if(await FS.exists(f.rootId, f.orig)){
        return Toast.err('Something is already at that path, left it alone');
      }
      await FS.move(f.rootId, f.full, f.orig);
    }catch(e){
      return Toast.err('Could not put it back: '+(e && e.message || e));
    }

    Toast.ok('Put "'+f.name+'" back');
    try{ await Scan.run([f.rootId]); }
    catch(e){ Toast.err('It is back, but the rescan failed: '+(e && e.message || e)); }
    try{ await Quarantine.open(); }catch(e){}
  },

  async restoreAll(){
    const files = Quarantine._files || [];
    if(!files.length) return;
    Modal.confirm('Put '+files.length+' file'+(files.length===1?'':'s')+' back?',
      'Each one returns to the path it came from. Anything already sitting at that path is left alone '+
      'and reported, rather than being written over.',
      async ()=>{
        Modal.close();
        Prog.start('Putting files back...');
        const roots = new Set();
        let ok = 0, fail = 0;
        for(let i=0;i<files.length;i++){
          if(Prog.cancelled) break;
          const f = files[i];
          Prog.set('Restoring ('+(i+1)+'/'+files.length+') '+f.name, i, files.length);
          try{
            // Never clobber something that has taken the old path since
            if(await FS.exists(f.rootId, f.orig)){ fail++; continue; }
            await FS.move(f.rootId, f.full, f.orig);
            roots.add(f.rootId); ok++;
          }catch(e){ fail++; }
        }
        Prog.stop();
        Toast.ok('Put '+ok+' file'+(ok===1?'':'s')+' back'+(fail?', '+fail+' skipped or failed':''));
        // The files are already back; a rescan that fails must not read as one
        // that did not happen.
        try{ for(const id of roots) await Scan.run([id]); }
        catch(e){ Toast.err('They are back, but the rescan failed: '+(e && e.message || e)); }
      }, 'Put back');
  },

  empty(){
    const files = Quarantine._files || [];
    if(!files.length) return;
    const total = files.reduce((s,f)=>s+(f.size||0), 0);
    Modal.confirmTyped('Empty the quarantine folder?',
      'This permanently deletes <b>'+files.length+' file'+(files.length===1?'':'s')+'</b>, '+U.bytes(total)+
      '. This is the copy you kept in case you wanted it back, so once this is done there is no way back.',
      'DELETE',
      async ()=>{
        Prog.start('Emptying quarantine...');
        let ok = 0, fail = 0;
        for(let i=0;i<files.length;i++){
          if(Prog.cancelled) break;
          Prog.set('Deleting ('+(i+1)+'/'+files.length+')', i, files.length);
          try{ await FS.deleteFile(files[i].rootId, files[i].full); ok++; }catch(e){ fail++; }
        }
        Prog.stop();
        Toast.ok('Deleted '+ok+' file'+(ok===1?'':'s')+(fail?', '+fail+' failed':''));
        try{ await Quarantine.open(); }catch(e){}
      }, I.trash+' Delete permanently');
  }
};

/* ============================================================
   Share — hand files to the system share sheet (macOS)
   ============================================================
   Asked for by someone who keeps getting "can you send me that thing you
   printed" from family with their own printers, and was digging through
   project folders in Finder to answer. */
const Share = {
  /* What a model actually means when you share it. A model can be a folder of
     dozens of files and nobody wants to AirDrop a README, so this is the
     printable geometry, or the archive itself when it was never unpacked. */
  filesFor(m){
    const files = Store.modelFiles(m.id);
    if(m.isArchive){
      const a = files.find(f=>f.kind === 'arch');
      return a ? [a] : [];
    }
    const mesh = files.filter(f=>['stl','3mf','obj'].includes(f.ext));
    return mesh.length ? mesh : files.filter(f=>isPrintable(f.ext));
  },

  async open(ids){
    if(!FS.canShare) return;
    const models = (Array.isArray(ids) ? ids : [ids]).map(id=>Store.model(id)).filter(Boolean);
    if(!models.length) return Toast.err('Nothing to share');

    const items = [];
    const empty = [];
    models.forEach(m=>{
      const files = Share.filesFor(m);
      if(!files.length) empty.push(m.name);
      files.forEach(f=>items.push({rootId: f.rootId, path: f.path}));
    });
    if(!items.length){
      return Toast.err(models.length === 1
        ? 'No printable files in "' + models[0].name + '"'
        : 'Nothing printable in those ' + models.length + ' models');
    }
    try{
      await FS.share(items);
      // The sheet itself is the feedback, so only say something when the
      // selection was not what somebody would have assumed.
      if(empty.length) Toast.err(empty.length + ' skipped, nothing printable in them');
    }catch(e){
      Toast.err(String(e && e.message || e));
    }
  }
};

const Send = {
  /* Sliced files first, since those are what a printer can actually run.
     Then project files, then plain meshes for the slicer. */
  /* A .gcode.3mf saved out of Bambu Studio or Creality Print is a sliced job,
     not a model, and the scanner already knows: it found the gcode inside and
     kept its settings. So it ranks with the sliced files and does not get
     warned about, which was making a perfectly printable file look wrong. */
  sliced(f){ return f.kind === 'gcode' || (f.ext === '3mf' && f.g && Object.keys(f.g).length); },
  candidates(m){
    const files = Store.modelFiles(m.id);
    const rank = f => f.kind === 'gcode' ? 0 : Send.sliced(f) ? 1
                    : f.ext === '3mf' ? 2 : ['stl','obj'].includes(f.ext) ? 3 : 9;
    return files.filter(f=>rank(f) < 9).sort((a,b)=>rank(a)-rank(b) || (b.size||0)-(a.size||0));
  },
  printers(){ return Store.printers.filter(p=>p.addr); },

  /* ctx is how the queue tags a send as belonging to one of its rows: it
     carries the row id, so a finished upload can mark that row printing, and
     the printer name typed on the row, so the right one starts selected. */
  open(modelId, preferFileId, ctx){
    const m = Store.model(modelId); if(!m) return;
    if(!FS.canSend) return Toast.err('Sending needs the desktop app');
    const files = Send.candidates(m);
    if(!files.length) return Toast.err('Nothing here a slicer or printer could take');
    Send._model = modelId;
    Send._ctx = ctx || null;

    // whatever you were looking at wins over the usual pick
    const want = preferFileId && files.some(f=>f.id === preferFileId) ? preferFileId : (files[0]||{}).id;
    const opts = files.map(f=>'<option value="'+U.attr(f.id)+'"'+(f.id===want?' selected':'')+'>'+
      U.esc(f.path === m.path ? f.name : f.path)+'  ('+U.bytes(f.size)+')</option>').join('');
    const prs = Send.printers();
    const sliced = files.filter(Send.sliced);

    let h = '<div class="f"><label>File</label><select id="sndFile">'+opts+'</select>'+
      '<div class="hint">Sliced gcode is listed first. A printer can only run gcode, a slicer takes any of these.</div></div>';

    /* One slicer is a button. Several is a button each, because picking from a
       dropdown and then pressing a second button to act on it is two steps for
       something that should be one. */
    const slicers = Store.settings.slicers || [];
    h += '<div class="f"><label>Slicer</label>'+
      (slicers.length
        ? slicers.map(sl=>'<button class="b" style="width:100%;justify-content:center;margin-bottom:6px" '+
            'onclick="PV.Send.toSlicer(\''+sl.id+'\')">'+I.ext+' Open in '+U.esc(sl.name)+'</button>').join('')
        : '<button class="b" style="width:100%;justify-content:center" onclick="PV.Send.toSlicer()">'+
          I.ext+' Open in slicer</button>')+
      '<div class="hint">'+(slicers.length
        ? 'Add or rename these under Settings.'
        : 'Whatever this machine opens the file type with. Add slicers in Settings to choose.')+'</div></div>';

    if(prs.length){
      // The queue row names its printer as free text, so match it loosely and
      // fall back to the first rather than guessing wrong and staying quiet.
      const named = ctx && ctx.printer ? String(ctx.printer).trim().toLowerCase() : '';
      const wantP = named ? (prs.find(p=>(p.name||'').trim().toLowerCase() === named)||{}).id : '';
      h += '<div class="f"><label>Printer</label><select id="sndPrinter">'+
        prs.map(p=>'<option value="'+U.attr(p.id)+'"'+(p.id===wantP?' selected':'')+'>'+
          U.esc(p.name)+' &mdash; '+U.esc(p.addr)+'</option>').join('')+
        '</select>'+
        (sliced.length ? '' : '<div class="hint">Nothing here is sliced yet, so a printer would have nothing to run.</div>')+
        '</div>'+
        '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
        '<button class="b" onclick="PV.Send.toPrinter(false)">'+I.up+' Upload</button>'+
        '<button class="b p" onclick="PV.Send.toPrinter(true)">'+I.print+' Upload and start</button></div>';
    } else {
      h += '<div class="note">No printer has a network address yet. Add one under Settings &rarr; Printers to '+
        'upload straight to it.</div>';
    }

    Modal.open('Send: '+m.name, h, '<button class="b" onclick="PV.Modal.back()">Close</button>');
  },

  _file(){
    const id = Modal.val('sndFile');
    return Store.file(id);
  },

  async toSlicer(slicerId){
    const f = Send._file(); if(!f) return;
    const sl = slicerId ? (Store.settings.slicers||[]).find(x=>x.id === slicerId) : null;
    // No id, or an id that no longer matches anything, falls back to the file
    // association, which is what the app did before there was a list.
    const exe = sl ? sl.path : (Store.settings.slicerPath || '');
    try{
      await FS.openWith(f.rootId, f.path, exe);
      Modal.close();
      Toast.ok(sl ? 'Opening '+f.name+' in '+sl.name : 'Opening '+f.name);
      // You went to slice something. Remember where, so the gcode can be
      // noticed when it lands rather than waiting for the next full scan.
      SliceWatch.expect(f);
    }catch(e){ Toast.err(e.message || String(e)); }
  },

  /* Read the choices before anything else opens, because a dialog on top
     replaces the DOM these come from. */
  toPrinter(start){
    const f = Send._file();
    if(!f) return Toast.err('Pick a file to send first');
    const p = Store.printer(Modal.val('sndPrinter'));
    if(!p || !p.addr) return Toast.err('That printer has no address. Add one under Settings, Printers.');
    if(Send.sliced(f)) return Send.upload(f, p, start);
    // The app's own dialog, not window.confirm. A native confirm inside the
    // desktop shell can be suppressed, and it returns nothing when it is, so
    // the send quietly did not happen and said nothing about it.
    /* A project 3mf is the usual thing to trip over: it was sliced, and it
       carries the settings and a plate render, but "save project" does not
       embed the toolpath. Only "export plate sliced file" does, and that is
       what produces a .gcode.3mf. Saying so beats saying "not sliced". */
    const proj = f.ext === '3mf';
    Modal.confirm('Send it anyway?',
      '<b>'+U.esc(f.name)+'</b> has no toolpath in it, so the printer has nothing to run.'+
      (proj ? '<div style="margin-top:10px">A project file keeps your settings so you can reopen it in the slicer, '+
        'but the gcode is not inside it. Use <b>Export plate sliced file</b> instead of <b>Save project</b>, '+
        'which gives you a <span class="mono" style="font-size:12px">.gcode.3mf</span>, and that will send.</div>'
       : '<div style="margin-top:10px">Slice it first, then send the sliced file.</div>')+
      '<div style="margin-top:10px">Uploading anyway just puts the file on the printer.</div>',
      ()=>Send.upload(f, p, start), 'Send anyway');
  },

  async upload(f, p, start){
    Prog.start('Sending '+f.name+' to '+p.name+'...');
    try{
      await FS.sendToPrinter(f.rootId, f.path, p, start);
      Prog.stop(); Modal.close();
      Toast.ok(start ? 'Sent and started on '+p.name : 'Uploaded to '+p.name);
      /* Only now does the queue row get to say printing. It used to say it the
         moment you pressed the button, whether or not anything left the
         machine, which is the whole of issue #4. */
      if(Send._ctx && Send._ctx.queueId) await Queue.sent(Send._ctx.queueId, f, p.name);
    }catch(e){
      Prog.stop();
      console.error('[Printery] send failed', e);
      Toast.err('Send failed: '+(e && e.message || e || 'no reason given'));
    }
  }
};

/* ============================================================
   Monitor — watch a print and write the log when it finishes

   A print history you have to remember to fill in is a print history you
   stop filling in. Once a printer has a network address, the job it is
   running can be read directly, so the log gets written with the real
   duration and the real filament used rather than the slicer's guess.
   ============================================================ */
const Monitor = {
  every: 20000,
  _timer: null,
  state: {},          // printerId -> last status seen
  _job: {},           // printerId -> what we think is running
  _logged: {},        // printerId -> this run is already in the print log
  _busy: false,       // a poll is in flight; see tick()

  start(){
    if(!FS.printerStatus) return;                 // browser build
    if(Monitor._timer) return;
    if(!Store.printers.some(p=>p.addr)) return;
    Monitor.tick();
    Monitor._timer = setInterval(Monitor.tick, Monitor.every);
  },
  stop(){ if(Monitor._timer){ clearInterval(Monitor._timer); Monitor._timer = null; } },

  async tick(){
    // A poll can outlast the interval on a slow or busy printer, and two runs
    // overlapping both saw the same job end and both logged it. One at a time.
    if(Monitor._busy) return;
    Monitor._busy = true;
    try{ await Monitor._tick(); } finally { Monitor._busy = false; }
  },

  async _tick(){
    const printers = Store.printers.filter(p=>p.addr);
    if(!printers.length) return Monitor.stop();
    for(const p of printers){
      let st;
      try{ st = await FS.printerStatus(p); }catch(e){ continue; }
      const was = Monitor.state[p.id];
      Monitor.state[p.id] = st;
      if(st.state === 'printing' || st.state === 'paused'){
        Monitor._job[p.id] = {filename: st.filename, elapsed: st.elapsed_s, filament: st.filament_mm};
        // something is running, so whatever was last written down is history
        delete Monitor._logged[p.id];
      }
      // the moment it stops having been printing is the moment to log it
      const finished = was && (was.state === 'printing' || was.state === 'paused') &&
                       ['complete','standby','cancelled','error'].includes(st.state);
      if(finished) await Monitor.finish(p, was, st);
    }
    if(UI.tab === 'queue' || UI.tab === 'prints') UI.render();
    Monitor.paint();
  },

  /* Neither Moonraker nor OctoPrint reports mass, only how much filament went
     through, so grams are worked out from length. Density is the part that
     varies: ABS is about 16 percent lighter than PLA for the same length, so
     using the spool's material rather than assuming PLA is worth the lookup. */
  DENSITY: {pla:1.24, 'pla+':1.24, petg:1.27, pet:1.27, abs:1.04, asa:1.07, tpu:1.21, tpe:1.21,
            nylon:1.14, pa:1.14, 'pa-cf':1.19, pc:1.20, hips:1.04, pva:1.23, 'pla-cf':1.29},
  density(material){
    const m = String(material||'').toLowerCase().replace(/[^a-z+]/g,'');
    if(!m) return 1.24;
    if(Monitor.DENSITY[m]) return Monitor.DENSITY[m];
    // "PolyLite PETG" and the like: take the first family name that appears
    const hit = Object.keys(Monitor.DENSITY).find(k=>k.length > 2 && m.includes(k));
    return hit ? Monitor.DENSITY[hit] : 1.24;
  },
  grams(mm, material){
    const mm3 = mm * Math.PI * Math.pow(1.75/2, 2);
    return Math.round((mm3 / 1000) * Monitor.density(material) * 10) / 10;
  },

  /* What a printer calls a job and what you called the model rarely match:
     "Thunderstorm_v4_PLA_41m29s.gcode" against "Super Loud 6 Tone Whistle -
     Thunderstorm V4". Exact filename matching misses that, but the shared
     words are obvious. Match on those, and refuse to guess when it is close. */
  STOP: new Set(['pla','petg','abs','asa','tpu','nylon','pc','hips','pva','cf','gf',
    'gcode','bgcode','stl','3mf','obj','plate','print','printed','copy','final','new','old',
    'the','and','for','with','v','mm','x','a','an','of','to','my']),
  tokens(s){
    return U.uniq(String(s||'').toLowerCase()
      .replace(/\.[a-z0-9]{1,6}$/,'')                 // extension
      .replace(/\d+h\d+m\d*s?/g,' ')             // 41m29s, 2h14m
      .replace(/[^a-z0-9]+/g,' ')
      .split(' ')
      .filter(t=>t.length > 1 && !Monitor.STOP.has(t) && !/^\d+$/.test(t)));
  },
  guessModel(jobName){
    const jt = Monitor.tokens(jobName);
    if(jt.length < 2) return null;
    const scored = Store.models.map(m=>{
      const mt = Monitor.tokens(m.name);
      if(!mt.length) return {m, score:0};
      const shared = jt.filter(t=>mt.includes(t)).length;
      return {m, score: shared / Math.min(jt.length, mt.length), shared};
    }).filter(x=>x.score > 0).sort((a,b)=>b.score - a.score || b.shared - a.shared);
    if(!scored.length) return null;
    const best = scored[0], next = scored[1];
    // needs to be a good match, and clearly better than the runner up
    if(best.score < 0.5 || best.shared < 2) return null;
    if(next && next.score > best.score - 0.15) return null;
    return best.m;
  },

  async finish(printer, was, now){
    const job = Monitor._job[printer.id] || {};
    const name = job.filename || was.filename || '';
    if(!name) return;
    /* Belt as well as braces: one run must not be logged twice if this is
       reached again by a stray tick.

       This used to match on printer, file and day, which quietly meant a file
       could only be logged once in a day. Running the same file again is not an
       accident, it is the ordinary thing, and a queued run of six is six prints
       of one file. Only the first was ever recorded, and the other five went
       unlogged with their filament never coming off the spool.

       The flag below is the honest version of that check. It is set when a run
       is written down and cleared the moment the printer reports printing
       again, so one run logs once, and the next run logs on its own account
       however alike the two look. A reload cannot double up either: the log
       only fires on a printing to stopped transition, and a fresh window has
       nothing to have seen printing. */
    if(Monitor._logged[printer.id]) return;
    const cancelled = now.state === 'cancelled' || now.state === 'error';
    const elapsed = Math.max(was.elapsed_s || 0, job.elapsed || 0);
    const mm = Math.max(was.filament_mm || 0, job.filament || 0);

    const base = U.base(name);

    /* If this app sent the job, the queue row that sent it knows more about it
       than the printer does: which model, and which spool you meant to use.
       Worth asking before falling back to guessing at either. */
    const qrow = Queue.forJob(printer.name, base);

    // the spool is found first, because its material sets the density
    // a spool that names this printer wins over one that names none
    const spool = (qrow && qrow.filamentId ? Store.filament(qrow.filamentId) : null) ||
                  Store.filaments.find(f=>f.inUse && f.printer === printer.name) ||
                  Store.filaments.find(f=>f.inUse && !f.printer);
    const grams = Monitor.grams(mm, spool && spool.material);

    // Match the job back to a model. The filename is all the printer knows,
    // so try it exactly first, then fall back to the words in it.
    const key = base.toLowerCase();
    const file = Store.files.find(f=>f.name.toLowerCase() === key) ||
                 Store.files.find(f=>U.stem(f.name).toLowerCase() === U.stem(key));
    const queued = !file && qrow ? Store.model(qrow.modelId) : null;
    const guessed = file || queued ? null : Monitor.guessModel(base);
    const model = file ? Store.model(file.modelId) : (queued || guessed);

    const rec = {
      id: U.id('pt'), modelId: model ? model.id : '', modelName: model ? model.name : U.titleize(U.stem(base)),
      date: U.today(), result: cancelled ? 'fail' : 'success',
      printer: printer.name, grams: grams || null,
      timeMin: elapsed ? Math.round(elapsed/60) : null,
      jobFile: name,   // what the printer called it, so the same job is not logged twice
      loggedAt: Date.now(),   // paired with jobFile to spot a repeated tick
      material: '', notes: (cancelled ? 'Stopped early ('+now.state+')' : 'Logged automatically from '+printer.name)+
        (guessed ? ', matched to this model by name' : '')+
        (queued ? ', started from the queue' : '')+
        (now.message ? ': '+now.message : ''),
      auto: true
    };
    await Store.put('prints', rec);

    // take it off the spool if one is marked in use
    if(spool && grams){
      // to a tenth, or repeated subtraction leaves 763.5999999999999 on the spool
      spool.remainingG = Math.max(0, Math.round(((spool.remainingG || 0) - grams) * 10) / 10);
      rec.filamentId = spool.id; rec.material = spool.material || '';
      await Store.put('filaments', spool);
      await Store.put('prints', rec);
    }
    /* Close the row that started this. Anything the app sent, watched and
       logged by itself should not then need you to go and tick it off.

       A run of six is six prints, so one finished copy advances the count
       rather than closing the row, and the row goes back to pending so the
       next copy can be started. A print that stopped early counts for
       nothing and just goes back to pending. */
    if(qrow){
      qrow.jobFile = ''; qrow.jobPrinter = '';
      if(cancelled){
        qrow.status = 'pending';
      } else {
        qrow.doneQty = (qrow.doneQty || 0) + 1;
        if(qrow.doneQty >= (qrow.qty || 1)){ qrow.status = 'done'; qrow.doneAt = Date.now(); }
        else { qrow.status = 'pending'; }
      }
      await Store.put('queue', qrow);
    }

    Monitor._logged[printer.id] = true;
    delete Monitor._job[printer.id];
    UI.render();
    Toast.ok((cancelled ? 'Logged a stopped print' : 'Logged '+(model ? model.name : U.titleize(U.stem(base))))+
      ' on '+printer.name+(grams ? ', '+grams+'g' : '')+(spool && grams ? ' off '+spool.brand+' '+spool.material : '')+
      (qrow && !cancelled ? (qrow.status === 'done' ? ', and took it off the queue'
                                                    : ', '+qrow.doneQty+' of '+qrow.qty+' done') : ''));
  },

  /* A single line at the top of the window while something is running. */
  paint(){
    const live = Object.entries(Monitor.state)
      .filter(([id,st])=>st && (st.state === 'printing' || st.state === 'paused'));
    let bar = document.getElementById('pvJob');
    if(!live.length){ if(bar) bar.remove(); return; }
    if(!bar){
      bar = document.createElement('div');
      bar.id = 'pvJob'; bar.className = 'jobbar';
      document.body.appendChild(bar);
    }
    bar.innerHTML = live.map(([id,st])=>{
      const p = Store.printer(id) || {name:'Printer'};
      const pct = Math.round((st.progress||0)*100);
      const left = st.remaining_s ? U.dur(Math.round(st.remaining_s/60))+' left' : '';
      return '<div class="jb"><span class="n">'+U.esc(p.name)+'</span>'+
        '<span class="f" title="'+U.attr(st.filename)+'">'+U.esc(U.base(st.filename))+'</span>'+
        '<span class="bar"><i style="width:'+pct+'%"></i></span>'+
        '<span class="pc">'+pct+'%</span>'+
        (left ? '<span class="lf">'+U.esc(left)+'</span>' : '')+
        (st.state === 'paused' ? '<span class="lf">paused</span>' : '')+'</div>';
    }).join('');
  }
};

const Queue = {
  /* How many copies of a row are still to print. A run of six that has had two
     come off the printer is a run of four, and every count in this view says so
     rather than repeating the number you first typed. */
  left(q){ return Math.max(0, (q.qty || 1) - (q.doneQty || 0)); },

  /* The queue knew what you meant to print and the printer knew how to receive
     it, but the two had never been introduced. Start opens the same Send dialog
     the model window uses, with this item's model already chosen and its
     printer selected. Before this it only wrote a word on the record. */
  start(id){
    const q = Store.queue.find(x=>x.id === id); if(!q) return;
    const m = Store.model(q.modelId);
    if(!m) return Toast.err('That model is no longer in the library');
    if(!FS.canSend) return Toast.err('Sending needs the desktop app');
    Send.open(m.id, null, {queueId: q.id, printer: q.printer});
  },

  /* Called once a file has actually reached a printer. What gets written down
     is enough to recognise the same job coming back off that printer later,
     so the row can be closed by whoever is watching rather than by hand. */
  async sent(id, file, printerName){
    const q = Store.queue.find(x=>x.id === id); if(!q) return;
    q.status = 'printing';
    q.jobFile = file ? file.name : '';
    q.jobPrinter = printerName || '';
    q.sentAt = Date.now();
    await Store.put('queue', q);
    UI.render();
  },

  /* The row a finished job belongs to, or nothing. Matched on the printer and
     on the stem of the filename, because a printer may store a file under a
     tidied up name, which is the same allowance the print log makes. */
  forJob(printerName, base){
    const stem = U.stem(String(base||'')).toLowerCase();
    if(!stem) return null;
    return Store.queue.find(q=>q.status === 'printing' && q.jobPrinter === printerName &&
      U.stem(String(q.jobFile||'')).toLowerCase() === stem) || null;
  },

  render(v){
    const pending = U.sortBy(Store.queue.filter(q=>q.status!=='done'),
      q=>({hi:0,md:1,lo:2}[q.priority||'md'])*1e13 + (q.addedAt||0)/1e6, 'asc');
    const done = U.sortBy(Store.queue.filter(q=>q.status==='done'), q=>q.doneAt||0, 'desc').slice(0,25);
    const est = pending.reduce((s,q)=>{
      const m = Store.model(q.modelId);
      return {t: s.t + ((m&&m.est&&m.est.timeMin)||0)*Queue.left(q), g: s.g + ((m&&m.est&&m.est.grams)||0)*Queue.left(q)};
    }, {t:0,g:0});

    let h = '<div class="pv-bar"><h2>Print Queue</h2><span class="cnt">'+pending.length+' waiting</span><div class="sp"></div>'+
      (done.length ? '<button class="b sm" onclick="PV.Queue.clearDone()">Clear completed</button>' : '')+
      '<button class="b sm p" onclick="PV.Queue.add()">'+I.plus+' Add to queue</button></div>';

    if(pending.length) h += '<div class="stats">'+
      '<div class="stat"><div class="k">Queued</div><div class="v">'+pending.reduce((s,q)=>s+Queue.left(q),0)+'</div><div class="sub">items across '+pending.length+' entries</div></div>'+
      '<div class="stat"><div class="k">Est. machine time</div><div class="v">'+U.num(est.t/60,0)+'<span style="font-size:13px;color:var(--dim2)"> h</span></div><div class="sub">'+U.dur(est.t)+'</div></div>'+
      '<div class="stat"><div class="k">Est. filament</div><div class="v">'+U.num(est.g/1000,2)+'<span style="font-size:13px;color:var(--dim2)"> kg</span></div><div class="sub">'+U.num(est.g,0)+' g</div></div>'+
      '</div>';

    if(!pending.length && !done.length){
      h += '<div class="pv-empty">'+I.queue+'<h3>Queue is empty</h3>'+
        '<p>Line up what you want to print next. Estimates come from the sliced gcode in each model folder, so you can see whether you have the filament for the whole batch.</p>'+
        '<button class="b p" onclick="PV.Queue.add()">'+I.plus+' Add something</button></div>';
      v.innerHTML = h; return;
    }

    h += pending.map(q=>{
      const m = Store.model(q.modelId);
      const e = (m && m.est) || {};
      const fil = q.filamentId ? Store.filament(q.filamentId) : null;
      return '<div class="qcard">'+
        '<div class="pri '+(q.priority||'md')+'"></div>'+
        '<div class="th">'+(m && m.thumbId ? '<img data-thumb="'+U.attr(m.thumbId)+'">' : I.cube)+'</div>'+
        // The badge and the estimates count what is left to print, not what
        // the run started as, so a batch half way through reads honestly.
        '<div class="nm"><b>'+(Queue.left(q)>1?'<span class="tg a">'+Queue.left(q)+'&times;</span> ':'')+
          U.esc(m?m.name:(q.name||'(model removed)'))+'</b>'+
          '<small>'+[q.printer, fil?(fil.brand+' '+fil.material+(fil.colorName?' '+fil.colorName:'')):null,
            q.doneQty?q.doneQty+' of '+(q.qty||1)+' printed':null,
            e.timeMin?U.dur(e.timeMin*Queue.left(q)):null, e.grams?U.num(e.grams*Queue.left(q),0)+'g':null]
            .filter(Boolean).map(U.esc).join(' · ')+
          (q.notes?' · '+U.esc(q.notes):'')+'</small></div>'+
        (q.status==='printing' ? '<span class="bdg acc">printing</span>' : '')+
        (m ? '<button class="b g sm ico" onclick="PV.Detail.open(\''+q.modelId+'\')" title="Open model">'+I.eye+'</button>' : '')+
        /* Start sends where sending is possible. Where it is not, the button
           says what it really does instead of promising a print. */
        (q.status==='printing'
          ? '<button class="b sm" onclick="PV.Queue.status(\''+q.id+'\',\'pending\')" '+
            'title="Put this row back on the pending list">Mark pending</button>'
          : (m && FS.canSend
              ? '<button class="b sm" onclick="PV.Queue.start(\''+q.id+'\')" '+
                'title="Send this to a printer or open it in a slicer">'+I.print+' Start</button>'
              : '<button class="b sm" onclick="PV.Queue.status(\''+q.id+'\',\'printing\')" '+
                'title="Sending needs the desktop app. This just notes that you have started it.">Mark printing</button>'))+
        '<button class="b sm p" onclick="PV.Queue.done(\''+q.id+'\')">'+I.check+' Done</button>'+
        '<button class="b g sm ico" onclick="PV.Queue.add(null,\''+q.id+'\')" title="Edit">'+I.edit+'</button>'+
        '<button class="b g sm ico" onclick="PV.Queue.del(\''+q.id+'\')" title="Remove">'+I.x+'</button>'+
      '</div>';
    }).join('');

    if(done.length){
      h += '<h3 style="font-size:13px;color:var(--dim);margin:20px 0 9px">Recently completed</h3>';
      h += done.map(q=>{
        const m = Store.model(q.modelId);
        return '<div class="qcard" style="opacity:.55"><div class="pri"></div>'+
          '<div class="th">'+(m && m.thumbId ? '<img data-thumb="'+U.attr(m.thumbId)+'">' : I.cube)+'</div>'+
          '<div class="nm"><b>'+U.esc(m?m.name:(q.name||''))+'</b><small>Completed '+U.ago(q.doneAt)+'</small></div>'+
          '<button class="b g sm ico" onclick="PV.Queue.del(\''+q.id+'\')">'+I.x+'</button></div>';
      }).join('');
    }
    v.innerHTML = h;
    Thumbs.hydrate(v);
  },

  add(modelId, queueId){
    const q = queueId ? Store.queue.find(x=>x.id===queueId) : null;
    const models = U.sortBy(Store.models, x=>x.name.toLowerCase(), 'asc');
    const cur = q ? q.modelId : modelId;
    Modal.open(q ? 'Edit queue item' : 'Add to queue',
      '<div class="f"><label>Model</label><select id="qModel">'+
        (models.length > 4000 && cur ? '<option value="'+U.attr(cur)+'" selected>'+U.esc((Store.model(cur)||{}).name||'')+'</option>'
         : models.map(x=>'<option value="'+U.attr(x.id)+'"'+(cur===x.id?' selected':'')+'>'+U.esc(x.name)+'</option>').join(''))+
        '</select></div>'+
      '<div class="fr3">'+
        '<div class="f"><label>Quantity</label><input type="number" min="1" id="qQty" value="'+U.attr(q?q.qty:1)+'"></div>'+
        '<div class="f"><label>Priority</label><select id="qPrio">'+
          PRIOS.map(p=>'<option value="'+p[0]+'"'+((q?q.priority:'md')===p[0]?' selected':'')+'>'+p[1]+'</option>').join('')+'</select></div>'+
        '<div class="f"><label>Printer</label><input id="qPrinter" list="prnList2" value="'+U.attr(q?q.printer:Store.settings.defaultPrinter)+'">'+
          '<datalist id="prnList2">'+U.uniq(Store.printers.map(x=>x.name).concat(Store.prints.map(x=>x.printer)).filter(Boolean))
            .map(n=>'<option value="'+U.attr(n)+'">').join('')+'</datalist></div>'+
      '</div>'+
      '<div class="f"><label>Filament</label><select id="qFil"><option value="">(decide later)</option>'+
        Store.filaments.filter(f=>!f.archived).map(f=>'<option value="'+U.attr(f.id)+'"'+((q&&q.filamentId)===f.id?' selected':'')+'>'+
          U.esc(f.brand+' '+f.material+(f.colorName?' — '+f.colorName:'')+'  ('+U.num(f.remainingG,0)+'g left)')+'</option>').join('')+
        '</select></div>'+
      '<div class="f"><label>Notes</label><input id="qNotes" value="'+U.attr(q?q.notes:'')+'" placeholder="Scale to 120%, print in vase mode"></div>',
      '<div class="sp"></div><button class="b" onclick="PV.Modal.back()">Cancel</button>'+
      '<button class="b p" onclick="PV.Queue.save('+(q?"'"+q.id+"'":'null')+')">'+(q?'Save':'Add')+'</button>');
  },
  async save(id){
    const modelId = Modal.val('qModel');
    const m = Store.model(modelId);
    const q = Object.assign({id: id||U.id('q'), addedAt: Date.now(), status:'pending'},
      (id?Store.queue.find(x=>x.id===id):null) || {}, {
      modelId, name: m ? m.name : ((id && Store.queue.find(x=>x.id===id) || {}).name || ''),
      qty: Math.max(1, Modal.num('qQty')||1),
      priority: Modal.val('qPrio'), printer: Modal.val('qPrinter').trim(),
      filamentId: Modal.val('qFil'), notes: Modal.val('qNotes').trim()
    });
    await Store.put('queue', q);
    Modal.close(); UI.render(); Toast.ok(id?'Queue item updated':'Added to queue');
  },
  async status(id, st){
    const q = Store.queue.find(x=>x.id===id); if(!q) return;
    q.status = st; await Store.put('queue', q); UI.render();
  },
  /* Pressing Done closes the whole row, however many copies were left on it,
     which is what the button has always meant. Bringing the count up to match
     keeps it agreeing with a row that was finished a copy at a time instead. */
  async close(q){
    q.status = 'done'; q.doneAt = Date.now(); q.doneQty = q.qty || 1;
    q.jobFile = ''; q.jobPrinter = '';
    await Store.put('queue', q);
  },

  done(id){
    const q = Store.queue.find(x=>x.id===id); if(!q) return;
    Modal.confirm('Mark as printed?', 'Do you want to log this as a print at the same time? That records the filament, settings, and how it turned out.',
      async ()=>{
        await Queue.close(q);
        UI.render();
        Prints.log(q.modelId);
        setTimeout(()=>{ const f=document.getElementById('pFil'); if(f && q.filamentId) f.value=q.filamentId;
          const p=document.getElementById('pPrinter'); if(p && q.printer) p.value=q.printer; }, 60);
      }, 'Yes, log the print');
    const foot = document.querySelector('#modal .pv-mf');
    if(foot){
      const b = document.createElement('button');
      b.className='b'; b.textContent='Just mark done';
      b.onclick = async ()=>{ await Queue.close(q); Modal.close(); UI.render(); };
      foot.insertBefore(b, foot.firstChild);
    }
  },
  async del(id){ await Store.remove('queue', id); UI.render(); },
  clearDone(){
    Modal.confirm('Clear completed?', 'Removes finished queue entries. Print logs are not affected.', async ()=>{
      const ids = Store.queue.filter(q=>q.status==='done').map(q=>q.id);
      await DB.delMany('queue', ids);
      Store.queue = Store.queue.filter(q=>q.status!=='done');
      Modal.close(); UI.render(); Toast.ok('Cleared '+ids.length+' entries');
    }, 'Clear');
  }
};

/* ============================================================
   Dupes — duplicate + cleanup finder
   ============================================================ */
/* ============================================================
   AutoTag — turn the folder tree into tags

   A library that has been organised by hand already carries the information:
   Figurines/Breaking Bad/Heisenberg says more than any tag anyone would sit
   down and type. This proposes tags from each model's path and waits for you
   to approve them, because guessing wrong silently would be worse than not
   guessing at all.
   ============================================================ */
const AutoTag = {
  // folder names that describe packaging rather than the thing itself
  SKIP: new Set(['zips','zip','archive','archives','downloads','download','new folder','misc','other',
    'stuff','things','temp','tmp','sorted','unsorted','to sort','to print','printed','done',
    'printvault quarantine','quarantine']),

  clean(seg){
    let t = String(seg||'')
      .replace(/[_+]+/g,' ').replace(/(\S)-(\S)/g,'$1 $2')
      .replace(/\s*-\s*\d{5,}\s*$/,'')          // trailing thingiverse-style ids
      .replace(/\b\d{6,}\b/g,' ')                 // bare long numbers
      .replace(/\b(stl|stls|3mf|gcode|files?|model_files|fan art|no ams|multiparts?)\b/gi,' ')
      .replace(/\s+/g,' ').trim();
    if(t.length < 3 || t.length > 44) return '';
    if(/^\d+$/.test(t)) return '';
    if(AutoTag.SKIP.has(t.toLowerCase())) return '';
    const q = (Store.settings.quarantineDir||'').replace(/[_+]+/g,' ').trim().toLowerCase();
    if(q && t.toLowerCase() === q) return '';
    return t.replace(/\b\w/g, c=>c.toUpperCase());
  },

  /* How many models sit under each folder. A folder holding one model is that
     model's own folder, and its name is the model name, which makes a useless
     tag: it groups nothing. A folder holding several is a category, and that
     is worth a tag. Counting is a far better test than guessing from the
     length of the name, which is what this used to do. */
  counts(){
    const c = new Map();
    for(const m of Store.models){
      let d = U.dir(m.path);
      while(d){ c.set(d, (c.get(d)||0)+1); d = U.dir(d); }
    }
    return c;
  },

  /* Tags for one model: the folders above it, nearest first. */
  forModel(m, counts){
    counts = counts || AutoTag.counts();
    const segs = U.dir(m.path).split('/').filter(Boolean);
    const out = [];
    let acc = '';
    for(const seg of segs){
      acc = acc ? acc + '/' + seg : seg;
      if(GENERIC_DIRS.has(seg.toLowerCase())) continue;
      if((counts.get(acc)||0) < 2) continue;      // that model's own folder
      const t = AutoTag.clean(seg);
      if(t && !out.includes(t)) out.push(t);
    }
    return out.slice(0, 3);
  },

  /* Names are titleized when a model is first indexed, so a library built
     before a change to that keeps the old spelling: plus signs from downloads
     stayed until something re-created the record. This offers to redo them,
     and shows the list first, because a name is something you may have set
     yourself and would not want quietly rewritten. */
  tidyRows(){
    const rows = [];
    for(const m of Store.models){
      const files = Store.modelFiles(m.id);
      const loose = files.length === 1 && files[0].path === m.path;
      const src = loose ? U.stem(U.base(m.path)) : (U.base(m.path) || '');
      const want = U.titleize(src) || src;
      /* Only when the stored name is the same words with the separators still
         in it. That catches Working+to+the+Bone+ +Office+Skeleton and leaves
         anything you typed yourself alone, rather than offering to overwrite
         a name you chose with the folder it happens to live in. */
      if(want && want !== m.name && U.titleize(m.name) === want)
        rows.push({id:m.id, from:m.name, to:want});
    }
    return rows;
  },
  tidyNames(){
    const rows = AutoTag._tidy = AutoTag.tidyRows();
    if(!rows.length) return Toast.ok('Every name already reads the way it would today');
    let h = '<p style="color:var(--dim);font-size:13px;line-height:1.65;margin:0 0 14px">'+
      'Re-reads each name from the file or folder it came from. Anything you renamed yourself will show up '+
      'here too, so uncheck those.</p>'+
      '<div style="max-height:48vh;overflow:auto;border:1px solid var(--line);border-radius:8px">'+
      rows.map((r,i)=>'<label class="chk" style="display:flex;gap:10px;align-items:flex-start;padding:8px 10px;'+
        'border-top:1px solid var(--line);margin:0"><input type="checkbox" checked data-tn="'+i+'">'+
        '<span style="flex:1;min-width:0;font-size:13px"><span style="color:var(--dim2);text-decoration:line-through">'+
        U.esc(r.from)+'</span><br><b>'+U.esc(r.to)+'</b></span></label>').join('')+'</div>';
    Modal.open('Tidy names ('+rows.length+')', h,
      '<button class="b" onclick="PV.AutoTag.tidyNone()">Select none</button>'+
      '<button class="b" onclick="PV.AutoTag.tidyAll()">Select all</button>'+
      '<div class="sp"></div><button class="b" onclick="PV.Modal.back()">Cancel</button>'+
      '<button class="b p" onclick="PV.AutoTag.tidyApply()">Rename</button>');
  },
  tidyAll(){ document.querySelectorAll('#modal [data-tn]').forEach(c=>c.checked=true); },
  tidyNone(){ document.querySelectorAll('#modal [data-tn]').forEach(c=>c.checked=false); },
  async tidyApply(){
    const rows = AutoTag._tidy || [];
    const picked = Array.from(document.querySelectorAll('#modal [data-tn]'))
      .filter(c=>c.checked).map(c=>rows[+c.dataset.tn]).filter(Boolean);
    const upd = [];
    for(const r of picked){
      const m = Store.model(r.id); if(!m) continue;
      m.name = r.to; upd.push(m);
    }
    for(const m of upd) await Store.put('models', m);
    Modal.close(); UI.render();
    Toast.ok(upd.length ? 'Renamed '+upd.length+' model'+(upd.length===1?'':'s') : 'Nothing changed');
  },

  propose(){
    const rows = [];
    const counts = AutoTag.counts();
    for(const m of Store.models){
      const have = new Set((m.tags||[]).map(t=>t.toLowerCase()));
      const add = AutoTag.forModel(m, counts).filter(t=>!have.has(t.toLowerCase()));
      if(add.length) rows.push({id:m.id, name:m.name, path:m.path, add});
    }
    return rows;
  },

  open(){
    const rows = AutoTag._rows = AutoTag.propose();
    if(!rows.length) return Toast.ok('Nothing to suggest, every model already carries its folder names');
    const counts = new Map();
    rows.forEach(r=>r.add.forEach(t=>counts.set(t,(counts.get(t)||0)+1)));
    const top = Array.from(counts.entries()).sort((a,b)=>b[1]-a[1]);

    let h = '<p style="color:var(--dim);font-size:13px;line-height:1.65;margin:0 0 14px">'+
      'Proposed from the folders each model sits in. Nothing is applied until you say so, and existing tags are kept.</p>'+
      '<div style="margin-bottom:14px">'+top.slice(0,24).map(([t,n])=>
        '<span class="tg" style="margin:0 4px 4px 0;display:inline-block">'+U.esc(t)+' <b style="color:var(--dim2)">'+n+'</b></span>').join('')+
        (top.length>24?'<span style="color:var(--dim2);font-size:12px"> +'+(top.length-24)+' more</span>':'')+'</div>'+
      '<div style="max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:8px">';
    h += rows.map((r,i)=>'<label class="chk" style="display:flex;gap:10px;align-items:flex-start;padding:8px 10px;'+
      'border-top:1px solid var(--line);margin:0">'+
      '<input type="checkbox" checked data-at="'+i+'">'+
      '<span style="flex:1;min-width:0"><b style="font-size:13px">'+U.esc(r.name)+'</b>'+
      '<span style="display:block;margin-top:3px">'+r.add.map(t=>'<span class="tg">'+U.esc(t)+'</span>').join('')+'</span></span></label>').join('');
    h += '</div>';

    Modal.open('Suggest tags from folders ('+rows.length+' models)', h,
      '<button class="b" onclick="PV.AutoTag.none()">Select none</button>'+
      '<button class="b" onclick="PV.AutoTag.all()">Select all</button>'+
      '<div class="sp"></div><button class="b" onclick="PV.Modal.back()">Cancel</button>'+
      '<button class="b p" onclick="PV.AutoTag.apply()">Apply</button>');
  },
  all(){ document.querySelectorAll('#modal [data-at]').forEach(c=>c.checked=true); },
  none(){ document.querySelectorAll('#modal [data-at]').forEach(c=>c.checked=false); },

  async apply(){
    const rows = AutoTag._rows || [];
    const picked = Array.from(document.querySelectorAll('#modal [data-at]'))
      .filter(c=>c.checked).map(c=>rows[+c.dataset.at]).filter(Boolean);
    if(!picked.length) return Modal.back();
    const upd = [];
    for(const r of picked){
      const m = Store.model(r.id); if(!m) continue;
      const have = new Set((m.tags||[]).map(t=>t.toLowerCase()));
      m.tags = (m.tags||[]).concat(r.add.filter(t=>!have.has(t.toLowerCase())));
      upd.push(m);
    }
    for(const m of upd) await Store.put('models', m);
    Modal.close(); UI.render();
    Toast.ok('Tagged '+upd.length+' model'+(upd.length===1?'':'s'));
  }
};

const Dupes = {
  mode:'exact',
  sel:new Set(),

  /* Lower score wins the "keep" slot. The rules encode what a person would
     obviously pick, rather than guessing from timestamps alone. */
  keepScore(f){
    const base = U.base(f.path).toLowerCase();
    let s = 0;
    if(/[-_ ]copy(\s|\.|\)|$)/.test(base) || /\bcopy of\b/.test(base)) s += 1000;
    if(/\(\d+\)\s*\.[a-z0-9]+$/.test(base)) s += 1000;          // "thing (1).stl"
    if(/[-_ ]v?\d+\s*\.[a-z0-9]+$/.test(base) === false) s += 0;
    const prefer = String(Store.settings.keepPrefer||'').trim().toLowerCase();
    if(prefer && f.path.toLowerCase().indexOf(prefer) === 0) s -= 500;
    s += f.path.split('/').length * 10;                          // shallower wins
    s += f.path.length * 0.05;
    return s;
  },
  /* Order a group so the file to keep is first */
  ranked(files){
    return files.slice().sort((a,b)=>
      Dupes.keepScore(a) - Dupes.keepScore(b) || (a.mtime||0) - (b.mtime||0) || a.path.localeCompare(b.path));
  },
  selectedFiles(){
    return Array.from(Dupes.sel).map(id=>Store.file(id)).filter(Boolean);
  },
  selectAllExtras(groups){
    Dupes.sel.clear();
    groups.forEach(g=>Dupes.ranked(g.files).slice(1).forEach(f=>Dupes.sel.add(f.id)));
    UI.render();
  },
  clearSel(){ Dupes.sel.clear(); UI.render(); },
  toggle(id){ Dupes.sel.has(id) ? Dupes.sel.delete(id) : Dupes.sel.add(id); UI.render(); },
  toggleGroup(key){
    const g = Dupes.groups().concat(Dupes.nameGroups()).find(x=>x.key===key);
    if(!g) return;
    const extras = Dupes.ranked(g.files).slice(1);
    const allOn = extras.every(f=>Dupes.sel.has(f.id));
    extras.forEach(f=>allOn ? Dupes.sel.delete(f.id) : Dupes.sel.add(f.id));
    UI.render();
  },

  groups(){
    const byHash = new Map();
    Store.files.forEach(f=>{
      if(!f.sha) return;
      if(!byHash.has(f.sha)) byHash.set(f.sha, []);
      byHash.get(f.sha).push(f);
    });
    const out = [];
    byHash.forEach((list, sha)=>{ if(list.length > 1) out.push({key:sha, files:list, size:list[0].size,
      waste:(list.length-1)*list[0].size}); });
    return out.sort((a,b)=>b.waste - a.waste);
  },

  nameGroups(){
    const by = new Map();
    Store.files.forEach(f=>{
      if(f.size < 2048) return;
      const k = f.name.toLowerCase()+'|'+f.size;
      if(!by.has(k)) by.set(k, []);
      by.get(k).push(f);
    });
    const out = [];
    by.forEach((list,k)=>{
      if(list.length < 2) return;
      if(list.every(f=>f.sha) && U.uniq(list.map(f=>f.sha)).length === 1) return; // already covered by exact
      out.push({key:k, files:list, size:list[0].size, waste:(list.length-1)*list[0].size});
    });
    return out.sort((a,b)=>b.waste - a.waste);
  },

  /* Models that are probably the same thing twice.

     Hashing only catches byte-identical files, so a re-export or a second
     download of the same model slips past: two copies of the same figure can
     differ by a few thousand bytes and share nothing at the hash level. This
     matches on the name instead, after stripping the noise that downloads
     accumulate, and treats an obvious size gap as a hint rather than a rule. */
  modelKey(m){
    return String(m.name||'')
      .toLowerCase()
      .replace(/[_+]+/g,' ')
      /* Download ids, not words. The second half of this used to be
         [a-z0-9]{6}\d*, which matches any six character word, so "statue",
         "dragon", "helmet", "bottle" and "holder" were all being deleted out
         of model names. Names made of nothing but six letter words came out
         empty and fell through the length guard below, which took them out of
         duplicate checking altogether, and unrelated ones collided: "Cool
         Dragon Thing" and "Cool Holder Thing" both reduced to "cool thing".
         An id is six or more characters carrying both a digit and a letter,
         which a word never is. Erring towards keeping things: leaving an id in
         means two copies of a model fail to group, while stripping a word
         means two different models are offered up as one, and the second is
         the one that loses files. */
      .replace(/\b(?:\d{6,}|(?=[a-z0-9]{6,}\b)(?=[a-z0-9]*\d)(?=[a-z0-9]*[a-z])[a-z0-9]+)\b/g,' ')
      .replace(/\b(?:copy|final|v\d+|fan art|no ams|multiparts?|stls?|3mf|gcode|files?|model files|remix|updated|new|old|\(\d+\))\b/g,' ')
      .replace(/[^a-z0-9 ]+/g,' ')
      .replace(/\s+/g,' ').trim();
  },
  /* Which format a model actually is, weighed by bytes rather than by file
     count: one small stl sitting beside a big 3mf should not make the whole
     model an stl. Empty when there is no mesh at all, which leaves those
     grouping on the name alone the way they always did. */
  formatOf(m, byModel){
    const bytes = new Map();
    for(const f of (byModel.get(m.id) || [])){
      if(f.kind !== 'mesh') continue;
      bytes.set(f.ext, (bytes.get(f.ext) || 0) + (f.size || 0));
    }
    let best = '', most = -1;
    bytes.forEach((n, ext)=>{ if(n > most){ most = n; best = ext; } });
    return best;
  },
  modelGroups(){
    const byModel = new Map();
    for(const f of Store.files){
      if(!byModel.has(f.modelId)) byModel.set(f.modelId, []);
      byModel.get(f.modelId).push(f);
    }
    const by = new Map();
    for(const m of Store.models){
      const k = Dupes.modelKey(m);
      if(k.length < 4) continue;
      /* The same model in two formats is not the same model twice. modelKey
         takes "stl" and "3mf" out of the name on purpose, so that "Dragon STL"
         groups with "Dragon", and the cost of that was "Dragon STL" and
         "Dragon 3MF" landing on one key and being offered up as a copy to
         delete. Keying on the format as well keeps those apart, and reads it
         off the files rather than the folder name, which is the part that
         lies. A model holding both formats has one dominant format and still
         groups with another copy of itself. */
      const kk = k + '#' + Dupes.formatOf(m, byModel);
      if(!by.has(kk)) by.set(kk, []);
      by.get(kk).push(m);
    }
    const out = [];
    by.forEach((list,k)=>{
      if(list.length < 2) return;
      const sorted = list.slice().sort((a,b)=>(b.bytes||0)-(a.bytes||0));
      const waste = sorted.slice(1).reduce((s,m)=>s+(m.bytes||0), 0);
      out.push({key:k, models:sorted, waste});
    });
    return out.sort((a,b)=>b.waste - a.waste);
  },
  msel: new Set(),
  toggleModel(cb){ cb.checked ? Dupes.msel.add(cb.dataset.mid) : Dupes.msel.delete(cb.dataset.mid); UI.render(); },
  clearModelSel(){ Dupes.msel.clear(); UI.render(); },
  selectCopies(){
    // the first in each group is the one being kept, so tick every other one
    Dupes.modelGroups().forEach(g=>g.models.slice(1).forEach(m=>Dupes.msel.add(m.id)));
    UI.render();
  },
  ignoreSelected(){
    const ids = Array.from(Dupes.msel).filter(id=>Store.model(id));
    if(!ids.length) return Toast.err('Nothing selected');
    const byRoot = new Map();
    for(const id of ids){
      const m = Store.model(id);
      const files = Store.modelFiles(m.id);
      const isDir = !(files.length === 1 && files[0].path === m.path);
      const path = isDir ? m.path : U.dir(m.path);
      if(!path) continue;
      if(!byRoot.has(m.rootId)) byRoot.set(m.rootId, []);
      byRoot.get(m.rootId).push(path);
    }
    const total = Array.from(byRoot.values()).reduce((n,a)=>n+a.length, 0);
    if(!total) return Toast.err('None of those sit in a folder that can be ignored on its own');
    Modal.confirm('Stop indexing '+total+' folder'+(total===1?'':'s')+'?',
      'Their files stay exactly where they are and simply stop being indexed, so the duplicate cards go away. '+
      'Undo any of it in Settings under Indexed folders.<div class="mono" style="margin-top:8px;font-size:11px;'+
      'color:var(--dim2);max-height:180px;overflow:auto;word-break:break-all">'+
      Array.from(byRoot.entries()).map(([rid,paths])=>paths.map(p=>
        U.esc((Store.root(rid)||{}).name||'')+'/'+U.esc(p)).join('<br>')).join('<br>')+'</div>',
      async ()=>{
        for(const [rid, paths] of byRoot){
          const r = Store.root(rid); if(!r) continue;
          r.excludes = U.uniq((r.excludes||[]).concat(paths));
          await Store.put('roots', r);
        }
        Dupes.msel.clear();
        Modal.close();
        Toast.ok('Ignoring '+total+', reindexing');
        await Scan.run(Array.from(byRoot.keys()));
      }, 'Ignore them', true);
  },

  async ignoreModel(id){
    const m = Store.model(id); if(!m) return;
    const r = Store.root(m.rootId); if(!r) return;
    const files = Store.modelFiles(m.id);
    const isDir = !(files.length === 1 && files[0].path === m.path);
    const path = isDir ? m.path : U.dir(m.path);
    if(!path) return Toast.err('Nothing sensible to ignore there');
    r.excludes = (r.excludes||[]).concat([path]);
    await Store.put('roots', r);
    Toast.ok('Ignoring '+U.base(path)+', reindexing');
    await Scan.run([r.id]);
  },

  archives(){
    const dirs = new Set();
    Store.files.forEach(f=>{ let d = U.dir(f.path); while(d){ dirs.add(f.rootId+'|'+d.toLowerCase()); d = U.dir(d); } });
    return Store.files.filter(f=>{
      if(f.kind !== 'arch') return false;
      const stem = U.stem(f.name).toLowerCase();
      const parent = U.dir(f.path);
      return dirs.has(f.rootId+'|'+(parent ? parent.toLowerCase()+'/'+stem : stem));
    }).sort((a,b)=>b.size - a.size);
  },

  render(v){
    const hashed = Store.files.filter(f=>f.sha).length;
    const exact = Dupes.groups(), similar = Dupes.nameGroups(), arch = Dupes.archives();
    const dupModels = Dupes.modelGroups();
    const waste = exact.reduce((s,g)=>s+g.waste, 0);
    const archWaste = arch.reduce((s,f)=>s+f.size, 0);

    const selN = Dupes.sel.size;
    const selBytes = Dupes.selectedFiles().reduce((s,f)=>s+(f.size||0), 0);
    const quarantine = Store.settings.dupeAction !== 'delete';
    let h = '<div class="pv-bar"><h2>Duplicates &amp; Cleanup</h2><div class="sp"></div>'+
      (selN ? '<span class="cnt">'+selN+' selected · '+U.bytes(selBytes)+'</span>'+
              '<button class="b sm" onclick="PV.Dupes.clearSel()">Clear</button>'+
              '<button class="b sm '+(quarantine?'p':'d')+'" onclick="PV.Dupes.reviewSelected()">'+
                (quarantine ? I.folder+' Quarantine '+selN : I.trash+' Delete '+selN)+'</button>'
            : (exact.length || similar.length
               ? '<button class="b sm p" onclick="PV.Dupes.selectAll()">'+I.check+' Select all extras</button>' : ''))+
      '<button class="b sm" onclick="PV.Dupes.hash()">'+I.refresh+' Hash files</button></div>';

    h += '<div class="stats">'+
      '<div class="stat"><div class="k">Exact duplicates</div><div class="v">'+exact.length+'</div><div class="sub">groups by SHA-256</div></div>'+
      '<div class="stat"><div class="k">Reclaimable</div><div class="v" style="color:'+(waste?'var(--acc)':'inherit')+'">'+U.bytes(waste)+'</div><div class="sub">redundant copies</div></div>'+
      '<div class="stat"><div class="k">Same name + size</div><div class="v">'+similar.length+'</div><div class="sub">unverified, hash to confirm</div></div>'+
      '<div class="stat"><div class="k">Extracted archives</div><div class="v">'+arch.length+'</div><div class="sub">'+U.bytes(archWaste)+' in archives</div></div>'+
      '</div>';

    h += '<div class="seg" style="margin-bottom:14px;width:fit-content">'+
      [['exact','Exact ('+exact.length+')'],['similar','Same name ('+similar.length+')'],
       ['models','Same model ('+dupModels.length+')'],['arch','Archives ('+arch.length+')']]
      .map(m=>'<button class="'+(Dupes.mode===m[0]?'on':'')+'" onclick="PV.Dupes.setMode(\''+m[0]+'\')">'+m[1]+'</button>').join('')+'</div>';

    if(Dupes.mode === 'exact'){
      if(hashed === 0){
        h += '<div class="pv-empty">'+I.copy+'<h3>Nothing hashed yet</h3>'+
          '<p>To find byte-identical files, Printery reads and hashes them. It only hashes files that share an exact size with another file, so it skips almost everything.</p>'+
          '<button class="b p" onclick="PV.Dupes.hash()">'+I.refresh+' Hash candidate files</button></div>';
      } else if(!exact.length){
        h += '<div class="pv-empty">'+I.check+'<h3>No exact duplicates</h3><p>'+hashed.toLocaleString()+' files hashed, all unique.</p></div>';
      } else {
        h += '<div class="note">Files below are byte-identical. The first in each group is marked to keep. '+
             '<b>Deleting removes the file from disk permanently</b>, so check the paths first.</div>';
        h += exact.slice(0, 200).map(g=>Dupes.group(g, 'sha')).join('');
        if(exact.length > 200) h += '<div style="color:var(--dim2);font-size:12.5px;padding:8px">Showing the 200 largest groups of '+exact.length+'.</div>';
      }
    } else if(Dupes.mode === 'similar'){
      if(!similar.length) h += '<div class="pv-empty">'+I.check+'<h3>No name+size matches</h3><p>Nothing looks like an obvious copy.</p></div>';
      else {
        h += '<div class="note"><b>Not verified.</b> These files share a filename and byte size, which usually means a copy, but only hashing proves it. Run <b>Hash files</b> to confirm before deleting anything.</div>';
        h += similar.slice(0,150).map(g=>Dupes.group(g, 'name')).join('');
      }
    } else if(Dupes.mode === 'models'){
      if(!dupModels.length) h += '<div class="pv-empty">'+I.check+'<h3>No repeated models</h3>'+
        '<p>Nothing looks like the same thing filed twice.</p></div>';
      else {
        h += '<div class="note">These look like the same model more than once, matched on the name rather than the bytes, '+
          'so a re-export or a second download is caught where hashing would miss it. <b>Check before acting</b>: two '+
          'genuinely different models can share a name. Ignoring one leaves the files on disk and simply stops indexing them.</div>';
        h += dupModels.slice(0,120).map(g=>{
          const rows = g.models.map((m,i)=>{
            const r = Store.root(m.rootId)||{};
            return '<div class="dupe-f">'+
              '<span class="ext '+(i?'':'ok')+'">'+(i?'copy':'keep')+'</span>'+
              '<span class="p" title="'+U.attr(m.path)+'">'+U.esc(r.name||'')+'/'+U.esc(m.path)+'</span>'+
              '<span class="mono" style="color:var(--dim2);font-size:11px">'+(m.fileCount||0)+' file'+((m.fileCount===1)?'':'s')+' · '+U.bytes(m.bytes||0)+'</span>'+
              (i ? '<label class="chk" style="margin:0 0 0 4px"><input type="checkbox" data-mid="'+U.attr(m.id)+'"'+
                   (Dupes.msel.has(m.id)?' checked':'')+' onchange="PV.Dupes.toggleModel(this)"> </label>' : '')+
              '<button class="b g sm" onclick="PV.Detail.open(\''+m.id+'\')">Open</button>'+
              (i ? '<button class="b g sm" onclick="PV.Dupes.ignoreModel(\''+m.id+'\')">Ignore</button>' : '')+
              '</div>';
          }).join('');
          return '<div class="dupe"><div class="dupe-h"><b>'+U.esc(g.models[0].name)+'</b>'+
            '<span class="hash">'+g.models.length+' copies</span><div class="sp"></div>'+
            '<span class="hash">'+U.bytes(g.waste)+' in the extras</span></div>'+rows+'</div>';
        }).join('');
        if(dupModels.length > 120) h += '<div style="color:var(--dim2);font-size:12.5px;padding:8px">Showing 120 of '+dupModels.length+'.</div>';
      }
    } else {
      if(!arch.length) h += '<div class="pv-empty">'+I.check+'<h3>No leftover archives</h3><p>No zip, 7z or rar files sitting next to a folder of the same name.</p></div>';
      else {
        h += '<div class="note">Each archive below has a sibling folder with the same name, so it was probably already extracted. Deleting the archive is usually safe, but Printery cannot look inside rar or 7z files to verify.</div>';
        h += '<div class="dupe"><div class="dupe-h"><b>'+arch.length+' archives</b><span class="hash">'+U.bytes(archWaste)+' total</span><div class="sp"></div>'+

      '<label class="chk" style="margin:0" title="Select the extra copies in this group">'+

          JSON.stringify(g.key).replace(/"/g,'&quot;')+')"></label>'+
      '<b>'+files.length+' copies</b><span class="hash">'+U.bytes(g.size)+' each'+

      '<div class="sp"></div><span style="color:var(--acc);font-size:12px">'+U.bytes(g.waste)+' reclaimable</span>'+
      '</div>'+

        (i===0 ? '<span class="bdg ok">keep</span>'
               : '<label class="chk" style="margin:0"><input type="checkbox"'+(Dupes.sel.has(f.id)?' checked':'')+
                 ' onchange="PV.Dupes.toggle(\''+f.id+'\')"></label>')+
        '<span class="p" title="'+U.attr(f.path)+'">'+U.esc((Store.root(f.rootId)||{}).name+'/'+f.path)+'</span>'+
        '<span class="mono" style="color:var(--dim2);font-size:11px">'+U.date(f.mtime)+'</span>'+
        (f.modelId && Store.model(f.modelId) ? '<button class="b g sm ico" onclick="PV.Detail.open(\''+f.modelId+'\')" title="Open model">'+I.eye+'</button>' : '')+
      '</div>').join('')+'</div>';
