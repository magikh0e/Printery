<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Printery — 3D Print Library Manager</title>
<meta name="description" content="Local-first 3D print file manager. Index your STL/3MF/gcode folders, tag and search models, track print history, find duplicates, and manage filament. No accounts, no uploads, no tracking.">
<meta name="author" content="magikh0e">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23ff8a3d' d='M16 2 3 9v14l13 7 13-7V9zm0 3.3 9.4 5.1L16 15.5 6.6 10.4zM5.5 12.5 15 17.6v9.1l-9.5-5.1zm11.5 14.2v-9.1l9.5-5.1v9.1z'/%3E%3C/svg%3E">
<style>
:root{
  /* The engine paints parts of a form control itself: a select's body, the
     number spinners, the date picker, scrollbars. Those follow color-scheme,
     not our background, which is why a select ignored the light theme while the
     input beside it obeyed it. Declared only in a meta tag before, so the OS
     decided, and a Linux desktop with a dark GTK theme kept painting them dark
     on a light page (issue #5). Reproduced and fixed against WebKitGTK, which
     is what the Linux build renders with; Chromium never showed it. */
  color-scheme: dark;
  --bg:#0e1014; --bg2:#151920; --bg3:#1c212b; --bg4:#242b38;
  --line:#2a313d; --line2:#3a4453;
  --txt:#e7eaf0; --dim:#8d97a8; --dim2:#69738a;
  --acc:#ff8a3d; --accd:#c9662a; --acc-soft:rgba(255,138,61,.13);
  --ok:#3ddc97; --warn:#ffd166; --bad:#ff6060; --info:#5aa9ff;
  --r:10px; --r2:14px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.28);
}
html[data-theme=light]{
  color-scheme: light;
  --bg:#f6f7f9; --bg2:#fff; --bg3:#f0f2f5; --bg4:#e4e8ee;
  --line:#dde2e9; --line2:#c6cdd8;
  --txt:#151a21; --dim:#5f6b7d; --dim2:#8a94a4;
  --acc:#e06a15; --accd:#b8540c; --acc-soft:rgba(224,106,21,.1);
  --sh:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
::selection{background:var(--acc-soft);color:var(--txt)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--dim2)}
button,input,select,textarea{font:inherit;color:inherit}
svg{width:16px;height:16px;flex:0 0 auto}   /* fallback size; every specific rule below wins */
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
code,kbd,.mono{font-family:var(--mono);font-size:.92em}

/* ---------- layout ---------- */
.pv-app{display:flex;flex-direction:column;height:100dvh}
/* demo bar, sits above the header in the same column so nothing overlaps */
.pv-demo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex:0 0 auto;
  padding:8px 14px;background:var(--acc-soft);border-bottom:1px solid var(--line);
  font-size:13px;line-height:1.4}
.pv-demo b{color:var(--acc)}
.pv-demo span{color:var(--dim);min-width:0}
.pv-demo a{margin-left:auto;white-space:nowrap;text-decoration:none;font-weight:600;
  padding:5px 11px;border-radius:7px;background:var(--acc);color:#12141a}
.pv-demo a.q{margin-left:0;background:transparent;color:var(--dim);border:1px solid var(--line)}
.pv-demo a:hover{filter:brightness(1.08)}
@media(max-width:640px){ .pv-demo span{flex:1 1 100%;order:3} .pv-demo a{margin-left:0} }
.pv-top{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--bg2);border-bottom:1px solid var(--line);flex:0 0 auto;position:relative;z-index:30}
.pv-brand{display:flex;align-items:center;gap:9px;font-weight:750;letter-spacing:-.02em;font-size:15px;white-space:nowrap;user-select:none}
.pv-brand svg{width:22px;height:22px;flex:0 0 auto}
.pv-brand span i{font-style:normal;color:var(--acc)}
.pv-ver{font:600 10px/1 var(--mono);color:var(--dim2);background:var(--bg3);border:1px solid var(--line);padding:3px 5px;border-radius:5px}

.pv-search{flex:1;max-width:520px;position:relative;display:flex;align-items:center}
.pv-search svg{position:absolute;left:10px;width:15px;height:15px;color:var(--dim2);pointer-events:none}
.pv-search input{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:8px 30px 8px 32px;outline:none}
.pv-search input:focus{border-color:var(--acc);background:var(--bg)}
.pv-search kbd{position:absolute;right:8px;font:600 10px/1 var(--mono);color:var(--dim2);background:var(--bg4);border:1px solid var(--line);padding:3px 5px;border-radius:4px}
.pv-search input:focus + kbd{display:none}

.pv-top .sp{flex:1}
.pv-tabs{display:flex;gap:2px;padding:0 10px;background:var(--bg2);border-bottom:1px solid var(--line);flex:0 0 auto;overflow-x:auto;scrollbar-width:none}
.pv-tabs::-webkit-scrollbar{display:none}
.pv-tab{display:flex;align-items:center;gap:7px;background:none;border:0;border-bottom:2px solid transparent;padding:9px 13px;color:var(--dim);cursor:pointer;white-space:nowrap;font-weight:550;transition:color .12s}
.pv-tab svg{width:15px;height:15px}
.pv-tab:hover{color:var(--txt)}
.pv-tab.on{color:var(--acc);border-bottom-color:var(--acc)}
.pv-tab .ct{font:600 10px/1 var(--mono);background:var(--bg4);color:var(--dim);padding:3px 5px;border-radius:20px;min-width:18px;text-align:center}
.pv-tab.on .ct{background:var(--acc-soft);color:var(--acc)}

.pv-body{flex:1;display:flex;min-height:0}
.pv-side{width:232px;flex:0 0 auto;background:var(--bg2);border-right:1px solid var(--line);overflow-y:auto;padding:10px 0 40px}
.pv-side.hide{display:none}
/* Hidden until the sidebar turns into an overlay, which is the only width
   where it needs its own control. Tag-qualified because .b sets display and
   is declared later, so a bare .hide-lg loses to it. */
button.hide-lg{display:none}
.pv-scrim{display:none}
.pv-main{flex:1;overflow-y:auto;padding:16px 18px 60px;min-width:0}
.pv-view{display:none}
.pv-view.on{display:block}

/* ---------- sidebar ---------- */
.pv-sg{margin-bottom:6px}
.pv-sh{display:flex;align-items:center;gap:6px;padding:7px 14px 5px;font:650 10.5px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--dim2)}
.pv-sh button{margin-left:auto;background:none;border:0;color:var(--dim2);cursor:pointer;padding:2px;display:flex;border-radius:4px}
.pv-sh button:hover{color:var(--acc);background:var(--bg4)}
.pv-sh svg{width:13px;height:13px}
.pv-si{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:6px 14px;color:var(--dim);cursor:pointer;text-align:left;font-size:13px;border-left:2px solid transparent}
.pv-si:hover{background:var(--bg3);color:var(--txt)}
.pv-si.on{background:var(--acc-soft);color:var(--acc);border-left-color:var(--acc);font-weight:600}
.pv-si svg{width:14px;height:14px;flex:0 0 auto;opacity:.85}
.pv-si .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-si .c{font:600 10px/1 var(--mono);color:var(--dim2)}
.pv-si .dot{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.pv-root{position:relative}
.pv-root .x{opacity:0;background:none;border:0;color:var(--dim2);cursor:pointer;padding:2px;display:flex}
.pv-root:hover .x{opacity:1}
.pv-root .x:hover{color:var(--bad)}

/* ---------- buttons ---------- */
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--bg3);border:1px solid var(--line);color:var(--txt);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:550;white-space:nowrap;transition:background .12s,border-color .12s,transform .06s}
.b:hover{background:var(--bg4);border-color:var(--line2)}
.b:active{transform:translateY(1px)}
.b:disabled{opacity:.45;cursor:not-allowed;transform:none}
.b svg{width:15px;height:15px}
.b.p{background:var(--acc);border-color:var(--acc);color:#1a0d03;font-weight:650}
.b.p:hover{background:var(--acc2,#ffa05e);border-color:var(--acc2,#ffa05e)}
.b.g{background:none;border-color:transparent;color:var(--dim);padding:6px 8px}
.b.g:hover{background:var(--bg3);color:var(--txt)}
.b.d{border-color:transparent;color:var(--bad)}
.b.d:hover{background:rgba(255,96,96,.12);border-color:rgba(255,96,96,.3)}
.b.sm{padding:5px 9px;font-size:12.5px;border-radius:7px}
.b.sm svg{width:13px;height:13px}
.b.ico{padding:7px;border-radius:8px}
.seg{display:flex;background:var(--bg3);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 10px;color:var(--dim);cursor:pointer;display:flex;align-items:center;gap:5px;font-size:12.5px}
.seg button:hover{color:var(--txt);background:var(--bg4)}
.seg button.on{background:var(--acc-soft);color:var(--acc)}
.seg button svg{width:14px;height:14px}

/* ---------- forms ---------- */
.f{display:block;margin-bottom:12px}
.f>label{display:block;font-size:11.5px;font-weight:600;color:var(--dim);margin-bottom:5px;letter-spacing:.02em}
.f input,.f select,.f textarea{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--acc);background:var(--bg)}
.f textarea{resize:vertical;min-height:70px;font-family:inherit}
.f .hint{font-size:11.5px;color:var(--dim2);margin-top:4px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
input[type=color]{padding:2px;height:36px;cursor:pointer}
input[type=checkbox]{width:auto;accent-color:var(--acc);cursor:pointer}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;padding:4px 0}

/* ---------- toolbar ---------- */
/* While things are selected the bar follows you down the page, so the action
   you are part way through is never scrolled off. */
.pv-bar.stick{position:sticky;top:0;z-index:30;background:var(--bg);
  padding:8px 0 10px;margin-bottom:8px;box-shadow:0 10px 18px -14px rgba(0,0,0,.85)}
.pv-bar.stick::before{content:'';position:absolute;left:-20px;right:-20px;top:0;bottom:0;
  background:var(--bg);z-index:-1}
@media(max-width:700px){.pv-bar.stick{top:0}}
.pv-bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.pv-bar h2{font-size:19px;margin-right:2px}
.pv-bar .sp{flex:1}
.pv-bar .cnt{color:var(--dim2);font:500 12.5px/1 var(--mono)}

/* ---------- model grid ---------- */
.pv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:13px}
.pv-card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:border-color .13s,transform .13s,box-shadow .13s;position:relative}
/* Keyboard focus only. focus-visible keeps the ring off a plain mouse click,
   where it reads as a stuck selection. */
.pv-card:focus{outline:none}
.pv-card:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-color:var(--acc)}
.pv-card:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:var(--sh)}
.pv-card.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.pv-thumb{aspect-ratio:4/3;background:var(--bg3);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pv-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pv-thumb .ph{color:var(--dim2);opacity:.35}
.pv-thumb .ph svg{width:44px;height:44px}
.pv-thumb .badges{position:absolute;top:6px;left:6px;display:flex;gap:4px;flex-wrap:wrap;max-width:calc(100% - 12px)}
.pv-thumb .fav{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);border:0;border-radius:7px;padding:5px;cursor:pointer;color:#fff;display:flex;opacity:0;transition:opacity .13s}
.pv-card:hover .fav,.pv-thumb .fav.on{opacity:1}
.pv-thumb .fav.on{color:var(--warn)}
.pv-thumb .fav svg{width:14px;height:14px}
.bdg{font:650 9.5px/1 var(--mono);letter-spacing:.04em;padding:4px 5px;border-radius:5px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);color:#dfe4ec;text-transform:uppercase}
.bdg.ok{background:rgba(61,220,151,.9);color:#052a1b}
.bdg.acc{background:rgba(255,138,61,.92);color:#26120a}
.bdg.bad{background:rgba(255,96,96,.9);color:#2b0707}
.pv-meta{padding:9px 10px 10px;display:flex;flex-direction:column;gap:5px;flex:1}
.pv-meta .t{font-weight:600;font-size:13px;line-height:1.32;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.pv-meta .s{font:500 11px/1 var(--mono);color:var(--dim2);display:flex;gap:7px;flex-wrap:wrap;margin-top:auto}
.pv-tags{display:flex;gap:4px;flex-wrap:wrap}
.tg{font-size:10.5px;font-weight:550;padding:2.5px 6px;border-radius:5px;background:var(--bg4);color:var(--dim);white-space:nowrap}
.tg.a{background:var(--acc-soft);color:var(--acc)}

/* ---------- list rows ---------- */
.pv-rows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--bg2)}
.pv-row{display:flex;align-items:center;gap:11px;padding:8px 11px;border-bottom:1px solid var(--line);cursor:pointer}
.pv-row:last-child{border-bottom:0}
.pv-row:hover{background:var(--bg3)}
.pv-row .th{width:42px;height:34px;border-radius:6px;background:var(--bg4);flex:0 0 auto;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--dim2)}
.pv-row .th img{width:100%;height:100%;object-fit:cover}
.pv-row .th svg{width:17px;height:17px;opacity:.5}
.pv-row .nm{flex:1;min-width:0}
.pv-row .nm b{display:block;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-row .nm small{color:var(--dim2);font:500 11px/1.4 var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.pv-row .col{font:500 12px/1 var(--mono);color:var(--dim);flex:0 0 auto;text-align:right}

/* ---------- misc blocks ---------- */
.pv-empty{text-align:center;padding:64px 20px;color:var(--dim)}
.pv-empty svg{width:52px;height:52px;opacity:.22;margin-bottom:14px}
.pv-empty h3{font-size:16px;margin-bottom:6px;color:var(--txt)}
.pv-empty p{max-width:440px;margin:0 auto 16px;font-size:13px;line-height:1.6}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);padding:15px;margin-bottom:14px}
.panel>h3{font-size:14px;margin-bottom:11px;display:flex;align-items:center;gap:7px}
.panel>h3 svg{width:15px;height:15px;color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:11px;margin-bottom:16px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);padding:12px 13px}
.stat .k{font-size:10.5px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--dim2);margin-bottom:5px}
.stat .v{font:700 21px/1.1 var(--mono);letter-spacing:-.02em}
.stat .sub{font-size:11.5px;color:var(--dim2);margin-top:3px}
.note{background:var(--bg3);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--dim);line-height:1.6;margin-bottom:13px}
.note b{color:var(--txt)}
.note.bad{border-left-color:var(--bad)}
.note.ok{border-left-color:var(--ok)}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px}
.kv dt{color:var(--dim2);font-weight:550}
.kv dd{margin:0;font-family:var(--mono);font-size:12px;word-break:break-all}

/* ---------- table ---------- */
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font:650 10.5px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--dim2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
table.t th:hover{color:var(--txt)}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr:hover{background:var(--bg3)}
table.t .num{font-family:var(--mono);text-align:right;font-size:12px}
.tw{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);overflow-x:auto}

/* ---------- modal ---------- */
.pv-ovl{position:fixed;inset:0;background:rgba(6,8,11,.72);backdrop-filter:blur(3px);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:32px 16px;overflow-y:auto}
.pv-ovl.on{display:flex}
.pv-modal{background:var(--bg2);border:1px solid var(--line);border-radius:16px;width:100%;max-width:560px;box-shadow:0 24px 70px rgba(0,0,0,.55);animation:pop .16s ease-out;margin:auto}
.pv-modal.wide{max-width:900px}
.pv-modal.xl{max-width:1120px}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}}
.pv-mh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg2);border-radius:16px 16px 0 0;z-index:2}
.pv-mh h3{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-mb{padding:16px}
.pv-mf{display:flex;gap:9px;justify-content:flex-end;padding:13px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.pv-mf .sp{flex:1}

/* ---------- toast ---------- */
.pv-toasts{position:fixed;bottom:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.pv-toast{background:var(--bg3);border:1px solid var(--line2);border-left:3px solid var(--acc);border-radius:9px;padding:10px 14px;box-shadow:var(--sh);font-size:13px;animation:slide .18s ease-out;max-width:380px;pointer-events:auto}
.pv-toast.ok{border-left-color:var(--ok)}
.pv-toast.bad{border-left-color:var(--bad)}
@keyframes slide{from{opacity:0;transform:translateX(20px)}}

/* ---------- progress ---------- */
.pv-prog{position:fixed;left:0;right:0;bottom:0;background:var(--bg2);border-top:1px solid var(--line);padding:9px 16px;display:none;align-items:center;gap:12px;z-index:60;box-shadow:0 -4px 20px rgba(0,0,0,.25)}
.pv-prog.on{display:flex}
.pv-prog .lbl{font-size:12.5px;color:var(--dim);flex:0 0 auto;min-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-prog .track{flex:1;height:5px;background:var(--bg4);border-radius:4px;overflow:hidden}
.pv-prog .fill{height:100%;background:var(--acc);width:0;transition:width .18s;border-radius:4px}
.pv-prog .pct{font:600 12px/1 var(--mono);color:var(--acc);min-width:44px;text-align:right}
.pv-prog .prog-note{font-size:11.5px;color:var(--dim2);max-width:340px;line-height:1.4;flex:0 1 auto}
@media(max-width:1100px){.pv-prog .prog-note{display:none}}
.spin{width:14px;height:14px;border:2px solid var(--line2);border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite;flex:0 0 auto}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- detail ---------- */
.dt-hero{display:grid;grid-template-columns:280px 1fr;gap:18px;margin-bottom:4px}
.dt-img{aspect-ratio:1;background:var(--bg3);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}
.dt-img img{width:100%;height:100%;object-fit:contain}
.dt-img .ph{opacity:.25}
.dt-img .ph svg{width:64px;height:64px}
.dt-shots{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.dt-shots img{width:48px;height:48px;object-fit:cover;border-radius:7px;border:1px solid var(--line);cursor:pointer}
.dt-shots img:hover,.dt-shots img.on{border-color:var(--acc)}
.filelist{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.b.ico.dgr:hover{color:var(--bad);border-color:rgba(255,96,96,.5)}
.pv-meta .t-row{display:flex;align-items:flex-start;gap:4px}
.pv-meta .t-row .t{flex:1;min-width:0}
.t-edit{flex:none;background:none;border:0;padding:2px;color:var(--dim2);cursor:pointer;opacity:0;
  transition:opacity .15s,color .15s;border-radius:5px}
.t-edit svg{width:14px;height:14px;display:block}
.pv-card:hover .t-edit{opacity:1}
.t-edit:hover{color:var(--hot,var(--acc));background:var(--bg3)}
.t-edit:focus-visible{opacity:1;outline:1px solid var(--acc)}
.jobbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--bg2);
  border-top:1px solid var(--line);padding:6px 14px;display:flex;gap:18px;flex-wrap:wrap;
  box-shadow:0 -6px 20px -12px rgba(0,0,0,.7)}
.jobbar .jb{display:flex;align-items:center;gap:10px;font-size:12.5px;min-width:0}
.jobbar .n{font-weight:700}
.jobbar .f{color:var(--dim);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:var(--mono);font-size:11.5px}
.jobbar .bar{width:120px;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}
.jobbar .bar i{display:block;height:100%;background:var(--acc);transition:width .6s}
.jobbar .pc{font-variant-numeric:tabular-nums;color:var(--dim)}
.jobbar .lf{color:var(--dim2)}
@media(max-width:700px){.jobbar .f{max-width:120px}.jobbar .bar{width:70px}}
.tagbox{position:relative;border:1px solid var(--line2);border-radius:9px;background:var(--bg2);
  padding:6px 8px 7px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:42px}
.tagbox:focus-within{border-color:var(--acc)}
.tagbox .chips{display:contents}
.tagbox .chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg3);
  border:1px solid var(--line2);border-radius:999px;padding:3px 5px 3px 11px;font-size:12.5px;white-space:nowrap}
.tagbox .chip button{background:none;border:0;color:var(--dim2);cursor:pointer;font-size:15px;
  line-height:1;padding:0 4px;border-radius:999px}
.tagbox .chip button:hover{color:var(--bad);background:var(--bg2)}
.tagbox .tbi{flex:1;min-width:120px;background:none;border:0;outline:0;color:var(--txt);
  font:inherit;font-size:13.5px;padding:4px 2px}
.tbdrop{display:none;position:absolute;left:-1px;right:-1px;top:calc(100% + 4px);z-index:40;
  background:var(--bg2);border:1px solid var(--line2);border-radius:9px;overflow:hidden;
  box-shadow:0 14px 34px -12px rgba(0,0,0,.7);max-height:236px;overflow-y:auto}
.tbdrop.on{display:block}
.tbdrop button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--txt);
  font:inherit;font-size:13.5px;padding:8px 12px;cursor:pointer}
.tbdrop button:hover,.tbdrop button.on{background:var(--bg3);color:var(--acc)}
.filerow{display:flex;align-items:center;gap:9px;padding:7px 10px;background:var(--bg2);font-size:12.5px}
.filerow:hover{background:var(--bg3)}
.filerow svg{width:15px;height:15px;flex:0 0 auto;color:var(--dim2)}
.filerow .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:11.5px}
.filerow .z{font:500 11px/1 var(--mono);color:var(--dim2);flex:0 0 auto}
.ext{font:650 9.5px/1 var(--mono);padding:3px 5px;border-radius:4px;background:var(--bg4);color:var(--dim);text-transform:uppercase;flex:0 0 auto}
.ext.stl{background:rgba(90,169,255,.16);color:#7cbaff}
.ext.tmf{background:rgba(61,220,151,.16);color:var(--ok)}
.ext.gcode{background:var(--acc-soft);color:var(--acc)}
.ext.img{background:rgba(190,140,255,.16);color:#c39bff}

/* ---------- dupe groups ---------- */
.dupe{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);margin-bottom:11px;overflow:hidden}
.dupe-h{display:flex;align-items:center;gap:10px;padding:10px 13px;background:var(--bg3);border-bottom:1px solid var(--line);font-size:13px}
.dupe-h .hash{font:500 10.5px/1 var(--mono);color:var(--dim2)}
.dupe-h .sp{flex:1}
.dupe-f{display:flex;align-items:center;gap:9px;padding:8px 13px;border-bottom:1px solid var(--line);font-size:12.5px}
.dupe-f:last-child{border-bottom:0}
.dupe-f .p{flex:1;min-width:0;font-family:var(--mono);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.dupe-f.keep{background:rgba(61,220,151,.05)}

/* ---------- filament swatch ---------- */
.sw{width:22px;height:22px;border-radius:6px;border:1px solid var(--line2);flex:0 0 auto;box-shadow:inset 0 -6px 10px rgba(0,0,0,.18)}
.bar{height:6px;background:var(--bg4);border-radius:4px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--acc)}
.bar i.low{background:var(--bad)}
.bar i.mid{background:var(--warn)}

/* ---------- queue ---------- */
.qcard{display:flex;align-items:center;gap:11px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;margin-bottom:8px}
.qcard .th{width:46px;height:38px;border-radius:6px;overflow:hidden;background:var(--bg3);flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.qcard .th img{width:100%;height:100%;object-fit:cover}
.qcard .th svg{width:18px;height:18px;color:var(--dim2);opacity:.5}
.qcard .nm{flex:1;min-width:0}
.qcard .nm b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qcard .nm small{color:var(--dim2);font-size:11.5px}
/* One row of buttons plus a name is more than a phone is wide. Left as a
   nowrap row the name gets squeezed to nothing and wraps a word per line,
   while the last button hangs off the edge. Let the card wrap instead: name
   beside the thumbnail, buttons underneath. The 66px is the priority stripe,
   the thumbnail and the gaps either side of them. */
@media(max-width:640px){
  .qcard{flex-wrap:wrap;gap:6px 7px}
  .qcard .nm{flex:1 1 calc(100% - 66px)}
}
.pri{width:6px;align-self:stretch;border-radius:3px;background:var(--dim2)}
.pri.hi{background:var(--bad)}.pri.md{background:var(--warn)}.pri.lo{background:var(--dim2)}

/* ---------- responsive ---------- */
@media(max-width:900px){
  .dt-hero{grid-template-columns:1fr}
  .pv-side{position:fixed;top:0;bottom:0;left:0;z-index:50;box-shadow:0 0 40px rgba(0,0,0,.5);padding-top:14px}
  .pv-side.hide{display:none}
  /* The sidebar is an overlay at this width rather than a column, so it needs
     a way out. Both the button and the scrim only exist down here. */
  button.hide-lg{display:inline-flex}
  .pv-scrim{position:fixed;inset:0;z-index:49;background:rgba(0,0,0,.5)}
  .fr,.fr3{grid-template-columns:1fr}
}
@media(max-width:640px){
  .pv-top{flex-wrap:wrap;padding:8px 10px}
  .pv-search{order:3;flex-basis:100%;max-width:none}
  .pv-main{padding:12px 11px 60px}
  .pv-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .hide-sm{display:none!important}
}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="pv-app">

  <header class="pv-top">
    <button class="b g ico hide-lg" id="btnSide" title="Toggle sidebar" aria-expanded="false"></button>
    <div class="pv-brand">
      <svg viewBox="0 0 32 32" fill="none"><path d="M16 2 3 9v14l13 7 13-7V9z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" opacity=".45"/><path d="M3 9l13 6.6L29 9M16 15.6V30" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" opacity=".45"/><path d="M16 2 3 9l13 6.6L29 9z" fill="var(--acc)" opacity=".9"/></svg>
      <span>Print<i>Vault</i></span>
    </div>

      style="cursor:pointer" onclick="PV.WhatsNew.open()">v0</span>
    <div class="pv-search">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="9" r="6"/><path d="M13.5 13.5 18 18"/></svg>
      <input id="q" type="search" placeholder="Search models, tags, files, creators..." autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </div>
    <div class="sp"></div>
    <button class="b sm" id="btnScan"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 7V4a2 2 0 0 1 2-2h3M18 7V4a2 2 0 0 0-2-2h-3M2 13v3a2 2 0 0 0 2 2h3M18 13v3a2 2 0 0 1-2 2h-3M2 10h16"/></svg><span class="hide-sm">Scan</span></button>
    <button class="b sm p" id="btnAddRoot"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 5.5A1.5 1.5 0 0 1 3.5 4h3.2a1.5 1.5 0 0 1 1.2.6l.8 1.1a1.5 1.5 0 0 0 1.2.6h5.6A1.5 1.5 0 0 1 17 7.8V15a1.5 1.5 0 0 1-1.5 1.5h-12A1.5 1.5 0 0 1 2 15z"/><path d="M10 9.5v4M8 11.5h4" stroke-linecap="round"/></svg><span class="hide-sm">Add Folder</span></button>
    <button class="b g ico" id="btnTheme" title="Toggle theme"></button>
  </header>

  <nav class="pv-tabs" id="tabs"></nav>

  <div class="pv-scrim" id="scrim"></div>

  <div class="pv-body">
    <aside class="pv-side" id="side"></aside>
    <main class="pv-main" id="main">
      <section class="pv-view on" id="v-library"></section>
      <section class="pv-view" id="v-prints"></section>
      <section class="pv-view" id="v-filament"></section>
      <section class="pv-view" id="v-queue"></section>
      <section class="pv-view" id="v-dupes"></section>
      <section class="pv-view" id="v-stats"></section>
      <section class="pv-view" id="v-settings"></section>
    </main>
  </div>
</div>

<div class="pv-ovl" id="ovl"><div class="pv-modal" id="modal"></div></div>
<div class="pv-toasts" id="toasts"></div>
<div class="pv-prog" id="prog">
  <div class="spin"></div>
  <div class="lbl" id="progLbl">Working...</div>
  <div class="track"><div class="fill" id="progFill"></div></div>
  <div class="pct" id="progPct">0%</div>
  <span class="prog-note hide-sm">Keep this tab open. Progress is saved as it goes, so stopping is safe and the next scan resumes.</span>
  <button class="b sm" id="progCancel">Cancel</button>
</div>

/* ============================================================
   DB — IndexedDB wrapper (stores + keyval meta)
   ============================================================ */
const STORES = ['meta','roots','files','models','prints','filaments','printers','queue','thumbs'];
const DB = {
  _db:null,
  /* Opened without a version on purpose. Asking for a specific one means an
     older copy of the app, served from a stale cache or a second window,
     asks for a lower version and dies with a VersionError, while a newer one
     blocks on any connection the old window is still holding and waits for
     ever. Neither is worth risking to add a store: anything new goes into
     'meta' as a record instead. */
  open(){
    if(DB._db) return Promise.resolve(DB._db);
    return new Promise((res,rej)=>{
      const req = indexedDB.open('printvault');
      req.onupgradeneeded = e=>{
        const db = e.target.result;
        STORES.forEach(name=>{
          if(db.objectStoreNames.contains(name)) return;
          const st = db.createObjectStore(name, {keyPath:'id'});
          if(name==='files'){ st.createIndex('rootId','rootId'); st.createIndex('modelId','modelId'); st.createIndex('sha','sha'); st.createIndex('size','size'); }
          if(name==='models'){ st.createIndex('rootId','rootId'); }
          if(name==='prints'){ st.createIndex('modelId','modelId'); }
          if(name==='queue'){ st.createIndex('modelId','modelId'); }
        });
      };
      // another window mid-upgrade: say so rather than sit on a blank page
      req.onblocked = ()=>rej(new Error('another Printery window has the database open, close it and reload'));
      req.onsuccess = ()=>{
        DB._db = req.result;
        // let a future upgrade in a newer tab proceed instead of blocking it
        DB._db.onversionchange = ()=>{ try{ DB._db.close(); }catch(e){} DB._db = null; };
        res(DB._db);
      };
      req.onerror = ()=>rej(req.error);
    });
  },
  tx(names, mode){ return DB.open().then(db=>db.transaction(names, mode||'readonly')); },
  _req(r){ return new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
  get(store,id){ return DB.tx([store]).then(t=>DB._req(t.objectStore(store).get(id))); },
  all(store){ return DB.tx([store]).then(t=>DB._req(t.objectStore(store).getAll())); },
  keys(store){ return DB.tx([store]).then(t=>DB._req(t.objectStore(store).getAllKeys())); },
  put(store,val){ return DB.tx([store],'readwrite').then(t=>DB._req(t.objectStore(store).put(val))); },
  /* Written in chunks rather than one giant transaction. A library with
     hundreds of thousands of files would otherwise queue every put into a
     single transaction, locking the tab and risking an abort partway through.
     Chunking also means an interrupted write keeps everything already stored. */
  CHUNK: 2000,
  async putMany(store, vals, onProgress){
    if(!vals.length) return;
    for(let i=0;i<vals.length;i+=DB.CHUNK){
      const slice = vals.slice(i, i+DB.CHUNK);
      const t = await DB.tx([store],'readwrite');
      await new Promise((res,rej)=>{
        const st = t.objectStore(store);
        for(const v of slice) st.put(v);
        t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error);
      });
      if(onProgress) onProgress(Math.min(i+DB.CHUNK, vals.length), vals.length);
      if(vals.length > DB.CHUNK) await new Promise(r=>setTimeout(r,0));  // let the UI breathe
    }
  },
  del(store,id){ return DB.tx([store],'readwrite').then(t=>DB._req(t.objectStore(store).delete(id))); },
  async delMany(store, ids){
    if(!ids.length) return;
    for(let i=0;i<ids.length;i+=DB.CHUNK){
      const slice = ids.slice(i, i+DB.CHUNK);
      const t = await DB.tx([store],'readwrite');
      await new Promise((res,rej)=>{
        const st = t.objectStore(store);
        for(const id of slice) st.delete(id);
        t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error);
      });
      if(ids.length > DB.CHUNK) await new Promise(r=>setTimeout(r,0));
    }
  },
  clear(store){ return DB.tx([store],'readwrite').then(t=>DB._req(t.objectStore(store).clear())); },
  byIndex(store,index,val){ return DB.tx([store]).then(t=>DB._req(t.objectStore(store).index(index).getAll(val))); }
};

/* ============================================================
   Store — in-memory mirror + settings + subscribers
   ============================================================ */
const Store = {
  roots:[], models:[], files:[], prints:[], filaments:[], printers:[], queue:[], parked:[],
  settings:{
    theme:'dark', accent:'orange', learnedSelect:false, view:'grid', sort:'name', dir:'asc', sidebar:true,
    hashOnScan:false, thumbOnScan:true, thumbSize:320, currency:'$',
    skipDirs:'node_modules,.git,.svn,$RECYCLE.BIN,System Volume Information,.thumbnails',
    defaultPrinter:'', costPerHour:0.15, lastScan:0,
    dupeAction:'quarantine', quarantineDir:'_PrintVault_quarantine', keepPrefer:'',
    autoBackup:'weekly', autoBackupAt:0, autoBackupSig:'', autoBackups:[],
    lastSeenVersion:'',
    /* [{id,name,path}]. slicerPath is the old single-slicer setting and is
       migrated into this on load; it stays readable so an older build opening
       the same index still finds a slicer. */
    slicers:[]
  },
  _subs:[],
  _idx:{ models:new Map(), files:new Map() },

  async load(){
    const meta = await DB.get('meta','settings');
    if(meta && meta.v) Object.assign(Store.settings, meta.v);
    /* One slicer became a list. Carry the old setting across so nobody has to
       go and set theirs again, and leave slicerPath alone: an older build
       opening the same index should still find a slicer rather than none. */
    if(Store.settings.slicerPath && !(Store.settings.slicers || []).length){
      Store.settings.slicers = [{
        id: U.id('sl'), name: U.stem(U.osBase(Store.settings.slicerPath)), path: Store.settings.slicerPath
      }];
    }
    const parked = await DB.get('meta','parked');
    const [roots,models,files,prints,filaments,printers,queue] = await Promise.all([
      DB.all('roots'), DB.all('models'), DB.all('files'), DB.all('prints'),
      DB.all('filaments'), DB.all('printers'), DB.all('queue')
    ]);
    Store.roots=roots; Store.models=models; Store.files=files;
    Store.prints=prints; Store.filaments=filaments; Store.printers=printers; Store.queue=queue;
    Store.parked = (parked && parked.v) || [];
    // 0.2.3 briefly kept these in a store of their own; bring them across
    if(!Store.parked.length && DB._db && DB._db.objectStoreNames.contains('parked')){
      try{
        const old = await DB.all('parked');
        if(old.length){ Store.parked = old; await DB.put('meta',{id:'parked', v:old}); await DB.clear('parked'); }
      }catch(e){}
    }
    Store.reindex();
  },
  reindex(){
    Store._idx.models = new Map(Store.models.map(m=>[m.id,m]));
    Store._idx.files = new Map(Store.files.map(f=>[f.id,f]));
  },
  model(id){ return Store._idx.models.get(id); },
  file(id){ return Store._idx.files.get(id); },
  modelFiles(id){ return Store.files.filter(f=>f.modelId===id); },
  modelPrints(id){ return Store.prints.filter(p=>p.modelId===id); },
  root(id){ return Store.roots.find(r=>r.id===id); },
  filament(id){ return Store.filaments.find(f=>f.id===id); },
  printer(id){ return Store.printers.find(p=>p.id===id); },

  async setting(k,v){ Store.settings[k]=v; await DB.put('meta',{id:'settings', v:Store.settings}); },
  async saveSettings(){ await DB.put('meta',{id:'settings', v:Store.settings}); },

  async put(coll, obj){
    obj.updatedAt = Date.now();
    if(!obj.createdAt) obj.createdAt = obj.updatedAt;
    await DB.put(coll, obj);
    const arr = Store[coll==='filaments'?'filaments':coll];
    const i = arr.findIndex(x=>x.id===obj.id);
    if(i<0) arr.push(obj); else arr[i]=obj;
    if(coll==='models'||coll==='files') Store.reindex();
    return obj;
  },
  async remove(coll, id){
    await DB.del(coll, id);
    const arr = Store[coll];
    const i = arr.findIndex(x=>x.id===id);
    if(i>=0) arr.splice(i,1);
    if(coll==='models'||coll==='files') Store.reindex();
  },
  subscribe(fn){ Store._subs.push(fn); },
  emit(){ Store._subs.forEach(f=>{ try{ f(); }catch(e){ console.error(e); } }); },

  allTags(){
    const m = new Map();
    Store.models.forEach(x=>(x.tags||[]).forEach(t=>m.set(t,(m.get(t)||0)+1)));
    return Array.from(m.entries()).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
  },
  allCollections(){
    const m = new Map();
    Store.models.forEach(x=>(x.collections||[]).forEach(t=>m.set(t,(m.get(t)||0)+1)));
    return Array.from(m.entries()).sort((a,b)=>a[0].localeCompare(b[0]));
  }
};

const Toast = {
  show(msg, kind, ms){
    const el = document.createElement('div');
    el.className = 'pv-toast' + (kind?' '+kind:'');
    el.innerHTML = U.esc(msg);
    document.getElementById('toasts').appendChild(el);
    setTimeout(()=>{ el.style.transition='opacity .25s,transform .25s'; el.style.opacity='0'; el.style.transform='translateX(16px)';
      setTimeout(()=>el.remove(),260); }, ms||2800);
  },
  ok(m){ Toast.show(m,'ok'); },
  err(m, ms){ Toast.show(m,'bad',ms||5000); console.warn('[Printery]', m); }
};

const Prog = {
  _cancel:false, _active:false,
  start(label){ Prog._cancel=false; Prog._active=true;
    document.getElementById('prog').classList.add('on');
    Prog.set(label,0,1); },
  set(label,done,total){
    if(!Prog._active) return;
    const pct = total ? Math.round(done/total*100) : 0;
    document.getElementById('progLbl').textContent = label;
    document.getElementById('progFill').style.width = pct+'%';
    document.getElementById('progPct').textContent = pct+'%';
  },
  stop(){ Prog._active=false; document.getElementById('prog').classList.remove('on'); },
  get cancelled(){ return Prog._cancel; }
};
document.getElementById('progCancel').onclick = ()=>{ Prog._cancel = true; Toast.show('Cancelling...'); };

const Modal = {
  _stack:[],
  /* opts.root starts a fresh stack (a top-level screen such as a model page).
     Anything opened on top of an existing dialog is remembered, so closing it
     returns to what you were looking at instead of dumping you back in the library. */
  open(title, bodyHtml, footerHtml, size, opts){
    const m = document.getElementById('modal'), ovl = document.getElementById('ovl');
    const wasOpen = ovl.classList.contains('on');
    if(opts && opts.root) Modal._stack.length = 0;
    else if(wasOpen && m.innerHTML)
      Modal._stack.push({html:m.innerHTML, cls:m.className, scroll:ovl.scrollTop, title:Modal._title});
    Modal._title = title;
    const back = Modal._stack.length > 0;
    m.className = 'pv-modal' + (size?' '+size:'');
    m.innerHTML =
      '<div class="pv-mh">'+
        (back ? '<button class="b g ico" onclick="PV.Modal.back()" title="Back to '+
                U.attr(Modal._stack[Modal._stack.length-1].title || 'previous')+'">'+I.chevL+'</button>' : '')+
        '<h3>'+U.esc(title)+'</h3>'+
        '<button class="b g ico" onclick="PV.Modal.close()" title="Close">'+I.x+'</button>'+
      '</div>'+
      '<div class="pv-mb">'+bodyHtml+'</div>'+
      (footerHtml ? '<div class="pv-mf">'+footerHtml+'</div>' : '');
    ovl.classList.add('on');
    if(!back) ovl.scrollTop = 0;
    TagBox.wire(m);
    const first = m.querySelector('input:not([type=hidden]),textarea,select');
    if(first) setTimeout(()=>first.focus(),40);
  },
  back(){
    const prev = Modal._stack.pop();
    if(!prev) return Modal.close();
    const m = document.getElementById('modal'), ovl = document.getElementById('ovl');
    m.className = prev.cls;
    m.innerHTML = prev.html;
    m.querySelectorAll('.tagbox[data-live]').forEach(b=>b.removeAttribute('data-live'));
    TagBox.wire(m);
    /* Restoring a dialog puts its markup back, but the 3D view draws into one
       shared canvas element, and that element belonged to the DOM we just
       replaced. What comes back is an inert copy: the model looks like it has
       vanished and Reset view appears to do nothing, because it is painting
       into a canvas that is no longer on screen. Re-attach the real one. */
    if(document.getElementById('vwWrap') && Viewer.data) Viewer.mount();
    Modal._title = prev.title;
    ovl.scrollTop = prev.scroll || 0;
  },
  setBody(html){ const b=document.querySelector('#modal .pv-mb'); if(b) b.innerHTML=html; },
  setTitle(t){ const h=document.querySelector('#modal .pv-mh h3'); if(h){ h.textContent=t; Modal._title=t; } },
  close(){ Modal._stack.length = 0; document.getElementById('ovl').classList.remove('on');
    document.getElementById('modal').innerHTML=''; },
  confirm(title, msg, onYes, yesLabel, danger){
    Modal.open(title, '<p style="margin:0 0 4px;line-height:1.65;color:var(--dim)">'+msg+'</p>',
      '<button class="b" onclick="PV.Modal.back()">Cancel</button>'+
      '<button class="b '+(danger?'d':'p')+'" id="mYes">'+U.esc(yesLabel||'Confirm')+'</button>');
    document.getElementById('mYes').onclick = ()=>{ Modal.close(); onYes(); };
  },
  /* Same as confirm, but you have to type the word before the button works.
     For the handful of actions that destroy many files at once and cannot be
     undone. The point is not that typing is hard, it is that it interrupts
     the muscle memory of clicking through a dialog you have seen before. */
  confirmTyped(title, msg, phrase, onYes, yesLabel){
    Modal.open(title,
      '<div style="margin:0 0 4px;line-height:1.65;color:var(--dim)">'+msg+'</div>'+
      '<label style="display:block;margin-top:14px;font-size:12.5px;color:var(--dim)">Type '+
        '<b class="mono" style="color:var(--txt)">'+U.esc(phrase)+'</b> to confirm</label>'+
      '<input id="mPhrase" class="mono" autocomplete="off" spellcheck="false" '+
        'style="margin-top:6px;width:100%" placeholder="'+U.attr(phrase)+'">',
      '<button class="b" onclick="PV.Modal.back()">Cancel</button>'+
      /* Markup, not text. Every caller passes an icon with its label, the way
         Modal.open's footer is written everywhere else in this file, and
         escaping it printed the raw SVG across the dialog. Labels here are all
         literals a few lines away; nothing user-supplied reaches this. */
      '<button class="b d" id="mYes" disabled>'+(yesLabel||'Confirm')+'</button>');

    const inp = document.getElementById('mPhrase'), yes = document.getElementById('mYes');
    const check = ()=>{ yes.disabled = inp.value.trim().toUpperCase() !== phrase.toUpperCase(); };
    inp.addEventListener('input', check);
    // Enter should not fire a disabled button, but it should work once armed
    inp.addEventListener('keydown', e=>{ if(e.key === 'Enter' && !yes.disabled){ e.preventDefault(); yes.click(); } });
    yes.onclick = ()=>{ if(yes.disabled) return; Modal.close(); onYes(); };
    setTimeout(()=>inp.focus(), 30);
  },
  val(id){ const e=document.getElementById(id); return e ? (e.type==='checkbox'? e.checked : e.value) : ''; },
  num(id){ const v=parseFloat(Modal.val(id)); return isFinite(v)?v:null; }
};
document.getElementById('ovl').addEventListener('mousedown', e=>{ if(e.target.id==='ovl') Modal.close(); });
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && document.getElementById('ovl').classList.contains('on')) Modal.back();
  else if((e.key==='ArrowRight' || e.key==='ArrowLeft') && document.getElementById('vwWrap')
          && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){
    e.preventDefault(); Viewer.step(e.key==='ArrowRight' ? 1 : -1);
  }
  else if(e.key==='/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){ e.preventDefault(); document.getElementById('q').focus(); }
  else if(e.key==='?' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)
          && !document.getElementById('ovl').classList.contains('on')){ e.preventDefault(); Keys.open(); }

  /* Arrow keys around the grid, Enter to open. The cards are
     real focusable elements rather than an index kept in a variable, so the
     browser draws the focus ring, Tab still works, and screen readers get
     told what each card is. Column count is measured from where the cards
     actually sit rather than assumed, because the grid is auto-fill and the
     number changes with the window. */
  else if(/^(ArrowRight|ArrowLeft|ArrowUp|ArrowDown|Enter|Home|End)$/.test(e.key)
          && !document.getElementById('ovl').classList.contains('on')
          && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){
    const cards = [...document.querySelectorAll('#v-library .pv-card')];
    if(!cards.length) return;
    const cur = document.activeElement.closest ? document.activeElement.closest('.pv-card') : null;
    if(!cur){
      // nothing focused yet: the first arrow press picks up the first card
      if(e.key !== 'Enter'){ e.preventDefault(); cards[0].focus(); }
      return;
    }
    if(e.key === 'Enter'){ e.preventDefault(); Detail.open(cur.dataset.id); return; }
    const i = cards.indexOf(cur);
    const top = Math.round(cards[0].getBoundingClientRect().top);
    const perRow = Math.max(1, cards.filter(c=>Math.round(c.getBoundingClientRect().top) === top).length);
    let n = i;
    if(e.key === 'ArrowRight') n = i + 1;
    else if(e.key === 'ArrowLeft') n = i - 1;
    else if(e.key === 'ArrowDown') n = i + perRow;
    else if(e.key === 'ArrowUp') n = i - perRow;
    else if(e.key === 'Home') n = 0;
    else if(e.key === 'End') n = cards.length - 1;
    if(n >= 0 && n < cards.length){ e.preventDefault(); cards[n].focus(); }
  }
});

/* ============================================================
   File kinds
   ============================================================ */
const KIND = {
  mesh:  ['stl','3mf','obj','ply','amf','off','dae','wrl','glb','gltf'],
  cad:   ['step','stp','iges','igs','f3d','f3z','scad','sldprt','ipt','dxf','svg','blend'],
  gcode: ['gcode','gco','g','bgcode','ufp','gx','mgcode'],
  image: ['png','jpg','jpeg','webp','gif','bmp','avif'],
  doc:   ['txt','md','pdf','nfo','html','htm','rtf','doc','docx','json','ini','cfg'],
  arch:  ['zip','rar','7z','tar','gz','lzma']
};
const EXT_KIND = (function(){ const m={}; for(const k in KIND) KIND[k].forEach(e=>m[e]=k); return m; })();
function kindOf(ext){ return EXT_KIND[ext] || 'other'; }
/* Bumped whenever the scanner learns to extract something new from a file.
   Records stamped with an older value get re-read on the next scan, so an app
   update does not silently skip files that were already indexed. */
const META_V = 3;
function isPrintable(ext){ const k=kindOf(ext); return k==='mesh'||k==='gcode'||k==='cad'; }

/* Folder names that are containers or variants, not model names of their own */
const GENERIC_DIRS = new Set(['files','file','stl','stls','3mf','3mfs','gcode','gcodes','print','prints','printable','printables',
  'parts','part','models','model','mesh','meshes','source','sources','src','download','downloads','extracted','unzipped',
  'output','out','export','exports','archive','new folder','untitled','images','img','pics','photos','renders','misc','other','assets',
  'supported','supports','support','presupported','pre-supported','unsupported','no supports','nosupports',
  'split','whole','solid','hollow','scaled','variants','variant','lys','chitubox','ams','no ams']);

/* ============================================================
   WORKER — hashing + mesh parsing + zip + gcode metadata
   ============================================================ */
function pvWorkerMain(){
  const td = new TextDecoder();

  function hex(buf){
    const b = new Uint8Array(buf); let s='';
    for(let i=0;i<b.length;i++) s += b[i].toString(16).padStart(2,'0');
    return s;
  }
  async function sha256(buf){ return hex(await crypto.subtle.digest('SHA-256', buf)); }

  /* ---- flat normals ---- */
  function flatNormals(pos){
    const n = new Float32Array(pos.length);
    for(let i=0;i<pos.length;i+=9){
      const ax=pos[i],ay=pos[i+1],az=pos[i+2];
      const bx=pos[i+3],by=pos[i+4],bz=pos[i+5];
      const cx=pos[i+6],cy=pos[i+7],cz=pos[i+8];
      const ux=bx-ax,uy=by-ay,uz=bz-az, vx=cx-ax,vy=cy-ay,vz=cz-az;
      let nx=uy*vz-uz*vy, ny=uz*vx-ux*vz, nz=ux*vy-uy*vx;
      const l=Math.hypot(nx,ny,nz)||1; nx/=l; ny/=l; nz/=l;
      for(let j=0;j<3;j++){ n[i+j*3]=nx; n[i+j*3+1]=ny; n[i+j*3+2]=nz; }
    }
    return n;
  }
  function bounds(pos){
    let mnx=Infinity,mny=Infinity,mnz=Infinity,mxx=-Infinity,mxy=-Infinity,mxz=-Infinity;
    for(let i=0;i<pos.length;i+=3){
      const x=pos[i],y=pos[i+1],z=pos[i+2];
      if(x<mnx)mnx=x; if(y<mny)mny=y; if(z<mnz)mnz=z;
      if(x>mxx)mxx=x; if(y>mxy)mxy=y; if(z>mxz)mxz=z;
    }
    if(!isFinite(mnx)) return null;
    return {min:[mnx,mny,mnz], max:[mxx,mxy,mxz], size:[mxx-mnx, mxy-mny, mxz-mnz]};
  }

  /* ---- STL ---- */
  function stlBinary(dv, n, maxTri){
    const step = maxTri && n>maxTri ? Math.ceil(n/maxTri) : 1;
    const cnt = Math.ceil(n/step);
    const pos = new Float32Array(cnt*9), nrm = new Float32Array(cnt*9);
    let w=0;
    for(let t=0;t<n;t+=step){
      const o = 84 + t*50;
      const nx=dv.getFloat32(o,true), ny=dv.getFloat32(o+4,true), nz=dv.getFloat32(o+8,true);
      for(let v=0;v<3;v++){
        const p = o+12+v*12;
        pos[w]=dv.getFloat32(p,true); pos[w+1]=dv.getFloat32(p+4,true); pos[w+2]=dv.getFloat32(p+8,true);
        nrm[w]=nx; nrm[w+1]=ny; nrm[w+2]=nz;
        w+=3;
      }
    }
    const bad = !isFinite(nrm[0]) || (nrm[0]===0&&nrm[1]===0&&nrm[2]===0);
    return {pos, nrm: bad ? flatNormals(pos) : nrm, tris:n};
  }
  function stlAscii(text, maxTri){
    const re = /vertex\s+([-+0-9.eE]+)\s+([-+0-9.eE]+)\s+([-+0-9.eE]+)/g;
    const arr = []; let m;
    while((m = re.exec(text))) arr.push(+m[1], +m[2], +m[3]);
    let pos = new Float32Array(arr);
    const tris = Math.floor(pos.length/9);
    if(maxTri && tris>maxTri){
      const step = Math.ceil(tris/maxTri), out = new Float32Array(Math.ceil(tris/step)*9);
      let w=0; for(let t=0;t<tris;t+=step){ out.set(pos.subarray(t*9,t*9+9), w); w+=9; }
      pos = out.subarray(0,w);
    }
    return {pos, nrm: flatNormals(pos), tris};
  }
  function parseSTL(buf, maxTri){
    const dv = new DataView(buf);
    if(buf.byteLength >= 84){
      const n = dv.getUint32(80, true);
      if(84 + n*50 === buf.byteLength) return stlBinary(dv, n, maxTri);
    }
    const head = td.decode(new Uint8Array(buf, 0, Math.min(256, buf.byteLength)));
    if(/^\s*solid/i.test(head) && /facet|vertex/i.test(head + td.decode(new Uint8Array(buf, 0, Math.min(4096, buf.byteLength)))))
      return stlAscii(td.decode(new Uint8Array(buf)), maxTri);
    if(buf.byteLength >= 84){
      const n = dv.getUint32(80, true);
      if(n>0 && 84 + n*50 <= buf.byteLength) return stlBinary(dv, n, maxTri);
    }
    throw new Error('Unrecognized STL');
  }

  /* ---- OBJ ---- */
  function parseOBJ(text, maxTri){
    const verts=[], out=[];
    const lines = text.split(/\r?\n/);
    for(let i=0;i<lines.length;i++){
      const L = lines[i];
      if(L.charCodeAt(0)===118 && L.charCodeAt(1)===32){ // "v "
        const p = L.split(/\s+/); verts.push(+p[1], +p[2], +p[3]);
      } else if(L.charCodeAt(0)===102 && L.charCodeAt(1)===32){ // "f "
        const p = L.trim().split(/\s+/), idx=[];
        for(let j=1;j<p.length;j++){
          let k = parseInt(p[j], 10);
          if(!isFinite(k)) continue;
          if(k<0) k = verts.length/3 + k; else k -= 1;
          idx.push(k);
        }
        for(let j=1;j+1<idx.length;j++){
          [idx[0], idx[j], idx[j+1]].forEach(k=>{ out.push(verts[k*3], verts[k*3+1], verts[k*3+2]); });
        }
      }
    }
    let pos = new Float32Array(out);
    const tris = Math.floor(pos.length/9);
    if(maxTri && tris>maxTri){
      const step=Math.ceil(tris/maxTri), o2=new Float32Array(Math.ceil(tris/step)*9);
      let w=0; for(let t=0;t<tris;t+=step){ o2.set(pos.subarray(t*9,t*9+9), w); w+=9; }
      pos = o2.subarray(0,w);
    }
    return {pos, nrm: flatNormals(pos), tris};
  }

  /* ---- ZIP (3MF containers) ---- */
  async function inflateRaw(u8){
    const st = new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Uint8Array(await new Response(st).arrayBuffer());
  }
  /* `base` is the absolute file offset of buf[0], so the same parser works on a
     tail slice. Throws NEEDMORE:<bytes> when the central directory starts before
     the slice, telling the caller how much of the tail to re-read. */
  function readZip(buf, base){
    base = base || 0;
    const dv = new DataView(buf), u8 = new Uint8Array(buf), len = buf.byteLength;
    let eocd = -1;
    for(let i = len - 22; i >= 0; i--){
      if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
    }
    if(eocd < 0) throw new Error(base ? 'NEEDMORE:' + Math.min(len * 4, 4194304) : 'Not a zip archive');
    let count = dv.getUint16(eocd+10, true), cdOff = dv.getUint32(eocd+16, true);
    if(cdOff === 0xffffffff || count === 0xffff){
      const loc = eocd - 20;
      if(loc >= 0 && dv.getUint32(loc, true) === 0x07064b50){
        const z = Number(dv.getBigUint64(loc+8, true));
        if(dv.getUint32(z, true) === 0x06064b50){
          count = Number(dv.getBigUint64(z+32, true));
          cdOff = Number(dv.getBigUint64(z+48, true));
        }
      }
    }
    if(cdOff < base) throw new Error('NEEDMORE:' + ((base + len) - cdOff + 1024));
    const entries = []; let p = cdOff - base;
    for(let i=0;i<count && p+46 <= len;i++){
      if(dv.getUint32(p, true) !== 0x02014b50) break;
      const method = dv.getUint16(p+10, true);
      const crc = dv.getUint32(p+16, true);
      let csize = dv.getUint32(p+20, true), usize = dv.getUint32(p+24, true);
      const nlen = dv.getUint16(p+28, true), elen = dv.getUint16(p+30, true), clen = dv.getUint16(p+32, true);
      let lho = dv.getUint32(p+42, true);
      const name = td.decode(u8.subarray(p+46, p+46+nlen));
      if(csize === 0xffffffff || usize === 0xffffffff || lho === 0xffffffff){
        let e = p+46+nlen; const end = e+elen;
        while(e+4 <= end){
          const hid = dv.getUint16(e, true), hsz = dv.getUint16(e+2, true);
          if(hid === 0x0001){
            let q = e+4;
            if(usize === 0xffffffff){ usize = Number(dv.getBigUint64(q, true)); q+=8; }
            if(csize === 0xffffffff){ csize = Number(dv.getBigUint64(q, true)); q+=8; }
            if(lho === 0xffffffff){ lho = Number(dv.getBigUint64(q, true)); }
            break;
          }
          e += 4 + hsz;
        }
      }
      entries.push({name, method, csize, usize, lho, crc});
      p += 46 + nlen + elen + clen;
    }
    return {dv, u8, entries, base};
  }
  async function zipRead(z, entry){
    const {dv, u8} = z, lho = entry.lho - (z.base || 0);
    if(lho < 0) throw new Error('Entry data is outside the loaded slice');
    if(dv.getUint32(lho, true) !== 0x04034b50) throw new Error('Bad local header');
    const nlen = dv.getUint16(lho+26, true), elen = dv.getUint16(lho+28, true);
    const off = lho + 30 + nlen + elen;
    const raw = u8.subarray(off, off + entry.csize);
    if(entry.method === 0) return raw;
    if(entry.method === 8) return await inflateRaw(raw);
    throw new Error('Unsupported zip method ' + entry.method);
  }

  /* ---- 3MF ---- */
  const NUMS = /-?\d+(?:\.\d+)?(?:[eE][-+]?\d+)?/g;
  /* Compose two 3MF transforms: apply `c` first, then `i` */
  function mul12(c, i){
    if(!c) return i || null;
    if(!i) return c;
    const A = (m,r,k)=>m[r*3+k], o = new Array(12);
    for(let r=0;r<3;r++) for(let k=0;k<3;k++)
      o[r*3+k] = A(c,r,0)*A(i,0,k) + A(c,r,1)*A(i,1,k) + A(c,r,2)*A(i,2,k);
    for(let k=0;k<3;k++)
      o[9+k] = c[9]*A(i,0,k) + c[10]*A(i,1,k) + c[11]*A(i,2,k) + i[9+k];
    return o;
  }
  function parseMat(s){
    if(!s) return null;
    const n = s.trim().split(/\s+/).map(Number);
    return (n.length >= 12 && n.every(isFinite)) ? n : null;
  }

  function parse3MFModel(text, maxTri, colourFor, skipIds){
    const objs = {};
    let i = 0;
    while((i = text.indexOf('<object', i)) >= 0){
      const te = text.indexOf('>', i); if(te < 0) break;
      const head = text.slice(i, te);
      const idm = head.match(/\sid="([^"]*)"/);
      const close = text.indexOf('</object>', te);
      const body = text.slice(te, close < 0 ? text.length : close);
      const vre = /<vertex[^>]*\sx="([^"]*)"[^>]*\sy="([^"]*)"[^>]*\sz="([^"]*)"/g;
      const tre = /<triangle[^>]*\sv1="(\d+)"[^>]*\sv2="(\d+)"[^>]*\sv3="(\d+)"/g;
      const cre = /<component\b([^>]*)>/g;
      const vs = [], ts = [], comps = []; let m;
      while((m = vre.exec(body))) vs.push(+m[1], +m[2], +m[3]);
      while((m = tre.exec(body))) ts.push(+m[1], +m[2], +m[3]);
      // Slicers split geometry across parts and reference it by component
      while((m = cre.exec(body))){
        const oid = (m[1].match(/objectid="([^"]*)"/)||[])[1];
        if(oid) comps.push({oid, mat: parseMat((m[1].match(/transform="([^"]*)"/)||[])[1])});
      }
      if(idm){
        const id = idm[1], prev = objs[id];
        // never let a reference-only object shadow one that carries real geometry
        if(!prev || (!prev.ts.length && ts.length)) objs[id] = {vs, ts, comps};
      }
      i = close < 0 ? text.length : close + 9;
    }

    const items = [];
    const bStart = text.indexOf('<build');
    if(bStart >= 0){
      const bBody = text.slice(bStart, (text.indexOf('</build>', bStart)+1) || text.length);
      const ire = /<item\b([^>]*)>/g; let m;
      while((m = ire.exec(bBody))){
        const oid = (m[1].match(/objectid="([^"]*)"/)||[])[1];
        if(oid) items.push({oid, mat: parseMat((m[1].match(/transform="([^"]*)"/)||[])[1])});
      }
    }
    const use = items.length ? items : Object.keys(objs).map(k=>({oid:k, mat:null}));

    // follow component references down to the objects that actually hold meshes
    const leaves = [];
    const walk = (oid, mat, depth, root)=>{
      if(depth > 8) return;
      // modifiers, negative volumes and support blockers are settings, not
      // things that get printed. Drawing them put big blocks in the scene.
      if(skipIds && skipIds.has(String(oid))) return;
      const o = objs[oid]; if(!o) return;
      if(o.ts.length) leaves.push({o, mat, root});
      for(const c of o.comps) walk(c.oid, mul12(c.mat, mat), depth + 1, root);
    };
    // The colour belongs to the top level object, which is what the slicer's
    // own config keys on; components underneath inherit it.
    use.forEach(it=>walk(it.oid, it.mat, 0, it.oid));

    let total = 0;
    leaves.forEach(l=>{ total += l.o.ts.length/3; });
    if(!total) throw new Error('No mesh in 3MF');
    const step = maxTri && total > maxTri ? Math.ceil(total/maxTri) : 1;
    const pos = new Float32Array(Math.ceil(total/step)*9);
    const anyColour = colourFor && leaves.some(l=>colourFor(l.root));
    const col = anyColour ? new Float32Array(pos.length) : null;
    let w = 0, t = 0;
    leaves.forEach(l=>{
      const o = l.o, M = l.mat;
      const c = anyColour ? (colourFor(l.root) || [.78,.78,.80]) : null;
      for(let k=0;k<o.ts.length;k+=3, t++){
        if(t % step) continue;
        for(let v=0;v<3;v++){
          const vi = o.ts[k+v]*3;
          let x = o.vs[vi], y = o.vs[vi+1], z = o.vs[vi+2];
          if(M){
            const nx = x*M[0] + y*M[3] + z*M[6] + M[9];
            const ny = x*M[1] + y*M[4] + z*M[7] + M[10];
            const nz = x*M[2] + y*M[5] + z*M[8] + M[11];
            x=nx; y=ny; z=nz;
          }
          if(c){ col[w]=c[0]; col[w+1]=c[1]; col[w+2]=c[2]; }
          pos[w++]=x; pos[w++]=y; pos[w++]=z;
        }
      }
    });
    const p = pos.subarray(0, w);
    return {pos:p, nrm: flatNormals(p), tris: total, col: col ? col.subarray(0, w) : null};
  }

  async function parse3MF(buf, maxTri, wantThumb, forceMesh){
    const z = readZip(buf);
    let thumb = null;
    if(wantThumb){
      const cands = z.entries.filter(e=>/\.(png|jpe?g)$/i.test(e.name) &&
        /thumbnail|plate|preview|top_?\d*\.png/i.test(e.name) && !/pick_|_small|no_light/i.test(e.name));
      cands.sort((a,b)=>b.usize - a.usize);
      if(cands.length){ try{ thumb = await zipRead(z, cands[0]); }catch(e){} }
    }
    /* Which filament each object is printed in, and what colour that is.
       Bambu Studio and OrcaSlicer keep the assignment in model_settings.config
       against the top level object id, and the palette in project_settings.
       Without this every object renders the same flat colour, which for a
       multipart figure means losing the only thing that made it readable. */
    let colourFor = null, skipIds = null;
    try{
      const mse = z.entries.find(e=>/model_settings\.config$/i.test(e.name));
      const pse = z.entries.find(e=>/project_settings\.config$/i.test(e.name));
      if(mse){
        const ms0 = td.decode(await zipRead(z, mse));
        // <part id="5" subtype="modifier_part"> and friends
        const pre = /<part\s+id="([^"]+)"\s+subtype="([^"]+)"/g;
        let pm;
        while((pm = pre.exec(ms0))) if(pm[2] !== 'normal_part') (skipIds = skipIds || new Set()).add(pm[1]);
      }
      if(mse && pse){
        const ms = td.decode(await zipRead(z, mse));
        let palette = null;
        try{ palette = JSON.parse(td.decode(await zipRead(z, pse))).filament_colour; }catch(e){}
        if(palette && palette.length){
          const ext = {};
          const ore = /<object\s+id="([^"]+)"([\s\S]*?)<\/object>/g;
          let m;
          while((m = ore.exec(ms))){
            const e = m[2].match(/key="extruder"\s+value="(\d+)"/);
            if(e) ext[m[1]] = +e[1];
          }
          const hex = h=>{
            const t = String(h||'').replace('#','');
            if(t.length < 6) return null;
            return [parseInt(t.slice(0,2),16)/255, parseInt(t.slice(2,4),16)/255, parseInt(t.slice(4,6),16)/255];
          };
          /* Colour it even when there is only one filament. Skipping that made
             a white model show white on its card, from the slicer's own
             render, and orange in the 3D view, which just looks broken.
             Near black is lifted a little so the shape still reads; the
             alternative is a silhouette with no detail in it. */
          /* Dark filament has almost no range left once the shading is
             applied, so black came out a silhouette. Measured against a real
             black model: a base around 0.42 keeps roughly the same amount of
             visible shape as the old flat colour did. The hue is kept, only
             the brightness is raised, so grey stays grey and navy stays navy. */
          const FLOOR = 0.42;
          const lift = c => {
            if(!c) return c;
            const lum = 0.2126*c[0] + 0.7152*c[1] + 0.0722*c[2];
            if(lum >= FLOOR) return c;
            if(lum < 0.005) return [FLOOR, FLOOR, FLOOR * 1.05];   // pure black
            const k = FLOOR / lum;
            return c.map(v => Math.min(1, v * k));
          };
          colourFor = oid => lift(hex(palette[(ext[oid] || 1) - 1]));
        }
      }
    }catch(e){}

    let mesh = null;
    const me = z.entries.find(e=>/3dmodel\.model$/i.test(e.name)) || z.entries.find(e=>/\.model$/i.test(e.name));
    if(me && (forceMesh || !thumb)){
      try{
        let text = td.decode(await zipRead(z, me));
        // Creality Print, OrcaSlicer and Bambu Studio keep the geometry in
        // separate 3D/Objects/*.model parts, leaving 3dmodel.model as an index.
        if(!/<vertex/i.test(text)){
          const parts = z.entries.filter(e=>/^3D\/Objects\/.*\.model$/i.test(e.name));
          let merged = '';
          for(const p of parts){ try{ merged += td.decode(await zipRead(z, p)); }catch(e){} }
          if(merged) text = merged + text;
        }
        mesh = parse3MFModel(text, maxTri, colourFor, skipIds);
      }catch(e){}
    }
    // slicer project metadata
    let cfg = null;
    const ce = z.entries.find(e=>/Slic3r_PE\.config|Metadata\/.*config|project_settings\.config/i.test(e.name));
    if(ce){ try{ cfg = td.decode(await zipRead(z, ce)).slice(0, 40000); }catch(e){} }
    return {thumb, mesh, cfg, names: z.entries.map(e=>e.name)};
  }

  /* ---- gcode ---- */
  function parseGcode(head, tail){
    const text = head + '\n' + tail;
    const g = {};
    const pick = (re, cast)=>{ const m = text.match(re); if(m){ const v = cast ? cast(m[1]) : m[1].trim(); if(v!=null && v!=='' && !(typeof v==='number' && !isFinite(v))) return v; } return null; };
    const f = s=>parseFloat(String(s).replace(/[^0-9.\-]/g,''));

    const trimSlicer = s=>String(s).replace(/\s+on\s+\d{4}-\d{2}-\d{2}.*$/i,'').trim();
    g.slicer = pick(/;\s*generated by\s+([^\n,]+)/i, trimSlicer) || pick(/;\s*Generated with\s+([^\n]+)/i, trimSlicer) || (/;FLAVOR:/.test(text) ? 'Cura' : null);
    g.grams  = pick(/;\s*filament used \[g\]\s*=\s*([\d.]+)/i, f);
    if(g.grams == null) g.grams = pick(/;\s*Filament\s+used.*?=\s*([\d.]+)\s*g/i, f);
    if(g.grams == null) g.grams = pick(/;\s*total filament used \[g\]\s*=\s*([\d.]+)/i, f);
    g.mm     = pick(/;\s*filament used \[mm\]\s*=\s*([\d.]+)/i, f);
    if(g.mm == null){ const cm = pick(/;Filament used:\s*([\d.]+)m/i, f); if(cm != null) g.mm = cm*1000; }
    g.cost   = pick(/;\s*filament cost\s*=\s*([\d.]+)/i, f);
    g.layerH = pick(/;\s*layer_height\s*=\s*([\d.]+)/i, f) || pick(/;Layer height:\s*([\d.]+)/i, f) || pick(/;\s*LAYER_HEIGHT:\s*([\d.]+)/i, f);
    g.nozzle = pick(/;\s*nozzle_diameter\s*=\s*([\d.]+)/i, f);
    g.infill = pick(/;\s*fill_density\s*=\s*([\d.]+)/i, f) || pick(/;\s*sparse_infill_density\s*=\s*([\d.]+)/i, f);
    g.material = pick(/;\s*filament_type\s*=\s*([A-Za-z0-9+ ]+)/i, s=>s.trim().split(/[;,]/)[0]) || pick(/;\s*material_type\s*=\s*(\w+)/i);
    g.printer  = pick(/;\s*printer_model\s*=\s*([^\n]+)/i) || pick(/;\s*printer_settings_id\s*=\s*([^\n]+)/i) || pick(/;\s*TARGET_MACHINE\.NAME:\s*([^\n]+)/i);
    g.profile  = pick(/;\s*print_settings_id\s*=\s*([^\n]+)/i);
    g.nozzleT  = pick(/;\s*(?:temperature|nozzle_temperature)\s*=\s*(\d+)/i, f);
    g.bedT     = pick(/;\s*(?:bed_temperature|hot_plate_temp)\s*=\s*(\d+)/i, f);

    let t = null;
    // PrusaSlicer "; estimated printing time (normal mode) = 2h 22m 8s"
    // OrcaSlicer/Bambu "; total estimated time: 4h 12m 30s"
    const pt = text.match(/;\s*(?:total\s+)?estimated\s+(?:printing\s+)?time[^=:\n]*[=:]\s*([^\n]+)/i);
    if(pt){
      const s = pt[1];
      let mins = 0, any = false;
      const dm = s.match(/(\d+)\s*d/); if(dm){ mins += +dm[1]*1440; any = true; }
      const hm = s.match(/(\d+)\s*h/); if(hm){ mins += +hm[1]*60; any = true; }
      const mm = s.match(/(\d+)\s*m(?!s)/); if(mm){ mins += +mm[1]; any = true; }
      const sm = s.match(/(\d+)\s*s/); if(sm){ mins += +sm[1]/60; any = true; }
      if(any) t = mins;
    }
    if(t == null){ const c = text.match(/;TIME:\s*(\d+)/i); if(c) t = +c[1]/60; }
    g.timeMin = t;

    // Cura and friends only report length. Estimate mass from volume x density.
    if(g.grams == null && g.mm){
      const dens = {PLA:1.24,'PLA+':1.24,'PLA-CF':1.29,PETG:1.27,'PETG-CF':1.31,ABS:1.04,ASA:1.07,
                    TPU:1.21,NYLON:1.14,PA:1.14,'PA-CF':1.19,PC:1.20,PVA:1.23,HIPS:1.04};
      const d = dens[String(g.material||'PLA').toUpperCase()] || 1.24;
      const dia = g.diameter || 1.75;
      const cm3 = Math.PI * Math.pow(dia/2, 2) * g.mm / 1000;
      g.grams = Math.round(cm3 * d * 10) / 10;
      g.gramsEstimated = true;
    }

    // embedded thumbnail (PrusaSlicer / OrcaSlicer / SuperSlicer)
    const ti = text.search(/;\s*thumbnail(?:_JPG)? begin/i);
    if(ti >= 0){
      const seg = text.slice(ti);
      const end = seg.search(/;\s*thumbnail(?:_JPG)? end/i);
      if(end > 0){
        const body = seg.slice(seg.indexOf('\n'), end);
        const b64 = body.split('\n').map(l=>l.replace(/^\s*;\s?/,'').trim()).join('');
        if(b64.length > 100) g.thumbB64 = b64.replace(/[^A-Za-z0-9+/=]/g,'');
      }
    }
    for(const k in g) if(g[k] == null) delete g[k];
    return g;
  }

  /* ---- dispatch ---- */
  self.onmessage = async function(e){
    const {id, op, buf, maxTri, head, tail, entry} = e.data;
    try{
      let out = {}, tr = [];
      if(op === 'hash'){
        out = {sha: await sha256(buf)};
      } else if(op === 'mesh'){
        const ext = e.data.ext;
        let r;
        if(ext === 'stl') r = parseSTL(buf, maxTri);
        else if(ext === 'obj') r = parseOBJ(td.decode(new Uint8Array(buf)), maxTri);
        else if(ext === '3mf'){
          const p = await parse3MF(buf, maxTri, true, !!e.data.needMesh);
          if(p.thumb){ out.thumbBytes = p.thumb; tr.push(p.thumb.buffer); }
          if(p.cfg) out.cfg = p.cfg;
          r = p.mesh;
        } else throw new Error('Unsupported mesh type: ' + ext);
        if(r){
          out.pos = r.pos; out.nrm = r.nrm; out.tris = r.tris; out.bbox = bounds(r.pos);
          tr.push(r.pos.buffer, r.nrm.buffer);
          if(r.col){ out.col = r.col; tr.push(r.col.buffer); }
        }
      } else if(op === 'gcode'){
        out = {g: parseGcode(head || '', tail || '')};
      } else if(op === 'zipnames'){
        out = {entries: readZip(buf, e.data.base).entries
          .filter(x=>!/\/$/.test(x.name))
          .map(x=>({name:x.name, size:x.usize, csize:x.csize, method:x.method, lho:x.lho, crc:x.crc}))};
      } else if(op === 'zipmesh'){
        const z = readZip(buf);
        const ent = z.entries.find(x=>x.name === entry);
        if(!ent) throw new Error('Entry not found in archive');
        const bytes = await zipRead(z, ent);
        const ab = (bytes.byteOffset === 0 && bytes.byteLength === bytes.buffer.byteLength)
          ? bytes.buffer
          : bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
        const ex = (ent.name.split('.').pop() || '').toLowerCase();
        let r;
        if(ex === 'stl') r = parseSTL(ab, maxTri);
        else if(ex === 'obj') r = parseOBJ(td.decode(bytes), maxTri);
        else if(ex === '3mf') r = (await parse3MF(ab, maxTri, false)).mesh;
        else throw new Error('Not a mesh file: ' + ent.name);
        if(!r || !r.pos.length) throw new Error('No geometry in ' + ent.name);
        out.pos = r.pos; out.nrm = r.nrm; out.tris = r.tris; out.bbox = bounds(r.pos);
        tr.push(r.pos.buffer, r.nrm.buffer);
        if(r.col){ out.col = r.col; tr.push(r.col.buffer); }
      } else throw new Error('Unknown op ' + op);
      self.postMessage({id, ok:true, out}, tr);
    }catch(err){
      self.postMessage({id, ok:false, error: String(err && err.message || err)});
    }
  };
}

const Work = {
  _w:null, _n:0, _pend:new Map(),
  get w(){
    if(!Work._w){
      const src = '(' + pvWorkerMain.toString() + ')()';
      Work._w = new Worker(URL.createObjectURL(new Blob([src], {type:'text/javascript'})));
      Work._w.onmessage = e=>{
        const {id, ok, out, error} = e.data;
        const p = Work._pend.get(id); if(!p) return;
        Work._pend.delete(id);
        ok ? p.res(out) : p.rej(new Error(error));
      };
      Work._w.onerror = e=>{ console.error('worker', e); };
    }
    return Work._w;
  },
  call(msg, transfer){
    const id = ++Work._n;
    return new Promise((res,rej)=>{
      Work._pend.set(id, {res,rej});
      Work.w.postMessage(Object.assign({id}, msg), transfer || []);
      setTimeout(()=>{ if(Work._pend.has(id)){ Work._pend.delete(id); rej(new Error('Worker timeout')); } }, 120000);
    });
  }
};

/* ============================================================
   Render — WebGL thumbnail generator
   ============================================================ */
const Render = {
  _gl:null, _cv:null, _prog:null, _size:0,
  init(w, h){
    if(Render._gl && Render._size === w+'x'+h) return Render._gl;
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const gl = cv.getContext('webgl', {antialias:true, preserveDrawingBuffer:true, alpha:true});
    if(!gl) throw new Error('WebGL unavailable');
    const vs = gl.createShader(gl.VERTEX_SHADER);
    gl.shaderSource(vs, 'attribute vec3 p;attribute vec3 n;attribute vec3 c;uniform mat4 mvp;uniform mat4 mv;'+
      'varying vec3 vn;varying float vd;varying vec3 vc;'+
      'void main(){vec4 e=mv*vec4(p,1.0);vn=normalize(mat3(mv)*n);vc=c;vd=-e.z;gl_Position=mvp*vec4(p,1.0);}');
    gl.compileShader(vs);
    const fs = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(fs, 'precision mediump float;varying vec3 vn;varying float vd;varying vec3 vc;'+
      'uniform vec3 base;uniform vec2 dr;uniform float useVC;'+
      'void main(){vec3 N=normalize(vn);if(!gl_FrontFacing)N=-N;'+
      'vec3 base2=mix(base,vc,useVC);'+
      'float k=max(dot(N,normalize(vec3(0.32,0.42,0.85))),0.0);'+
      'float f=max(dot(N,normalize(vec3(-0.5,-0.3,0.4))),0.0)*0.22;'+
      'float rim=pow(1.0-max(N.z,0.0),2.5)*0.30;'+
      'float dep=clamp((dr.y-vd)/max(dr.y-dr.x,0.0001),0.0,1.0);'+
      'vec3 c=base2*(0.24+0.70*k+f)+vec3(rim*0.9,rim*0.75,rim*0.6);'+
      'c*=mix(0.72,1.06,dep);gl_FragColor=vec4(c,1.0);}');
    gl.compileShader(fs);
    const pr = gl.createProgram();
    gl.attachShader(pr, vs); gl.attachShader(pr, fs); gl.linkProgram(pr);
    if(!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error('Shader link failed: ' + gl.getProgramInfoLog(pr));
    gl.useProgram(pr);
    gl.enable(gl.DEPTH_TEST);
    Render._gl = gl; Render._cv = cv; Render._prog = pr; Render._size = w+'x'+h;
    return gl;
  },
  _lookAt(eye, ctr, up){
    const z = [eye[0]-ctr[0], eye[1]-ctr[1], eye[2]-ctr[2]];
    let l = Math.hypot(z[0],z[1],z[2])||1; z[0]/=l; z[1]/=l; z[2]/=l;
    let x = [up[1]*z[2]-up[2]*z[1], up[2]*z[0]-up[0]*z[2], up[0]*z[1]-up[1]*z[0]];
    l = Math.hypot(x[0],x[1],x[2])||1; x[0]/=l; x[1]/=l; x[2]/=l;
    const y = [z[1]*x[2]-z[2]*x[1], z[2]*x[0]-z[0]*x[2], z[0]*x[1]-z[1]*x[0]];
    return new Float32Array([
      x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0,
      -(x[0]*eye[0]+x[1]*eye[1]+x[2]*eye[2]),
      -(y[0]*eye[0]+y[1]*eye[1]+y[2]*eye[2]),
      -(z[0]*eye[0]+z[1]*eye[1]+z[2]*eye[2]), 1]);
  },
  _ortho(rx, ry, n, f){
    return new Float32Array([1/rx,0,0,0, 0,1/ry,0,0, 0,0,-2/(f-n),0, 0,0,-(f+n)/(f-n),1]);
  },
  _mul(a,b){
    const o = new Float32Array(16);
    for(let i=0;i<4;i++) for(let j=0;j<4;j++){
      let s=0; for(let k=0;k<4;k++) s += a[k*4+j]*b[i*4+k];
      o[i*4+j]=s;
    }
    return o;
  },
  draw(pos, nrm, bbox, opt, vcol){
    opt = opt || {};
    const W = opt.size || 320, H = opt.height || Math.round(W * 0.75);
    const gl = Render.init(W, H);
    const pr = Render._prog;
    gl.viewport(0,0,W,H);
    const bgc = opt.bg || [0.086,0.098,0.122];
    gl.clearColor(bgc[0], bgc[1], bgc[2], 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    const ctr = [(bbox.min[0]+bbox.max[0])/2, (bbox.min[1]+bbox.max[1])/2, (bbox.min[2]+bbox.max[2])/2];
    const rad = Math.max(1e-3, Math.hypot(bbox.size[0], bbox.size[1], bbox.size[2]) / 2);
    const az = (opt.az == null ? -52 : opt.az) * Math.PI/180;
    const el = U.clamp(opt.el == null ? 26 : opt.el, -85, 85) * Math.PI/180;
    const d = [Math.cos(el)*Math.cos(az), Math.cos(el)*Math.sin(az), Math.sin(el)];
    const dist = rad * 3.2;
    const eye = [ctr[0]+d[0]*dist, ctr[1]+d[1]*dist, ctr[2]+d[2]*dist];
    const view = Render._lookAt(eye, ctr, [0,0,1]);
    const ry = rad * 1.12 / (opt.zoom || 1), rx = ry * (W/H);
    const proj = Render._ortho(rx, ry, 0.01, dist + rad*3);
    const mvp = Render._mul(proj, view);

    const put = (name, data, n)=>{
      const b = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, b);
      gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(pr, name);
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, n, gl.FLOAT, false, 0, 0);
      return b;
    };
    const b1 = put('p', pos, 3), b2 = put('n', nrm, 3);
    // Per-vertex colours come from a sliced project that says which filament
    // each object uses. Without them everything falls back to one flat colour.
    const useVC = !!(vcol && vcol.length === pos.length);
    let b3 = null;
    const cloc = gl.getAttribLocation(pr, 'c');
    if(useVC) b3 = put('c', vcol, 3);
    else if(cloc >= 0){ gl.disableVertexAttribArray(cloc); gl.vertexAttrib3f(cloc, 1, 1, 1); }
    gl.uniform1f(gl.getUniformLocation(pr,'useVC'), useVC ? 1 : 0);
    gl.uniformMatrix4fv(gl.getUniformLocation(pr,'mvp'), false, mvp);
    gl.uniformMatrix4fv(gl.getUniformLocation(pr,'mv'), false, view);
    const col = opt.color || [1.0, 0.545, 0.24];
    gl.uniform3f(gl.getUniformLocation(pr,'base'), col[0], col[1], col[2]);
    gl.uniform2f(gl.getUniformLocation(pr,'dr'), dist - rad, dist + rad);
    gl.drawArrays(gl.TRIANGLES, 0, pos.length/3);
    gl.deleteBuffer(b1); gl.deleteBuffer(b2); if(b3) gl.deleteBuffer(b3);
    return Render._cv;
  },
  async toBlob(pos, nrm, bbox, opt, vcol){
    Render.draw(pos, nrm, bbox, opt, vcol);
    return await new Promise(res=>Render._cv.toBlob(res, 'image/webp', 0.86));
  },
  canvas(){ return Render._cv; }
};

/* ============================================================
   Thumbs — blob store + object URL cache
   ============================================================ */
const Thumbs = {
  _urls: new Map(),
  async put(id, blob){ await DB.put('thumbs', {id, blob}); Thumbs._urls.delete(id); return id; },
  async url(id){
    if(!id) return null;
    if(Thumbs._urls.has(id)) return Thumbs._urls.get(id);
    const rec = await DB.get('thumbs', id);
    if(!rec || !rec.blob){ Thumbs._urls.set(id, null); return null; }
    const u = URL.createObjectURL(rec.blob);
    Thumbs._urls.set(id, u);
    return u;
  },
  async del(id){ if(!id) return; const u = Thumbs._urls.get(id); if(u) URL.revokeObjectURL(u);
    Thumbs._urls.delete(id); await DB.del('thumbs', id).catch(()=>{}); },
  /* Hydrate every <img data-thumb="id"> currently in the DOM */
  async hydrate(root){
    const els = (root||document).querySelectorAll('img[data-thumb]:not([data-done])');
    for(const el of els){
      el.setAttribute('data-done','1');
