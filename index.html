      '<div class="mono" style="color:var(--dim2);font-size:11.5px;margin-top:4px;word-break:break-all">'+U.esc(root.name||'')+'/'+U.esc(m.path)+
        '<button class="b g sm ico" style="margin-left:6px;vertical-align:-5px" title="Rename" '+
        'onclick="PV.Detail.renameName()">'+I.edit+'</button></div></div>'+
      '<button class="b g ico" onclick="PV.Detail.fav()" title="Favorite" style="color:'+(m.favorite?'var(--warn)':'var(--dim2)')+'">'+I.star+'</button>'+
      '</div>';

    h += '<div style="margin:10px 0 12px;display:flex;align-items:center;gap:2px">'+
      [1,2,3,4,5].map(n=>'<button class="b g ico" style="padding:3px;color:'+((m.rating||0)>=n?'var(--warn)':'var(--line2)')+
        '" onclick="PV.Detail.rate('+n+')" title="'+n+' star'+(n>1?'s':'')+'">'+I.star+'</button>').join('')+
      (m.rating ? '<button class="b g sm" style="margin-left:6px;font-size:11px" onclick="PV.Detail.rate(0)">clear</button>' : '')+
      '</div>';

    h += '<div class="pv-tags" style="margin-bottom:12px">'+
      ((m.tags||[]).map(t=>'<span class="tg a">'+U.esc(t)+'</span>').join('') || '<span style="color:var(--dim2);font-size:12px">No tags</span>')+
      ((m.collections||[]).map(c=>'<span class="tg" style="display:inline-flex;align-items:center;gap:4px">'+
        '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" style="width:11px;height:11px">'+
        '<path d="M2 5.5A1.5 1.5 0 0 1 3.5 4h3.2a1.5 1.5 0 0 1 1.2.6l.8 1.1a1.5 1.5 0 0 0 1.2.6h5.6A1.5 1.5 0 0 1 17 7.8V15a1.5 1.5 0 0 1-1.5 1.5h-12A1.5 1.5 0 0 1 2 15z"/></svg>'+
        U.esc(c)+'</span>').join(''))+
      '</div>';

    h += '<dl class="kv" style="margin-bottom:12px">';
    if(m.creator) h += '<dt>Creator</dt><dd>'+U.esc(m.creator)+'</dd>';
    if(m.source) h += '<dt>Source</dt><dd><a href="'+U.attr(m.source)+'" target="_blank" rel="noopener noreferrer">'+U.esc(m.source.slice(0,64))+(m.source.length>64?'...':'')+'</a></dd>';
    if(m.license) h += '<dt>License</dt><dd>'+U.esc(m.license)+'</dd>';
    h += '<dt>Files</dt><dd>'+m.fileCount+' ('+U.bytes(m.bytes)+')</dd>';
    if(m.bbox) h += '<dt>Dimensions</dt><dd>'+m.bbox.size.map(x=>U.num(x,1)).join(' &times; ')+' mm</dd>';
    if(m.tris) h += '<dt>Triangles</dt><dd>'+m.tris.toLocaleString()+'</dd>';
    if(est.timeMin) h += '<dt>Est. time</dt><dd>'+U.dur(est.timeMin)+'</dd>';
    if(est.grams) h += '<dt>Est. filament</dt><dd>'+U.num(est.grams,1)+' g'+(est.material?' '+U.esc(est.material):'')+'</dd>';
    if(est.layerH) h += '<dt>Layer / nozzle</dt><dd>'+est.layerH+' mm'+(est.nozzle?' / '+est.nozzle+' mm':'')+'</dd>';
    if(est.printer) h += '<dt>Sliced for</dt><dd>'+U.esc(est.printer)+'</dd>';
    h += '<dt>File date</dt><dd>'+U.date(m.mtime)+'</dd>';
    h += '</dl>';

    if(m.notes) h += '<div class="note" style="white-space:pre-wrap">'+U.esc(m.notes)+'</div>';

    h += '<hr>';
    h += '<h3 style="font-size:13px;margin-bottom:9px;color:var(--dim)">Files ('+files.length+')</h3><div class="filelist">';
    h += files.map(f=>{
      const cls = f.ext==='stl'?'stl' : f.ext==='3mf'?'tmf' : f.kind==='gcode'?'gcode' : f.kind==='image'?'img' : '';
      const ic = f.kind==='image'?I.img : f.kind==='doc'?I.doc : f.kind==='gcode'?I.print : I.cube;
      let extras = '';
      if(f.g && f.g.timeMin) extras += '<span class="z">'+U.dur(f.g.timeMin)+'</span>';
      if(f.g && f.g.grams) extras += '<span class="z">'+U.num(f.g.grams,0)+'g</span>';
      return '<div class="filerow">'+ic+
        // Only strip the model path when the file is genuinely inside it. An
        // archive sitting next to its unpacked folder has a path of
        // "<model>.zip", and blindly slicing left the row labelled just "zip".
        '<span class="n" title="'+U.attr(f.path)+'">'+U.esc(
          f.path.startsWith(m.path + '/') ? f.path.slice(m.path.length + 1) : f.name)+'</span>'+
        extras+
        '<span class="ext '+cls+'">'+U.esc(f.ext)+'</span>'+
        '<span class="z" style="min-width:56px;text-align:right">'+U.bytes(f.size)+'</span>'+
        /* One contextual action and a menu, rather than five icons. Five made
           the row scroll sideways on a phone and gave every file the same
           visual weight as the thing you came to do. */
        (['stl','3mf','obj'].includes(f.ext) ? '<button class="b g sm ico" title="3D view" onclick="PV.Viewer.open(\''+f.id+'\')">'+I.eye+'</button>' : '')+
        (f.kind==='image' ? '<button class="b g sm ico" title="Use as cover" onclick="PV.Detail.setCover(\''+f.id+'\')">'+I.img+'</button>' : '')+
        '<button class="b g sm ico" title="More" onclick="PV.Detail.fileMenu(\''+f.id+'\')">'+I.dots+'</button>'+
        '</div>';
    }).join('');
    h += '</div>';

    if(m.isArchive) h += Archive.section(m);

    h += '<hr><div style="display:flex;align-items:center;gap:10px;margin-bottom:9px">'+
      '<h3 style="font-size:13px;color:var(--dim);flex:1">Print history ('+prints.length+')</h3>'+
      '<button class="b sm" onclick="PV.Prints.log(\''+m.id+'\')">'+I.plus+' Log a print</button></div>';
    if(!prints.length){
      h += '<div style="color:var(--dim2);font-size:12.5px;padding:6px 0">Never printed. Log one after it comes off the bed and the settings will be here next time.</div>';
    } else {
      h += '<div class="tw"><table class="t"><thead><tr><th>Date</th><th>Result</th><th>Printer</th><th>Filament</th>'+
           '<th class="num">Layer</th><th class="num">Grams</th><th class="num">Time</th><th>Notes</th><th></th></tr></thead><tbody>'+
           prints.map(p=>Prints.row(p, true)).join('')+'</tbody></table></div>';
    }
    return h;
  },

  /* Five actions, not nine. This row had grown to the point where it
     overflowed sideways on a desktop and stood four rows tall on a phone,

  /* The same overflow, for one file. Named so the row can stay two buttons

  /* The overflow. Each item steps back to the model first, so anything that

  more(){

        U.attr(m.source)+'" target="_blank" rel="noopener noreferrer">'+I.ext+' Open source page</a>' : '') +
      item(I.chart, 'What would this cost?', 'PV.Cost.open(\''+m.id+'\')') +
      item(I.eyeOff, 'Ignore this folder', 'PV.Detail.exclude()', 'stops indexing it') +
      '<hr>' +
      item(I.trash, 'Delete model', 'PV.Detail.deleteModel()',
           Store.modelFiles(m.id).length + ' files', 'd'),
      '<div class="sp"></div><button class="b" onclick="PV.Modal.back()">Back</button>');

  edit(){
    const m = Store.model(Detail.cur); if(!m) return;
    Modal.open('Edit: '+m.name,
      '<div class="f"><label>Name</label><input id="eName" value="'+U.attr(m.name)+'"></div>'+
      '<div class="fr">'+
        '<div class="f"><label>Creator / designer</label><input id="eCreator" value="'+U.attr(m.creator||'')+'"></div>'+

      '<div class="f"><label>Source URL</label><input id="eSource" value="'+U.attr(m.source||'')+'" placeholder="https://www.printables.com/model/..."></div>'+

        '<div class="hint">Free-form. Try function ("bracket", "organizer"), style ("articulated"), or status ("tested", "needs supports").</div></div>'+

      '<button class="b" onclick="PV.Modal.back()">Cancel</button>'+
      '<button class="b p" onclick="PV.Detail.saveEdit()">Save</button>');
  },
  async saveEdit(){
    const m = Store.model(Detail.cur); if(!m) return;
    m.name = Modal.val('eName').trim() || m.name;
    m.creator = Modal.val('eCreator').trim();
    m.license = Modal.val('eLicense').trim();
    m.source = Modal.val('eSource').trim();
    m.tags = U.uniq(Modal.val('eTags').split(',').map(s=>s.trim()).filter(Boolean));
    m.collections = U.uniq(Modal.val('eColl').split(',').map(s=>s.trim()).filter(Boolean));

    Toast.ok('Saved');
    Detail.open(m.id); UI.render();
  },
  async fav(){ const m=Store.model(Detail.cur); if(!m) return; m.favorite=!m.favorite; await Store.put('models',m); Detail.open(m.id); UI.render(); },
  async rate(n){ const m=Store.model(Detail.cur); if(!m) return; m.rating = m.rating===n?0:n; await Store.put('models',m); Detail.open(m.id); UI.render(); },

  copyPath(){
    const m = Store.model(Detail.cur); if(!m) return;
    const p = ((Store.root(m.rootId)||{}).name||'') + '/' + m.path;
    navigator.clipboard.writeText(p.replace(/\//g,'\\')).then(
      ()=>Toast.ok('Path copied: '+p),
      ()=>Toast.err('Clipboard blocked by the browser'));
  },
  async save(fileId){
    const f = Store.file(fileId); if(!f) return;
    try{
      const file = await FS.read(f.rootId, f.path);
      U.download(f.name, file);
      Toast.ok('Saving '+f.name);
    }catch(e){ Toast.err('Could not read file: '+e.message); }
  },
  /* Renaming or deleting changes what the scanner would group, and for a
     single loose file the filename IS the model name, so both finish by
     reindexing that folder rather than trying to patch the index by hand. */
  /* Shortcut to the one field people change most. Edit has the rest. */
  renameName(fromCard){
    const m = Store.model(Detail.cur); if(!m) return;
    Detail._renameFromCard = !!fromCard;
    Modal.open('Rename',
      '<div class="f"><label>Display name</label><input id="rnName2" value="'+U.attr(m.name)+'"></div>'+
      '<div style="color:var(--dim2);font-size:12px;line-height:1.6">Changes only the name Printery shows. '+
      'Nothing on disk is renamed.</div>',
      '<button class="b" onclick="PV.Modal.back()">Cancel</button>'+
      '<button class="b p" onclick="PV.Detail.saveName()">Save</button>');
    setTimeout(()=>{ const i=document.getElementById('rnName2'); if(i){ i.focus(); i.select(); } }, 30);
  },

  async saveName(){
    const m = Store.model(Detail.cur); if(!m) return;
    const el = document.getElementById('rnName2');
    const name = el ? el.value.trim() : '';
    if(!name) return Toast.err('A name cannot be empty');
    if(name === m.name) return Modal.back();
    m.name = name;
    await Store.put('models', m);
    Modal.close(); UI.render();
    // opened from a card, so stay in the library rather than diving into it
    if(!Detail._renameFromCard) Detail.open(m.id);
    Toast.ok('Renamed to '+name);
  },

  /* Stop indexing this model's folder. Nothing on disk is touched: the files
     stay, they just stop producing a card. Meant for the unpacked copy of a
     download sitting next to the archive it came from. */
  exclude(){
    const m = Store.model(Detail.cur); if(!m) return;
    const r = Store.root(m.rootId); if(!r) return;
    const files = Store.modelFiles(m.id);
    const isDir = !(files.length === 1 && files[0].path === m.path);
    const path = isDir ? m.path : U.dir(m.path);
    if(!path) return Toast.err('That is the folder itself, exclude something inside it instead');
    Modal.confirm('Stop indexing this folder?',
      'Printery will ignore <b>'+U.esc(U.base(path))+'</b> and everything under it on the next scan, '+
      'and drop the '+(isDir?'card':'cards')+' it produced.'+
      '<div class="mono" style="margin-top:8px;font-size:11.5px;color:var(--dim2);word-break:break-all">'+
      U.esc(r.name||'')+'/'+U.esc(path)+'</div>'+
      '<div style="margin-top:10px">Nothing on disk is moved or deleted. Undo it in Settings under Indexed folders.</div>',
      async ()=>{
        r.excludes = (r.excludes||[]).concat([path]);
        await Store.put('roots', r);
        Modal.close();
        Toast.ok('Excluded '+U.base(path)+', reindexing');
        await Scan.run([r.id]);
      }, 'Exclude', true);
  },

  renameFile(fileId){
    const f = Store.file(fileId); if(!f) return;
    Modal.open('Rename file',
      '<div class="f"><label>File name</label><input id="rnFile" value="'+U.attr(f.name)+'"></div>'+
      '<div style="color:var(--dim2);font-size:12px;line-height:1.6">Renames it on disk, in the same folder. '+
      'Keep the extension, or previews and slicer data stop being read.</div>',
      '<button class="b" onclick="PV.Modal.back()">Cancel</button>'+
      '<button class="b p" onclick="PV.Detail.saveFileName(\''+fileId+'\')">Rename</button>');
    setTimeout(()=>{ const i=document.getElementById('rnFile'); if(i){ i.focus(); i.select(); } }, 30);
  },

  async saveFileName(fileId){
    const f = Store.file(fileId); if(!f) return;
    const el = document.getElementById('rnFile');
    const name = el ? el.value.trim() : '';
    if(!name || name === f.name) return Modal.back();
    if(/[\\/]/.test(name)) return Toast.err('A file name cannot contain a slash');
    if(!FS.renameFile) return Toast.err('Renaming is not supported by this browser');
    try{
      await FS.renameFile(f.rootId, f.path, name);
      Modal.close();
      Toast.ok('Renamed to '+name+', reindexing');
      await Scan.run([f.rootId]);
    }catch(e){ Toast.err('Rename failed: '+e.message); }
  },

  /* Show a file where it actually lives. Reveal rather than open, so the file
     manager selects it in its folder instead of launching it in whatever app
     claims the extension. */
  async revealFile(fileId){
    const f = Store.file(fileId); if(!f) return;
    try{ await FS.openExternal(f.rootId, f.path, true); }
    catch(e){ Toast.err('Could not open the folder: '+(e && e.message || e)); }
  },

  /* The same thing for the model as a whole. A model that is a folder gets
     opened, so you land inside it. A loose single file has no folder of its
     own, so that one gets revealed in its parent instead, which is the same
     answer to the same question. */
  async openFolder(){
    const m = Store.model(Detail.cur); if(!m) return;
    const files = Store.modelFiles(m.id);
    const loose = files.length === 1 && files[0].path === m.path;
    try{ await FS.openExternal(m.rootId, m.path, loose); }
    catch(e){ Toast.err('Could not open the folder: '+(e && e.message || e)); }
  },

  deleteFile(fileId){
    const f = Store.file(fileId); if(!f) return;
    const r = Store.root(f.rootId);
    Modal.confirm('Delete this file?',
      'Deletes <b>'+U.esc(f.name)+'</b> ('+U.bytes(f.size)+') from disk.<div class="mono" style="margin-top:8px;'+
      'font-size:11.5px;color:var(--dim2);word-break:break-all">'+U.esc((r&&r.name)||'')+'/'+U.esc(f.path)+'</div>'+
      '<div style="margin-top:10px">There is no recycle bin here, so this cannot be undone.</div>',
      async ()=>{
        try{
          await FS.deleteFile(f.rootId, f.path);
          Modal.close();
          Toast.ok('Deleted '+f.name+', reindexing');
          await Scan.run([f.rootId]);
        }catch(e){ Toast.err('Delete failed: '+e.message); }
      }, 'Delete', true);
  },

  /* Delete the whole model, every file it owns, rather than picking them off
     one at a time. Honours the same quarantine setting the duplicate cleanup
     uses, because a model can be forty files and several hundred megabytes and
     that is the wrong thing to make irreversible by default. The dialog says
     which of the two is about to happen rather than leaving it to be
     discovered afterwards. */
  deleteModel(){
    const m = Store.model(Detail.cur); if(!m) return;
    const files = Store.modelFiles(m.id);
    if(!files.length) return Toast.err('Nothing to delete');

    const quarantine = Store.settings.dupeAction !== 'delete';
    const qdir = Store.settings.quarantineDir || '_PrintVault_quarantine';
    const bytes = files.reduce((s,f)=>s+(f.size||0), 0);
    const r = Store.root(m.rootId);
    const list = files.slice(0, 8).map(f=>U.esc(f.name)).join('<br>') +
                 (files.length > 8 ? '<br>and ' + (files.length - 8) + ' more' : '');

    /* Permanent and more than a couple of files means typing it out. Moving to
       quarantine stays a plain confirm, because that one is recoverable and
       making the safe path as tedious as the unsafe one just teaches people
       to switch the setting off. */
    const run = async ()=>{
      Modal.close();
      Prog.start((quarantine?'Moving ':'Deleting ') + m.name + '...');
      const gone = [];
      let fail = 0;
      for(let i=0;i<files.length;i++){
        if(Prog.cancelled) break;
        const f = files[i];
        Prog.set((quarantine?'Moving':'Deleting')+' ('+(i+1)+'/'+files.length+') '+f.name, i, files.length);
        try{
          if(quarantine) await FS.moveToQuarantine(f.rootId, f.path, qdir);
          else await FS.deleteFile(f.rootId, f.path);
          gone.push(f.id);
        }catch(e){
          fail++;
          if(fail === 1) Toast.err((quarantine?'Move':'Delete')+' failed: '+e.message);
        }
      }
      if(!fail && gone.length && m.path && !(files.length === 1 && files[0].path === m.path)){
        try{ await FS.removeDir(m.rootId, m.path); }catch(e){}
      }
      Prog.stop();
      if(gone.length){
        Toast.ok((quarantine?'Moved ':'Deleted ')+gone.length+' file'+(gone.length===1?'':'s')+
                 (fail?', '+fail+' failed':'')+', reindexing');
        await Scan.run([m.rootId]);
      }
    };

    if(!quarantine && files.length >= 3){
      return Modal.confirmTyped('Delete "'+U.esc(m.name)+'"?',
        'This permanently removes <b>'+files.length+' files</b>, '+U.bytes(bytes)+
        ', from disk. There is no Recycle Bin and Printery cannot bring them back.'+
        '<div class="mono" style="margin-top:8px;font-size:11.5px;color:var(--dim2);word-break:break-all">'+
          U.esc((r&&r.name)||'') + '/' + U.esc(m.path) + '</div>',
        'DELETE', run, I.trash+' Delete permanently');
    }

    Modal.confirm(
      quarantine ? 'Move this model out?' : 'Delete this model?',
      '<b>' + U.esc(m.name) + '</b><br>' + files.length + ' file' + (files.length===1?'':'s') +
        ', ' + U.bytes(bytes) +
      '<div class="mono" style="margin-top:8px;font-size:11.5px;color:var(--dim2);word-break:break-all">' +
        U.esc((r&&r.name)||'') + '/' + U.esc(m.path) + '</div>' +
      '<div class="mono" style="margin-top:8px;font-size:11.5px;color:var(--dim2);max-height:120px;overflow:auto">' +
        list + '</div>' +
      '<div style="margin-top:10px">' + (quarantine
        ? 'Everything moves to <b>' + U.esc(qdir) + '</b> inside the library, so you can put it back by hand. ' +
          'Change this under Settings if you would rather it deleted outright.'
        : 'There is no recycle bin here, so this cannot be undone.') + '</div>',
      run,
      quarantine ? 'Move out' : 'Delete', true);
  },

  /* Add a photo of the finished print. Copies it in beside the model and
     makes it the cover straight away, so there is no rescan and no thinking
     about where a file has to sit for the scanner to notice it. */
  addPhoto(){
    const m = Store.model(Detail.cur); if(!m) return;
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = async ()=>{
      const file = inp.files && inp.files[0]; if(!file) return;
      const files = Store.modelFiles(m.id);
      const isDir = !(files.length === 1 && files[0].path === m.path);
      const ext = (U.ext(file.name) || 'jpg');
      // a folder gets cover.jpg, a loose file gets one named after it, both of
      // which the scanner will also recognise on its own later
      const base = isDir ? 'cover' : U.stem(U.base(m.path));
      const dir = isDir ? m.path : U.dir(m.path);
      let name = base + '.' + ext, n = 2;
      const taken = new Set(files.map(f=>U.base(f.path).toLowerCase()));
      while(taken.has(name.toLowerCase())) name = base + '-' + (n++) + '.' + ext;
      const path = (dir ? dir + '/' : '') + name;
      try{
        Toast.show('Adding '+name+'...');
        await FS.writeFile(m.rootId, path, file);
        const rec = {id: m.rootId+':'+path, rootId: m.rootId, modelId: m.id, path, name,
          ext, kind: 'image', size: file.size, mtime: file.lastModified || Date.now()};
        await Store.put('files', rec);
        const t = await imgThumb(file, Store.settings.thumbSize);
        if(t){
          const id = 'tm'+m.id;
          await Thumbs.put(id, t);
          Thumbs._urls.delete(id);
          m.thumbId = id; m.thumbSrc = 'user'; m.thumbFile = path;
        }
        m.fileCount = Store.modelFiles(m.id).length;
        m.bytes = Store.modelFiles(m.id).reduce((a,f)=>a+(f.size||0), 0);
        await Store.put('models', m);
        UI.render(); Detail.open(m.id);
        Toast.ok('Added '+name+(t ? ' and set it as the cover' : ''));
      }catch(e){ Toast.err('Could not add the photo: '+e.message); }
    };
    inp.click();
  },

  async setCover(fileId){
    const f = Store.file(fileId); if(!f) return;
    const m = Store.model(f.modelId); if(!m) return;
    try{
      const blob = await FS.read(f.rootId, f.path);
      const t = await imgThumb(blob, Store.settings.thumbSize);
      if(!t) throw new Error('Could not decode image');
      const id = 'tm'+m.id;
      await Thumbs.put(id, t);
      Thumbs._urls.delete(id);
      m.thumbId = id; m.thumbSrc = 'user'; m.thumbFile = f.path;
      await Store.put('models', m);
      Toast.ok('Cover updated');
      Detail.open(m.id); UI.render();
    }catch(e){ Toast.err(e.message); }
  },
  async regen(){
    const m = Store.model(Detail.cur); if(!m) return;
    Toast.show('Rendering preview...');
    await Thumbs.del('tm'+m.id);
    m.thumbId = null;
    try{
      await Scan.thumbOne(m, Store.settings.thumbSize);
      await Store.put('models', m);
      Thumbs._urls.delete(m.thumbId);
      Detail.open(m.id); UI.render();
      Toast.ok(m.thumbId ? 'Preview updated' : 'Nothing renderable in this model');
    }catch(e){ Toast.err('Preview failed: '+e.message); }
  }
};

/* ============================================================
   Archive — look inside a zip that was never extracted
   ============================================================ */
const Archive = {
  _cache:new Map(),   // modelId -> [{name,size}]

  file(m){ return Store.modelFiles(m.id).find(f=>f.kind === 'arch'); },

  section(m){
    const f = Archive.file(m);
    if(!f) return '';
    const listed = Archive._cache.get(m.id) || (f.zip && f.zip.entries);
    let h = '<hr><div style="display:flex;align-items:center;gap:10px;margin-bottom:9px;flex-wrap:wrap">'+
      '<h3 style="font-size:13px;color:var(--dim);flex:1">Archive contents</h3>';
    if(f.ext === 'zip' || (f.ext === '7z' && FS.list7z)){
      h += '<button class="b sm" onclick="PV.Archive.peek(\''+m.id+'\')">'+I.refresh+
           (listed ? ' Re-read' : ' Look inside')+'</button>'+
           '<button class="b sm p" onclick="PV.Archive.extractPrompt(\''+m.id+'\')">'+I.dl+' Extract here</button>';
    }
    h += '</div>';

    if(f.ext !== 'zip')
      return h + '<div class="note bad">This is a <b>.'+U.esc(f.ext)+'</b> archive. Printery can only read '+
        'inside <b>.zip</b> files, so the contents cannot be listed. Extract it next to the archive and rescan '+
        'to index what is inside.</div>';

    if(!listed)
      return h + '<div class="note">This archive was never extracted, so Printery indexed it as a single '+
        'file. Read the listing to see what is inside without unpacking it, or extract it to make the models '+
        'usable in your slicer ('+U.bytes(f.size)+' compressed).</div>';

    if(listed.error) return h + '<div class="note bad">'+U.esc(listed.error)+'</div>';

    const meshes = listed.filter(e=>['stl','3mf','obj'].includes(U.ext(e.name)));
    const others = listed.filter(e=>!['stl','3mf','obj'].includes(U.ext(e.name)));
    h += '<div style="color:var(--dim2);font-size:12.5px;margin-bottom:9px">'+
      listed.length+' entries, '+meshes.length+' printable'+
      (meshes.length ? '. Preview one without extracting the archive.' : '.')+'</div>';
    h += '<div class="filelist">';
    h += meshes.concat(others).slice(0, 80).map(e=>{
      const ex = U.ext(e.name);
      const cls = ex==='stl'?'stl' : ex==='3mf'?'tmf' : kindOf(ex)==='image'?'img' : '';
      const isMesh = ['stl','3mf','obj'].includes(ex);
      return '<div class="filerow">'+(isMesh?I.cube:kindOf(ex)==='image'?I.img:I.doc)+
        '<span class="n" title="'+U.attr(e.name)+'">'+U.esc(e.name)+'</span>'+
        '<span class="ext '+cls+'">'+U.esc(ex||'?')+'</span>'+
        '<span class="z" style="min-width:56px;text-align:right">'+U.bytes(e.size)+'</span>'+
        (isMesh ? '<button class="b g sm ico" title="Preview in 3D" onclick="PV.Archive.preview(\''+m.id+'\','+
          JSON.stringify(e.name).replace(/"/g,'&quot;')+')">'+I.eye+'</button>' : '')+
        '</div>';
    }).join('');
    h += '</div>';
    if(listed.length > 80) h += '<div style="color:var(--dim2);font-size:12px;padding:7px 2px">'+
      'Showing 80 of '+listed.length+' entries.</div>';
    return h;
  },

  /* List an archive's contents by reading only its tail, where the zip central
     directory lives. A 30 MB archive costs about 256 KB of reads. */
  async entries(f){
    if(!f) throw new Error('No archive file on this model');

    /* 7z has no central directory sitting at the end of the file, so the tail
       trick below does not apply and there is nothing a browser can do with
       one: reading it means decoding LZMA, and this app ships as a single file
       with no dependencies. The desktop shell has a Rust reader for it. */
    if(f.ext === '7z'){
      if(!FS.list7z) throw new Error('7z archives can only be read by the desktop app');
      return await FS.list7z(f.rootId, f.path);
    }
    if(f.ext !== 'zip' && f.ext !== '3mf') throw new Error('Only .zip, .7z and .3mf containers can be read');
    let want = 262144;
    for(let attempt = 0; attempt < 4; attempt++){
      const t = await FS.readTail(f.rootId, f.path, want);
      try{
        const out = await Work.call({op:'zipnames', buf:t.buf, base:t.base}, [t.buf]);
        return out.entries;
      }catch(e){
        const m = /^NEEDMORE:(\d+)/.exec(e.message);
        if(!m) throw e;
        const need = +m[1];
        if(need >= t.size){ want = t.size; }             // give up and read it all
        else if(need <= want) throw e;                   // no progress possible
        else want = Math.min(need, t.size);
      }
    }
    throw new Error('Could not locate the archive index');
  },

  /* Where an entry's payload starts, after its local header */
  async dataStart(file, ent){
    const head = new DataView(await file.slice(ent.lho, ent.lho + 30).arrayBuffer());
    if(head.getUint32(0, true) !== 0x04034b50) throw new Error('Damaged entry header');
    return ent.lho + 30 + head.getUint16(26, true) + head.getUint16(28, true);
  },

  /* Stream one entry straight to disk. Nothing is held in memory, which is what
     large entries were failing on, and the bytes are checksummed on the way
     past so a short or corrupt write is caught rather than left on disk. */
  async extractTo(f, ent, destDir, segs){
    if(ent.method !== 0 && ent.method !== 8)
      throw new Error('Unsupported compression in "'+U.base(ent.name)+'" (method '+ent.method+')');
    const file = await FS.read(f.rootId, f.path);
    const start = await Archive.dataStart(file, ent);

    let dir = destDir;
    for(let i=0;i<segs.length-1;i++) dir = await dir.getDirectoryHandle(segs[i], {create:true});
    const leaf = segs[segs.length-1];
    const fh = await dir.getFileHandle(leaf, {create:true});
    const w = await fh.createWritable();

    let crc = 0, bytes = 0;
    const meter = new TransformStream({
      transform(chunk, ctrl){ crc = FS.crc32(chunk, crc); bytes += chunk.length; ctrl.enqueue(chunk); }
    });
    let src = file.slice(start, start + ent.csize).stream();
    if(ent.method === 8) src = src.pipeThrough(new DecompressionStream('deflate-raw'));
    try{
      await src.pipeThrough(meter).pipeTo(w);
    }catch(e){
      try{ await w.abort(); }catch(_){}
      try{ await dir.removeEntry(leaf); }catch(_){}
      throw new Error('Write failed for "'+U.base(ent.name)+'": '+((e && e.message) || e));
    }
    const sizeBad = bytes !== ent.size;
    const crcBad = ent.crc != null && ent.crc !== 0 && crc !== ent.crc;
    if(sizeBad || crcBad){
      try{ await dir.removeEntry(leaf); }catch(_){}
      throw new Error('Verification failed for "'+U.base(ent.name)+'": '+
        (sizeBad ? U.bytes(bytes)+' written of '+U.bytes(ent.size) : 'checksum mismatch'));
    }
    return bytes;
  },

  /* Pull one entry into memory, for previews and thumbnails */
  async extractEntry(f, ent){
    const head = new DataView(await FS.readRange(f.rootId, f.path, ent.lho, ent.lho + 30));
    if(head.getUint32(0, true) !== 0x04034b50) throw new Error('Damaged entry header');
    const nlen = head.getUint16(26, true), elen = head.getUint16(28, true);
    const start = ent.lho + 30 + nlen + elen;
    const raw = new Uint8Array(await FS.readRange(f.rootId, f.path, start, start + ent.csize));
    if(ent.method === 0) return raw;
    if(ent.method === 8) return await FS.inflateRaw(raw);
    throw new Error('Unsupported compression in "' + U.base(ent.name) + '" (method ' + ent.method + ')');
  },

  async peek(modelId){
    const m = Store.model(modelId); if(!m) return;
    const f = Archive.file(m);
    Toast.show('Reading archive index...');
    try{
      const entries = await Archive.entries(f);
      Archive._cache.set(modelId, entries);
      Toast.ok(entries.length+' entries found');
    }catch(e){
      const bad = []; bad.error = 'Could not read this archive: ' + e.message;
      Archive._cache.set(modelId, bad);
      Toast.err(e.message);
    }
    Detail.open(modelId);
  },

  /* ---- extraction ---- */
  extractPrompt(modelId){
    const m = Store.model(modelId); if(!m) return;
    const f = Archive.file(m); if(!f) return;
    const dest = (U.dir(f.path) ? U.dir(f.path)+'/' : '') + FS.safeName(U.stem(f.name));
    Modal.open('Extract '+f.name+'?',
      '<p style="color:var(--dim);line-height:1.65;margin:0 0 12px">Unpacks the archive into a new folder beside it:</p>'+
      '<div class="mono" style="background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:9px 11px;'+
        'font-size:12px;word-break:break-all;color:var(--acc)">'+U.esc((Store.root(f.rootId)||{}).name+'/'+dest)+'/</div>'+
      '<div class="note" style="margin-top:12px">The archive itself is left alone. Once extracted it shows up under '+
        '<b>Duplicates &rarr; Extracted archives</b>, where you can review and delete the originals in bulk.</div>'+
      '<div class="note bad">Your browser will ask for permission to write to this folder. '+
        'Printery only writes inside the destination above.</div>',
      '<button class="b" onclick="PV.Modal.back()">Cancel</button>'+
      '<button class="b p" onclick="PV.Archive.extract(\''+modelId+'\')">Extract</button>');
  },

  _last:null,
  async extract(modelId){
    Modal.close();
    Archive._last = modelId;
    const m = Store.model(modelId); if(!m) return;
    const f = Archive.file(m); if(!f) return;
    const root = Store.root(f.rootId);
    if(!root) return Toast.err('Folder is not connected, click Scan first');
    if(!(await FS.ensure(root, 'readwrite'))) return Toast.err('Write permission denied');
    Prog.start('Extracting '+f.name+'...');
    const r = await Archive._run(f, root);
    Prog.stop();
    if(!r.ok) Toast.err(r.error);
    else if(r.failed) Archive.report(f.name, r);
    else Toast.ok('Extracted '+r.written+' file'+(r.written===1?'':'s')+', all verified. Rescan to index them.');
    if(!r.failed) Detail.open(modelId);
  },

  /* A partial extraction is worth stopping on, not a line in a toast */
  report(name, r){
    Modal.open('Extraction incomplete: '+name,
      '<div class="note bad"><b>'+r.written+' file'+(r.written===1?'':'s')+' extracted and verified, '+
      r.failed+' failed.</b><br>Failed entries were not left behind as partial files.</div>'+
      '<div style="max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:8px;'+
      'padding:9px 11px;background:var(--bg3)">'+
      r.problems.slice(0,40).map(p=>'<div class="mono" style="font-size:11.5px;padding:3px 0;'+
        'word-break:break-word;color:var(--dim)">'+U.esc(p)+'</div>').join('')+
      (r.problems.length>40 ? '<div style="color:var(--dim2);font-size:12px;padding-top:6px">...and '+
        (r.problems.length-40)+' more</div>' : '')+
      '</div>'+
      '<p style="color:var(--dim);font-size:12.5px;line-height:1.6;margin:12px 0 0">Very large entries can fail '+
      'when the source is on a slow or flaky connection such as a network share. Extracting again only '+
      'rewrites what is missing.</p>',
      '<button class="b" onclick="PV.Modal.close()">Close</button>'+
      '<button class="b p" onclick="PV.Modal.close();PV.Archive.extract(PV.Archive._last)">Try again</button>');
  },

  async _run(f, root){
    let written = 0, failed = 0;
    const problems = [];

    // The desktop shell unpacks in Rust, so entry bytes never cross the bridge
    // and compression methods browsers cannot inflate still work.
    if(FS.extractNatively){
      try{
        const destRel = (U.dir(f.path) ? U.dir(f.path) + '/' : '') + FS.safeName(U.stem(f.name));
        Prog.set('Extracting '+f.name+'...', 0, 1);
        const r = await FS.extractNatively(f.rootId, f.path, destRel);
        return {ok:true, written:r.written, failed:r.failed, problems:r.problems || []};
      }catch(e){
        return {ok:false, error:'Extraction failed: '+((e && e.message) || e), written:0, failed:0, problems:[]};
      }
    }

    try{
      const entries = await Archive.entries(f);
      const destSegs = (U.dir(f.path) ? U.dir(f.path).split('/') : []).concat([FS.safeName(U.stem(f.name))]);
      const destDir = await FS.mkdirp(Store.root(f.rootId).handle, destSegs);
      for(let i = 0; i < entries.length; i++){
        if(Prog.cancelled) break;
        const ent = entries[i];
        Prog.set('Extracting ('+(i+1)+'/'+entries.length+') '+U.base(ent.name), i, entries.length);
        const segs = FS.safeSegs(ent.name);
        if(!segs){ failed++; problems.push(ent.name+' (unsafe path, refused)'); continue; }
        try{
          await Archive.extractTo(f, ent, destDir, segs);
          written++;
        }catch(e){ failed++; problems.push(String((e && e.message) || e)); }
      }
      return {ok:true, written, failed, problems};
    }catch(e){
      return {ok:false, error:'Extraction failed: '+e.message, written, failed, problems};
    }
  },

  bulkPrompt(){
    const list = Store.models.filter(m=>m.isArchive && (m.archiveExt === 'zip' || (m.archiveExt === '7z' && FS.list7z)));
    if(!list.length) return Toast.err('No unextracted archives in the library');
    const bytes = list.reduce((s,m)=>s+(m.bytes||0), 0);
    Modal.open('Extract '+list.length+' archives?',
      '<p style="color:var(--dim);line-height:1.65;margin:0 0 12px">Each archive is unpacked into a new folder '+
        'beside it. Archives themselves are left in place.</p>'+
      '<dl class="kv"><dt>Archives</dt><dd>'+list.length+'</dd>'+
      '<dt>Compressed</dt><dd>'+U.bytes(bytes)+'</dd>'+
      '<dt>On disk after</dt><dd>roughly '+U.bytes(bytes*1.7)+'</dd></dl>'+
      '<div class="note bad" style="margin-top:12px">This writes a lot of files. If the folder is synced by '+
        'OneDrive, Dropbox or similar, all of it will upload. You can cancel partway through.</div>',
      '<button class="b" onclick="PV.Modal.back()">Cancel</button>'+
      '<button class="b p" onclick="PV.Archive.bulk()">Extract all</button>');
  },

  async bulk(){
    Modal.close();
    const list = Store.models.filter(m=>m.isArchive && (m.archiveExt === 'zip' || (m.archiveExt === '7z' && FS.list7z)));
    const roots = U.uniq(list.map(m=>m.rootId));
    for(const rid of roots){
      const root = Store.root(rid);
      if(!root || !root.handle) return Toast.err('Folder is not connected, click Scan first');
      if(!(await FS.ensure(root, 'readwrite'))) return Toast.err('Write permission denied');
    }
    Prog.start('Extracting archives...');
    let done = 0, files = 0, bad = 0;
    for(const m of list){
      if(Prog.cancelled) break;
      const f = Archive.file(m);
      if(!f) continue;
      Prog.set('Archive '+(done+1)+'/'+list.length+': '+f.name, done, list.length);
      const r = await Archive._run(f, Store.root(m.rootId));
      if(r.ok) files += r.written; else bad++;
      done++;
    }
    Prog.stop();
    Toast.ok('Extracted '+files+' files from '+done+' archives'+(bad?', '+bad+' failed':'')+
      '. Run a scan to index them.');
    UI.render();
  },

  /* Hand off to the viewer with every mesh in the archive queued up */
  async preview(modelId, entryName){
    const m = Store.model(modelId); if(!m) return;
    const af = Archive.file(m); if(!af) return;
    let entries = Archive._cache.get(modelId) || (af.zip && af.zip.entries);
    if(!entries){
      Toast.show('Reading archive index...');
      try{ entries = await Archive.entries(af); Archive._cache.set(modelId, entries); }
      catch(e){ return Toast.err(e.message); }
    }
    await Viewer.openArchive(modelId, entryName, entries);
  }
};

/* ============================================================
   Viewer — interactive 3D preview
   ============================================================ */
const Viewer = {
  data:null, az:-52, el:26, zoom:1, drag:null,
  list:[], idx:0, busy:false,

  MESH:['stl','3mf','obj'],
  /* natural order so black2 sorts before black10 */
  _nat(a,b){ return a.localeCompare(b, undefined, {numeric:true, sensitivity:'base'}); },

  /* Open a file, with every other mesh in the same model queued up beside it */
  async open(fileId){
    const f = Store.file(fileId); if(!f) return;
    const sibs = Store.modelFiles(f.modelId)
      .filter(x=>Viewer.MESH.includes(x.ext))
      .sort((a,b)=>Viewer._nat(a.path, b.path));
    const list = sibs.map(x=>({src:'file', fileId:x.id, modelId:x.modelId, name:x.name, path:x.path}));
    const i = Math.max(0, list.findIndex(x=>x.fileId === fileId));
    await Viewer.openList(list.length ? list : [{src:'file', fileId:f.id, modelId:f.modelId, name:f.name, path:f.path}], i);
  },

  /* Open a mesh from inside an archive, with the archive's other meshes queued */
  async openArchive(modelId, entryName, entries){
    const m = Store.model(modelId); if(!m) return;
    const af = Archive.file(m); if(!af) return;
    const meshes = (entries||[]).filter(x=>Viewer.MESH.includes(U.ext(x.name)))
      .sort((a,b)=>Viewer._nat(a.name, b.name));
    const list = meshes.map(x=>({src:'zip', fileId:af.id, modelId, name:U.base(x.name), path:x.name, size:x.size}));
    const i = Math.max(0, list.findIndex(x=>x.path === entryName));
    await Viewer.openList(list.length ? list : [{src:'zip', fileId:af.id, modelId, name:U.base(entryName), path:entryName}], i);
  },

  async openList(list, idx){
    Viewer.list = list; Viewer.idx = idx || 0;
    Modal.open('3D view: '+list[Viewer.idx].name,
      '<div id="vwWrap" style="display:flex;align-items:center;justify-content:center;min-height:380px;background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden">'+
      '<div style="text-align:center;color:var(--dim)"><div class="spin" style="margin:0 auto 10px"></div>Loading mesh...</div></div>'+
      '<div id="vwInfo" style="margin-top:10px;color:var(--dim2);font-size:12px" class="mono"></div>',
      (list.length > 1
        ? '<button class="b" id="vwPrev" onclick="PV.Viewer.step(-1)" title="Previous part (left arrow)">'+I.chevL+'</button>'+
          '<span id="vwPos" class="mono" style="align-self:center;font-size:12px;color:var(--dim);min-width:64px;text-align:center"></span>'+
          '<button class="b" id="vwNext" onclick="PV.Viewer.step(1)" title="Next part (right arrow)">'+
            I.chevL.replace('<svg','<svg style="transform:rotate(180deg)"')+'</button>'
        : '')+
      '<span class="hide-sm" style="color:var(--dim2);font-size:12px;align-self:center;margin-left:6px">Drag to orbit, scroll to zoom</span>'+
      '<div class="sp"></div>'+
      (FS.canSend ? '<button class="b" onclick="PV.Viewer.send()">'+I.print+' Send</button>' : '')+
      '<button class="b" onclick="PV.Viewer.reset()">Reset view</button>'+
      '<button class="b p" onclick="PV.Viewer.useAsCover()">Use as cover</button>', 'wide');
    await Viewer.load();
  },

  step(d){
    if(Viewer.busy || Viewer.list.length < 2) return;
    const n = Viewer.list.length;
    Viewer.idx = (Viewer.idx + d % n + n) % n;
    Viewer.load();
  },

  /* Fetch the raw bytes for a queue item, from disk or from inside a zip */
  async bytesFor(item){
    if(item.src === 'zip'){
      const af = Store.file(item.fileId);
      if(!af) throw new Error('Archive is no longer indexed');
      const entries = Archive._cache.get(item.modelId) || (af.zip && af.zip.entries) || await Archive.entries(af);
      const ent = entries.find(x=>x.name === item.path);
      if(!ent) throw new Error('Entry not found in archive');
      const b = await Archive.extractEntry(af, ent);
      return {buf: b.buffer.slice(b.byteOffset, b.byteOffset + b.byteLength), ext:U.ext(item.path), size:ent.size};
    }
    const f = Store.file(item.fileId);
    if(!f) throw new Error('File is no longer indexed');
    const file = await FS.read(f.rootId, f.path);
    if(file.size > 500e6) throw new Error('File is too large to preview ('+U.bytes(file.size)+')');
    return {buf: await file.arrayBuffer(), ext:f.ext, size:file.size};
  },

  async load(){
    const item = Viewer.list[Viewer.idx];
    if(!item) return;
    Viewer.busy = true;
    Viewer.sync();
    Modal.setTitle('3D view: '+item.name);
    const wrap = document.getElementById('vwWrap');
    if(wrap) wrap.innerHTML = '<div style="text-align:center;color:var(--dim)">'+
      '<div class="spin" style="margin:0 auto 10px"></div>Loading '+U.esc(item.name)+'...</div>';
    try{
      const {buf, ext, size} = await Viewer.bytesFor(item);
      const out = await Work.call({op:'mesh', buf, ext, maxTri:900000, needMesh:true}, [buf]);
      if(!out.pos || !out.pos.length) throw new Error('No mesh geometry found in this file');
      Viewer.data = {pos:out.pos, nrm:out.nrm, bbox:out.bbox, tris:out.tris, col:out.col,
        file:{id:item.fileId, modelId:item.modelId, name:item.name, size:size}};
      Viewer.az=-52; Viewer.el=26; Viewer.zoom=1;
      Viewer.mount();
    }catch(e){
      Viewer.data = null;
      const w = document.getElementById('vwWrap');
      if(w) w.innerHTML = '<div style="text-align:center;color:var(--dim);padding:30px">'+I.warn+
        '<div style="margin-top:10px">'+U.esc(e.message)+'</div></div>';
      const inf = document.getElementById('vwInfo'); if(inf) inf.textContent = '';
    }
    Viewer.busy = false;
    Viewer.sync();
  },

  /* keep the counter and arrows in step with the queue */
  sync(){
    const pos = document.getElementById('vwPos');
    if(pos) pos.textContent = (Viewer.idx+1) + ' / ' + Viewer.list.length;
    ['vwPrev','vwNext'].forEach(id=>{
      const b = document.getElementById(id);
      if(b) b.disabled = Viewer.busy || Viewer.list.length < 2;
    });
  },

  mount(){
    const wrap = document.getElementById('vwWrap'); if(!wrap) return;
    const w = Math.min(820, wrap.clientWidth || 820), h = Math.round(w*0.62);
    wrap.innerHTML = '';
    Viewer.w = w; Viewer.h = h;
    Viewer.paint();
    const cv = Render.canvas();
    cv.style.width = '100%'; cv.style.height = 'auto'; cv.style.display = 'block'; cv.style.cursor = 'grab';
    wrap.appendChild(cv);
    const d = Viewer.data, item = Viewer.list[Viewer.idx];
    document.getElementById('vwInfo').innerHTML =
      d.bbox.size.map(x=>U.num(x,1)).join(' &times; ') + ' mm &nbsp;·&nbsp; ' +
      d.tris.toLocaleString() + ' triangles &nbsp;·&nbsp; ' + U.bytes(d.file.size) +
      (item && item.src === 'zip' ? ' &nbsp;·&nbsp; inside archive' : '') +
      (item && item.path && item.path !== item.name
        ? '<br><span style="opacity:.7">' + U.esc(item.path) + '</span>' : '');

    cv.onpointerdown = e=>{ Viewer.drag = {x:e.clientX, y:e.clientY, az:Viewer.az, el:Viewer.el};
      cv.setPointerCapture(e.pointerId); cv.style.cursor='grabbing'; };
    cv.onpointermove = e=>{
      if(!Viewer.drag) return;
      Viewer.az = Viewer.drag.az - (e.clientX - Viewer.drag.x) * 0.55;
      Viewer.el = U.clamp(Viewer.drag.el + (e.clientY - Viewer.drag.y) * 0.45, -85, 85);
      Viewer.paint();
    };
    cv.onpointerup = cv.onpointercancel = e=>{ Viewer.drag=null; cv.style.cursor='grab'; };
    cv.onwheel = e=>{ e.preventDefault(); Viewer.zoom = U.clamp(Viewer.zoom * (e.deltaY < 0 ? 1.12 : 0.89), 0.25, 12); Viewer.paint(); };
  },
  paint(){
    const d = Viewer.data; if(!d) return;
    const dark = document.documentElement.getAttribute('data-theme') !== 'light';
    Render.draw(d.pos, d.nrm, d.bbox, {size:Viewer.w, height:Viewer.h, az:Viewer.az, el:Viewer.el, zoom:Viewer.zoom,
      bg: dark ? [0.055,0.063,0.078] : [0.94,0.95,0.97]}, d.col);
  },
  reset(){ Viewer.az=-52; Viewer.el=26; Viewer.zoom=1; Viewer.paint(); },
  /* Sends the part on screen rather than whatever the model would have
     picked, since having opened it to look at it is a clear enough signal. */
  send(){
    const d = Viewer.data;
    if(!d || !d.file) return Toast.err('Nothing loaded to send');
    if(!FS.canSend) return Toast.err('Sending needs the desktop app');
    const m = Store.model(d.file.modelId);
    if(!m) return Toast.err('No model for this file');
    Send.open(m.id, d.file.id);
  },

  async useAsCover(){
    const d = Viewer.data; if(!d) return;
    const m = Store.model(d.file.modelId); if(!m) return Toast.err('No model for this file');
    const blob = await Render.toBlob(d.pos, d.nrm, d.bbox, {size:Store.settings.thumbSize, az:Viewer.az, el:Viewer.el, zoom:Viewer.zoom}, d.col);
    if(!blob) return Toast.err('Render failed');
    const id = 'tm'+m.id;
    await Thumbs.put(id, blob);
    Thumbs._urls.delete(id);
    m.thumbId = id; m.thumbSrc = 'user'; m.bbox = d.bbox; m.tris = d.tris;
    await Store.put('models', m);
    Toast.ok('Cover updated from this angle');
    Detail.open(m.id); UI.render();
  }
};

/* ============================================================
   Prints — print history
   ============================================================ */
const RESULTS = [['success','Success','ok'],['partial','Partial / usable','warn'],['fail','Failed','bad']];
const MATERIALS = ['PLA','PLA+','PETG','ABS','ASA','TPU','Nylon','PC','PVA','HIPS','PLA-CF','PETG-CF','PA-CF','Resin'];

const Prints = {
  filter:{printer:'', result:''},
  clearFilters(){
    Prints.filter = {printer:'', result:''};
    if(UI.filter.q){ UI.filter.q = ''; const q = document.getElementById('q'); if(q) q.value = ''; }
    UI.render();
  },

  render(v){
    const s = Store.settings;
    let all = U.sortBy(Store.prints, p=>p.date||'', 'desc');
    const toks = U.tokens(UI.filter.q);
    if(Prints.filter.printer) all = all.filter(p=>p.printer === Prints.filter.printer);
    if(Prints.filter.result) all = all.filter(p=>p.result === Prints.filter.result);
    if(toks.length) all = all.filter(p=>{
      const m = Store.model(p.modelId);
      // A print logged from a job started at the printer has no model, only
      // the name it reported, so searching the model alone found nothing.
      const f = p.filamentId ? Store.filament(p.filamentId) : null;
      return U.match([(m ? m.name : p.modelName || ''), p.jobFile || '', p.printer || '',
        p.material || '', p.notes || '', f ? f.brand+' '+f.material+' '+(f.colorName||'') : ''
      ].join(' '), toks);
    });

    const ok = all.filter(p=>p.result==='success').length;
    const g = all.reduce((s,p)=>s+(p.grams||0), 0);
    const t = all.reduce((s,p)=>s+(p.timeMin||0), 0);
    const c = all.reduce((s,p)=>s+(Prints.cost(p)||0), 0);
    const printers = U.uniq(Store.prints.map(p=>p.printer).filter(Boolean));

    let h = '<div class="pv-bar"><h2>Print History</h2><span class="cnt">'+all.length+' logged</span><div class="sp"></div>'+
      '<select class="b sm" onchange="PV.Prints.setFilter(\'printer\',this.value)"><option value="">All printers</option>'+
        printers.map(p=>'<option'+(Prints.filter.printer===p?' selected':'')+'>'+U.esc(p)+'</option>').join('')+'</select>'+
      '<select class="b sm" onchange="PV.Prints.setFilter(\'result\',this.value)"><option value="">All results</option>'+
        RESULTS.map(r=>'<option value="'+r[0]+'"'+(Prints.filter.result===r[0]?' selected':'')+'>'+r[1]+'</option>').join('')+'</select>'+
      '<button class="b sm p" onclick="PV.Prints.log()">'+I.plus+' Log print</button></div>';

    h += '<div class="stats">'+
      '<div class="stat"><div class="k">Prints</div><div class="v">'+all.length+'</div>'+
        '<div class="sub">'+(all.length?Math.round(ok/all.length*100)+'% success':'no data')+'</div></div>'+
      '<div class="stat"><div class="k">Filament used</div><div class="v">'+U.num(g/1000,2)+'<span style="font-size:13px;color:var(--dim2)"> kg</span></div>'+
        '<div class="sub">'+U.num(g,0)+' g total</div></div>'+
      '<div class="stat"><div class="k">Machine time</div><div class="v">'+U.num(t/60,0)+'<span style="font-size:13px;color:var(--dim2)"> h</span></div>'+
        '<div class="sub">'+U.dur(t)+'</div></div>'+
      '<div class="stat"><div class="k">Est. cost</div><div class="v">'+U.money(c)+'</div>'+
        '<div class="sub">filament + power</div></div>'+
      '</div>';

    if(!all.length && Store.prints.length){
      // hidden rather than absent, which is a very different thing to be told
      const bits = [Prints.filter.printer ? 'printer ' + U.esc(Prints.filter.printer) : null,
        Prints.filter.result ? 'result ' + U.esc(Prints.filter.result) : null,
        toks.length ? 'the search' : null].filter(Boolean);
      h += '<div class="pv-empty">'+I.print+'<h3>Nothing matches</h3>'+
        '<p>You have '+Store.prints.length+' print'+(Store.prints.length===1?'':'s')+' logged, but '+
        (bits.length ? bits.join(' and ') : 'the current filters')+' hides '+
        (Store.prints.length===1?'it':'them all')+'.</p>'+
        '<button class="b p" onclick="PV.Prints.clearFilters()">Clear filters</button></div>';
    } else if(!all.length){
      h += '<div class="pv-empty">'+I.print+'<h3>No prints logged yet</h3>'+
        '<p>Log a print when it finishes and Printery remembers the printer, filament, layer height, and how it turned out. '+
        'Next time you open that model the settings are right there.</p>'+
        '<button class="b p" onclick="PV.Prints.log()">'+I.plus+' Log your first print</button></div>';
      v.innerHTML = h; return;
    }

    h += '<div class="tw"><table class="t"><thead><tr><th>Date</th><th>Model</th><th>Result</th><th>Printer</th><th>Filament</th>'+
      '<th class="num">Layer</th><th class="num">Grams</th><th class="num">Time</th><th class="num">Cost</th><th>Notes</th><th></th></tr></thead><tbody>'+
      all.map(p=>Prints.row(p, false)).join('')+'</tbody></table></div>';
    v.innerHTML = h;
  },

  setFilter(k,val){ Prints.filter[k]=val; UI.render(); },

  cost(p){
    let c = 0;
    const fil = p.filamentId ? Store.filament(p.filamentId) : null;
    const perKg = (p.costPerKg != null ? p.costPerKg : (fil ? fil.costPerKg : null));
    if(p.grams && perKg) c += p.grams/1000 * perKg;
    if(p.timeMin && Store.settings.costPerHour) c += p.timeMin/60 * Store.settings.costPerHour;
    return c || null;
  },

  row(p, compact){
    const m = Store.model(p.modelId);
    const r = RESULTS.find(x=>x[0]===p.result) || RESULTS[0];
    const fil = p.filamentId ? Store.filament(p.filamentId) : null;
    const filName = fil ? (fil.brand+' '+fil.material+(fil.colorName?' '+fil.colorName:'')) : (p.filamentName || p.material || '');
    const sw = fil && fil.colorHex ? '<span class="sw" style="width:12px;height:12px;border-radius:3px;display:inline-block;vertical-align:-1px;background:'+U.attr(fil.colorHex)+'"></span> ' : '';
    return '<tr>'+
      '<td class="mono" style="white-space:nowrap;font-size:12px">'+U.date(p.date)+'</td>'+
      (compact ? '' : '<td>'+(m ? '<a href="#" onclick="event.preventDefault();PV.Modal.close();PV.Detail.open(\''+p.modelId+'\')">'+U.esc(m.name)+'</a>'
                              : '<span style="color:var(--dim2)">'+U.esc(p.modelName||'(removed)')+'</span>')+'</td>')+
      '<td><span class="bdg '+r[2]+'">'+r[1].split(' ')[0]+'</span></td>'+
      '<td style="font-size:12.5px">'+U.esc(p.printer||'—')+'</td>'+
      '<td style="font-size:12.5px;white-space:nowrap">'+sw+U.esc(filName||'—')+'</td>'+
      '<td class="num">'+(p.layerH?p.layerH:'—')+'</td>'+
      '<td class="num">'+(p.grams?U.num(p.grams,0):'—')+'</td>'+
      '<td class="num">'+(p.timeMin?U.dur(p.timeMin):'—')+'</td>'+
      (compact ? '' : '<td class="num">'+U.money(Prints.cost(p))+'</td>')+
      '<td style="font-size:12px;color:var(--dim);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+U.attr(p.notes||'')+'">'+U.esc(p.notes||'')+'</td>'+
      '<td style="white-space:nowrap"><button class="b g sm ico" onclick="PV.Prints.log(null,\''+p.id+'\')" title="Edit">'+I.edit+'</button>'+
        '<button class="b g sm ico" onclick="PV.Prints.del(\''+p.id+'\')" title="Delete">'+I.trash+'</button></td>'+
    '</tr>';
  },

  log(modelId, printId){
    const p = printId ? Store.prints.find(x=>x.id===printId) : null;
    const m = Store.model(p ? p.modelId : modelId);
    const est = (m && m.est) || {};
    const models = U.sortBy(Store.models, x=>x.name.toLowerCase(), 'asc');
    const modelOpts = models.length > 4000
      // too many to list, so offer the one already set plus the way out
      ? '<option value="">(not in library)</option>'+
        (m ? '<option value="'+U.attr(m.id)+'" selected>'+U.esc(m.name)+'</option>' : '')
      : '<option value="">(not in library)</option>'+models.map(x=>
          '<option value="'+U.attr(x.id)+'"'+((p?p.modelId:modelId)===x.id?' selected':'')+'>'+U.esc(x.name)+'</option>').join('');

    Modal.open(p ? 'Edit print' : 'Log a print',
      '<div class="f"><label>Model</label><select id="pModel">'+modelOpts+'</select></div>'+
      '<div class="fr3">'+
        '<div class="f"><label>Date</label><input type="date" id="pDate" value="'+U.attr(p?p.date:U.today())+'"></div>'+
        '<div class="f"><label>Result</label><select id="pResult">'+
          RESULTS.map(r=>'<option value="'+r[0]+'"'+((p?p.result:'success')===r[0]?' selected':'')+'>'+r[1]+'</option>').join('')+'</select></div>'+
        '<div class="f"><label>Printer</label><input id="pPrinter" list="prnList" value="'+U.attr(p?p.printer:(Store.settings.defaultPrinter||est.printer||''))+'">'+
          '<datalist id="prnList">'+U.uniq(Store.printers.map(x=>x.name).concat(Store.prints.map(x=>x.printer)).filter(Boolean))
            .map(n=>'<option value="'+U.attr(n)+'">').join('')+'</datalist></div>'+
      '</div>'+
      '<div class="f"><label>Filament spool</label><select id="pFil" onchange="PV.Prints.onFil()">'+
        '<option value="">(not tracked)</option>'+
        Store.filaments.filter(f=>!f.archived).map(f=>'<option value="'+U.attr(f.id)+'"'+((p&&p.filamentId)===f.id?' selected':'')+'>'+
          U.esc(f.brand+' '+f.material+(f.colorName?' — '+f.colorName:'')+'  ('+U.num(f.remainingG,0)+'g left)')+'</option>').join('')+
        '</select></div>'+
      '<div class="fr3">'+
        '<div class="f"><label>Material</label><input id="pMaterial" list="matList" value="'+U.attr(p?p.material:(est.material||''))+'">'+
          '<datalist id="matList">'+MATERIALS.map(x=>'<option value="'+x+'">').join('')+'</datalist></div>'+
        '<div class="f"><label>Layer height (mm)</label><input type="number" step="0.01" id="pLayer" value="'+U.attr(p?p.layerH:(est.layerH||''))+'"></div>'+
        '<div class="f"><label>Nozzle (mm)</label><input type="number" step="0.05" id="pNozzle" value="'+U.attr(p?p.nozzle:(est.nozzle||''))+'"></div>'+
      '</div>'+
      '<div class="fr3">'+
        '<div class="f"><label>Filament used (g)</label><input type="number" step="0.1" id="pGrams" value="'+U.attr(p?p.grams:(est.grams?Math.round(est.grams*10)/10:''))+'"></div>'+
        '<div class="f"><label>Print time (minutes)</label><input type="number" step="1" id="pTime" value="'+U.attr(p?p.timeMin:(est.timeMin?Math.round(est.timeMin):''))+'"></div>'+
        '<div class="f"><label>Infill %</label><input type="number" step="1" id="pInfill" value="'+U.attr(p?p.infill:(est.infill||''))+'"></div>'+
      '</div>'+
      '<div class="f"><label>Notes</label><textarea id="pNotes" placeholder="Warped at the corners, next time raise bed temp to 65 and add a brim.">'+U.esc(p?p.notes||'':'')+'</textarea></div>'+
      (p ? '' : '<div class="note">Grams logged against a tracked spool are subtracted from what is left on it.</div>'),
      (p ? '<button class="b d" onclick="PV.Prints.del(\''+p.id+'\')">'+I.trash+' Delete</button>' : '')+

  async save(printId){
    const old = printId ? Store.prints.find(x=>x.id===printId) : null;
    const modelId = Modal.val('pModel');
    const m = Store.model(modelId);
    const p = Object.assign({id: printId || U.id('p'), createdAt: old?old.createdAt:Date.now()}, old || {}, {
      modelId, modelName: m ? m.name : (old ? old.modelName : ''),
      date: Modal.val('pDate') || U.today(),
      result: Modal.val('pResult'),
      printer: Modal.val('pPrinter').trim(),
      filamentId: Modal.val('pFil'),

      layerH: Modal.num('pLayer'),
      nozzle: Modal.num('pNozzle'),
      grams: Modal.num('pGrams'),
      timeMin: Modal.num('pTime'),
      infill: Modal.num('pInfill'),
      notes: Modal.val('pNotes')
    });
    // adjust spool balances
    if(old && old.filamentId){ const f = Store.filament(old.filamentId);
      if(f){ f.remainingG = (f.remainingG||0) + (old.grams||0); await Store.put('filaments', f); } }
    if(p.filamentId){ const f = Store.filament(p.filamentId);
      if(f){ f.remainingG = Math.max(0, (f.remainingG||0) - (p.grams||0)); await Store.put('filaments', f); } }
    await Store.put('prints', p);
    Modal.close();
    if(Detail.cur === modelId) Detail.open(modelId); else UI.render();
    Toast.ok(printId ? 'Print updated' : 'Print logged');
  },

  del(id){
    const p = Store.prints.find(x=>x.id===id); if(!p) return;
    Modal.confirm('Delete this print log?', 'The entry from '+U.date(p.date)+' will be removed. Filament used will be credited back to the spool.', async ()=>{
      if(p.filamentId){ const f = Store.filament(p.filamentId);
        if(f){ f.remainingG = (f.remainingG||0) + (p.grams||0); await Store.put('filaments', f); } }
      await Store.remove('prints', id);
      Modal.close();
      if(Detail.cur === p.modelId) Detail.open(p.modelId); else UI.render();
      Toast.ok('Print log deleted');
    }, 'Delete', true);
  }
};

/* ============================================================
   AutoBackup — a copy of what you typed, without being asked

   Model files are safe on disk whatever happens. Tags, notes, ratings and
   print history live only in the local database, and that has been lost
   before. This writes the same JSON the Export button produces into the
   library folder itself, so a backup is sitting next to the thing it
   describes rather than in a Downloads folder nobody remembers.
   ============================================================ */
const AutoBackup = {
  DIR: '_PrintVault_backups',
  KEEP: 5,
  EVERY: {off:0, daily:864e5, weekly:6048e5},

  /* Cheap stand-in for "has anything changed": if this matches the last
     backup, writing another copy of the same thing is just noise. */
  signature(){
    const n = a => a.length;
    const touched = Store.models.reduce((t,m)=>Math.max(t, m.updatedAt||0), 0);
    return [n(Store.models), n(Store.prints), n(Store.filaments), n(Store.printers),
            n(Store.queue), n(Store.parked), touched].join('|');
  },

  due(){
    const s = Store.settings;
    const every = AutoBackup.EVERY[s.autoBackup || 'weekly'] || 0;
    if(!every) return false;
    if(!Store.roots.length) return false;                     // nowhere to put it
    if(AutoBackup.signature() === s.autoBackupSig) return false;
    return Date.now() - (s.autoBackupAt || 0) >= every;
  },

  async run(force){
    if(!force && !AutoBackup.due()) return null;
    const root = Store.roots[0];
    if(!root) return null;
    if(!FS.writeFile) return null;                            // browser too old
    const name = 'printvault-backup-' + U.today() + '.json';
    const path = AutoBackup.DIR + '/' + name;
    try{
      const blob = new Blob([JSON.stringify(Settings.backupData(), null, 2)], {type:'application/json'});
      await FS.writeFile(root.id, path, blob);
      const kept = (Store.settings.autoBackups || []).filter(x=>x.name !== name)
        .concat([{name, at: Date.now(), rootId: root.id, bytes: blob.size}]);
      // oldest first, so the tail is what we drop
      kept.sort((a,b)=>a.at - b.at);
      while(kept.length > AutoBackup.KEEP){
        const old = kept.shift();
        try{ await FS.deleteFile(old.rootId || root.id, AutoBackup.DIR + '/' + old.name); }catch(e){}
      }
      Store.settings.autoBackups = kept;
      Store.settings.autoBackupAt = Date.now();
      Store.settings.autoBackupSig = AutoBackup.signature();
      await Store.saveSettings();
      console.info('[Printery] backup written to ' + root.name + '/' + path);
      return path;
    }catch(e){
      // a read-only or disconnected folder is not worth interrupting anyone over
      console.warn('[Printery] automatic backup failed:', e && e.message || e);
      return null;
    }
  }
};

/* ============================================================
   TagBox — chips with autocomplete, for tags and collections

   A comma separated field with a datalist looks like autocomplete but is not:
   the browser matches the whole field, so once you have typed one tag it
   stops suggesting anything. This keeps the same hidden field so saving is
   unchanged, and puts a proper editor on top of it.
   ============================================================ */
const TagBox = {
  _n: 0,
  /* `all` is [[name,count],...] as returned by Store.allTags/allCollections */
  html(id, values, all, placeholder){
    const uid = 'tb' + (++TagBox._n);
    TagBox['_d' + uid] = all.map(a => a[0]);
    return '<div class="tagbox" id="' + uid + '" data-for="' + id + '">' +
      '<div class="chips"></div>' +
      '<input class="tbi" type="text" autocomplete="off" spellcheck="false" placeholder="' + U.attr(placeholder || 'Type to add') + '">' +
      '<div class="tbdrop"></div>' +
      '<input type="hidden" id="' + id + '" value="' + U.attr((values || []).join(', ')) + '">' +
      '</div>';
  },

  /* Call once the markup is in the DOM. */
  wire(root){
    (root || document).querySelectorAll('.tagbox:not([data-live])').forEach(box=>{
      box.setAttribute('data-live', '1');
      const hidden = box.querySelector('input[type=hidden]');
      const input = box.querySelector('.tbi');
      const chips = box.querySelector('.chips');
      const drop = box.querySelector('.tbdrop');
      const known = TagBox['_d' + box.id] || [];
      let list = (hidden.value || '').split(',').map(s=>s.trim()).filter(Boolean);
      let sel = -1;

      const sync = ()=>{
        hidden.value = list.join(', ');
        chips.innerHTML = list.map((t,i)=>'<span class="chip">' + U.esc(t) +
          '<button type="button" data-i="' + i + '" aria-label="Remove ' + U.attr(t) + '">&times;</button></span>').join('');
      };
      const close = ()=>{ drop.innerHTML = ''; drop.classList.remove('on'); sel = -1; };
      const add = t=>{
        t = String(t || '').trim().replace(/,+$/, '');
        if(t && !list.some(x=>x.toLowerCase() === t.toLowerCase())) list.push(t);
        input.value = ''; sync(); close(); input.focus();
      };
      const open = ()=>{
        const q = input.value.trim().toLowerCase();
        const taken = new Set(list.map(x=>x.toLowerCase()));
        const hits = known.filter(t=>!taken.has(t.toLowerCase()) && (!q || t.toLowerCase().includes(q)))
          .sort((a,b)=>{
            // things that start with what you typed come first
            const as = a.toLowerCase().startsWith(q) ? 0 : 1, bs = b.toLowerCase().startsWith(q) ? 0 : 1;
            return as - bs || a.localeCompare(b);
          }).slice(0, 8);
        if(!hits.length) return close();
        drop.innerHTML = hits.map((t,i)=>'<button type="button" data-t="' + U.attr(t) + '"' +
          (i === sel ? ' class="on"' : '') + '>' + U.esc(t) + '</button>').join('');
        drop.classList.add('on');
      };

      chips.addEventListener('click', e=>{
        const b = e.target.closest('button[data-i]'); if(!b) return;
        list.splice(+b.dataset.i, 1); sync();
      });
      drop.addEventListener('mousedown', e=>{           // before blur closes it
        const b = e.target.closest('button[data-t]'); if(!b) return;
        e.preventDefault(); add(b.dataset.t);
      });
      input.addEventListener('input', ()=>{ sel = -1; open(); });
      input.addEventListener('focus', open);
      input.addEventListener('blur', ()=>setTimeout(close, 120));
      input.addEventListener('keydown', e=>{
        const opts = Array.from(drop.querySelectorAll('button'));
        if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
          if(!opts.length) return;
          e.preventDefault();
          sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + opts.length) % opts.length;
          opts.forEach((o,i)=>o.classList.toggle('on', i === sel));
          return;
        }
        if(e.key === 'Enter' || e.key === ','){
          e.preventDefault();
          add(sel >= 0 && opts[sel] ? opts[sel].dataset.t : input.value);
          return;
        }
        if(e.key === 'Escape' && drop.classList.contains('on')){ e.preventDefault(); close(); return; }
        // backspace on an empty box takes the last chip off
        if(e.key === 'Backspace' && !input.value && list.length){ list.pop(); sync(); }
      });
      // typing a name and pressing Save should not lose it
      const form = box.closest('#modal') || document;
      form.addEventListener('click', e=>{
        if(e.target.closest('button.p') && input.value.trim()) add(input.value);
      }, true);
      sync();
    });
  }
};

   Send — hand a file to a slicer, or upload it to a printer

   Desktop only. A browser page cannot launch a program, and it cannot POST
   to an unencrypted box on your network either.
