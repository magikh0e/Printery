  setMode(m){ Dupes.mode = m; UI.render(); },

  async hash(){
    if(!FS.supported) return Scan.unsupported();
    const n = await Scan.hashAll(false);
    await DB.putMany('files', Store.files.filter(f=>f.sha));
    Toast.ok('Hashed '+n+' files');
    UI.render();
  },

  selectAll(){
    const groups = Dupes.mode === 'similar' ? Dupes.nameGroups() : Dupes.groups();
    if(!groups.length) return Toast.err('Nothing to select in this view');
    Dupes.selectAllExtras(groups);
    Toast.ok('Selected '+Dupes.sel.size+' extra copies, keeping one of each');
  },

  /* One review screen for everything selected, whatever the action */
  reviewSelected(){
    const files = Dupes.selectedFiles();
    if(!files.length) return Toast.err('Nothing selected');
    const quarantine = Store.settings.dupeAction !== 'delete';
    const total = files.reduce((s,f)=>s+(f.size||0), 0);
    const qdir = Store.settings.quarantineDir || '_PrintVault_quarantine';
    const byRoot = {};
    files.forEach(f=>{ const n = (Store.root(f.rootId)||{}).name||'?'; byRoot[n]=(byRoot[n]||0)+1; });

    Modal.open((quarantine?'Quarantine ':'Delete ')+files.length+' file'+(files.length===1?'':'s')+'?',
      (quarantine
        ? '<div class="note"><b>Nothing is destroyed.</b> Each file moves into <code>'+U.esc(qdir)+
          '/</code> inside its own folder, keeping its original path so you can see where it came from and drag it '+
          'back if you change your mind. That folder is skipped by future scans.</div>'
        : '<div class="note bad"><b>This permanently deletes files from your disk.</b> They do not go to the '+
          'Recycle Bin and cannot be undone from here. Switch to quarantine in Settings if you want a way back.</div>')+
      '<dl class="kv" style="margin-bottom:12px"><dt>Files</dt><dd>'+files.length+'</dd>'+
      '<dt>Space</dt><dd>'+U.bytes(total)+'</dd>'+
      '<dt>Folders</dt><dd>'+U.esc(Object.keys(byRoot).map(k=>k+' ('+byRoot[k]+')').join(', '))+'</dd></dl>'+
      '<div style="max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg3)">'+
      files.slice(0,300).map(f=>'<div class="mono" style="font-size:11.5px;padding:3px 0;word-break:break-all;color:var(--dim)">'+
        U.esc((Store.root(f.rootId)||{}).name+'/'+f.path)+'</div>').join('')+
      (files.length>300 ? '<div style="color:var(--dim2);font-size:12px;padding-top:6px">...and '+(files.length-300)+' more</div>' : '')+
      '</div>',
      '<button class="b" onclick="PV.Modal.back()">Cancel</button>'+
      '<button class="b '+(quarantine?'p':'d')+'" id="dupGo">'+
        (quarantine ? I.folder+' Move '+files.length+' to quarantine' : I.trash+' Delete permanently')+'</button>', 'wide');
    document.getElementById('dupGo').onclick = ()=>Dupes._run(files, quarantine);
  },

  del(id){ Dupes.delMany([id]); },
  delMany(ids){
    const files = ids.map(i=>Store.file(i)).filter(Boolean);
    if(!files.length) return;
    const total = files.reduce((s,f)=>s+(f.size||0), 0);
    Modal.open('Delete '+files.length+' file'+(files.length===1?'':'s')+'?',
      '<div class="note bad"><b>This permanently deletes files from your disk.</b> They do not go to the Recycle Bin and cannot be undone from here.</div>'+
      '<div style="max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg3)">'+
      files.slice(0,200).map(f=>'<div class="mono" style="font-size:11.5px;padding:3px 0;word-break:break-all;color:var(--dim)">'+
        U.esc((Store.root(f.rootId)||{}).name+'/'+f.path)+'</div>').join('')+
      (files.length>200 ? '<div style="color:var(--dim2);font-size:12px;padding-top:6px">...and '+(files.length-200)+' more</div>' : '')+
      '</div><p style="color:var(--dim);font-size:12.5px;margin:12px 0 0">Frees about <b>'+U.bytes(total)+'</b>.</p>',
      '<button class="b" onclick="PV.Modal.back()">Cancel</button>'+
      '<button class="b d" id="dYes">'+I.trash+' Delete permanently</button>');
    /* Past a handful of files this stops being a click you can take back by
       noticing quickly, so make it a sentence you have to mean. */
    document.getElementById('dYes').onclick = ()=>{
      if(files.length < Dupes.TYPED_AT) return Dupes._run(files);
      Modal.confirmTyped('Delete '+files.length+' files?',
        'This removes <b>'+files.length+' files</b> and about <b>'+U.bytes(total)+'</b> from disk. '+
        'They do not go to the Recycle Bin and Printery cannot bring them back.',
        'DELETE', ()=>Dupes._run(files), I.trash+' Delete permanently');
    };
  },

  // above this many files, a permanent delete asks you to type it out
  TYPED_AT: 10,
  async _run(files, quarantine){
    Modal.close();
    const qdir = Store.settings.quarantineDir || '_PrintVault_quarantine';
    Prog.start(quarantine ? 'Moving to quarantine...' : 'Deleting files...');
    let ok = 0, fail = 0;
    const gone = [];
    for(let i=0;i<files.length;i++){
      if(Prog.cancelled) break;
      const f = files[i];
      Prog.set((quarantine?'Moving':'Deleting')+' ('+(i+1)+'/'+files.length+') '+f.name, i, files.length);
      try{
        if(quarantine) await FS.moveToQuarantine(f.rootId, f.path, qdir);
        else await FS.deleteFile(f.rootId, f.path);
        gone.push(f.id); ok++;
      }
      catch(e){ fail++; if(fail === 1) Toast.err((quarantine?'Move':'Delete')+' failed: '+e.message); }
    }
    if(gone.length){
      await DB.delMany('files', gone);
      const goneSet = new Set(gone);
      const touched = new Set(Store.files.filter(f=>goneSet.has(f.id)).map(f=>f.modelId));
      Store.files = Store.files.filter(f=>!goneSet.has(f.id));
      Store.reindex();
      const upd = [];
      touched.forEach(mid=>{
        const m = Store.model(mid); if(!m) return;
        const list = Store.modelFiles(mid);
        m.fileCount = list.length; m.bytes = list.reduce((s,f)=>s+(f.size||0),0);
        upd.push(m);
      });
      if(upd.length) await DB.putMany('models', upd);
    }
    Dupes.sel.clear();
    Prog.stop();
    UI.render();
    Toast.ok((quarantine ? 'Moved '+ok+' file'+(ok===1?'':'s')+' to '+qdir
                         : 'Deleted '+ok+' file'+(ok===1?'':'s'))+(fail?', '+fail+' failed':''));
  }
};

/* ============================================================
   Stats
   ============================================================ */
const Stats = {
  render(v){
    const M = Store.models, P = Store.prints;
    const bytes = M.reduce((s,m)=>s+(m.bytes||0), 0);
    const printed = new Set(P.map(p=>p.modelId));
    const g = P.reduce((s,p)=>s+(p.grams||0), 0);
    const t = P.reduce((s,p)=>s+(p.timeMin||0), 0);
    const cost = P.reduce((s,p)=>s+(Prints.cost(p)||0), 0);
    const ok = P.filter(p=>p.result==='success').length;

    let h = '<div class="pv-bar"><h2>Statistics</h2><div class="sp"></div>'+
      '<button class="b sm" onclick="PV.Settings.exportCSV()">'+I.dl+' Export prints CSV</button></div>';

    h += '<div class="stats">'+
      '<div class="stat"><div class="k">Models</div><div class="v">'+M.length.toLocaleString()+'</div>'+
        '<div class="sub">'+printed.size+' printed ('+(M.length?Math.round(printed.size/M.length*100):0)+'%)</div></div>'+
      '<div class="stat"><div class="k">Files indexed</div><div class="v">'+Store.files.length.toLocaleString()+'</div>'+
        '<div class="sub">'+U.bytes(bytes)+' on disk</div></div>'+
      '<div class="stat"><div class="k">Prints logged</div><div class="v">'+P.length+'</div>'+
        '<div class="sub">'+(P.length?Math.round(ok/P.length*100)+'% success':'no data')+'</div></div>'+
      '<div class="stat"><div class="k">Filament used</div><div class="v">'+U.num(g/1000,2)+'<span style="font-size:13px;color:var(--dim2)"> kg</span></div>'+
        '<div class="sub">'+U.money(cost)+' est. cost</div></div>'+
      '<div class="stat"><div class="k">Machine hours</div><div class="v">'+U.num(t/60,0)+'</div><div class="sub">'+U.dur(t)+'</div></div>'+
      '</div>';

    /* prints per month */
    const months = [];
    const now = new Date();
    for(let i=11;i>=0;i--){
      const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      months.push({k: d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),
                   label: d.toLocaleDateString(undefined,{month:'short'}), n:0, g:0});
    }
    const mm = new Map(months.map(m=>[m.k,m]));
    P.forEach(p=>{ const k=(p.date||'').slice(0,7); const m=mm.get(k); if(m){ m.n++; m.g += p.grams||0; } });
    const max = Math.max(1, ...months.map(m=>m.n));
    h += '<div class="panel"><h3>'+I.chart+' Prints per month</h3>'+
      '<div style="display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:6px">'+
      months.map(m=>'<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end" title="'+
        m.n+' prints, '+U.num(m.g,0)+'g">'+
        '<span class="mono" style="font-size:10.5px;color:var(--dim2)">'+(m.n||'')+'</span>'+
        '<div style="width:100%;background:'+(m.n?'var(--acc)':'var(--bg4)')+';height:'+Math.max(2, m.n/max*88)+'px;border-radius:4px 4px 0 0"></div>'+
        '<span style="font-size:10.5px;color:var(--dim2)">'+m.label+'</span></div>').join('')+
      '</div></div>';

    /* top lists */
    const cnt = new Map();
    P.forEach(p=>{
      // a job started at the printer itself has no model, only a filename
      const k = p.modelId || ('name:' + (p.modelName || '?'));
      cnt.set(k, (cnt.get(k)||0)+1);
    });
    const top = Array.from(cnt.entries()).sort((a,b)=>b[1]-a[1]).slice(0,8);
    const big = U.sortBy(M, m=>m.bytes||0, 'desc').slice(0,8);
    const byPrinter = new Map();
    P.forEach(p=>{ const k=p.printer||'(unspecified)';
      if(!byPrinter.has(k)) byPrinter.set(k,{n:0,ok:0,t:0});
      const x=byPrinter.get(k); x.n++; if(p.result==='success') x.ok++; x.t += p.timeMin||0; });

    /* The slicer's estimate is stored with each model and the printer reports
       what actually happened, so the two can finally be compared. Only counts
       prints that were logged automatically and linked to a model, since a
       figure typed by hand proves nothing about the slicer. */
    const pairs = P.filter(p=>p.auto && p.modelId && p.timeMin)
      .map(p=>{ const m = Store.model(p.modelId); const e = m && m.est;
        return e && e.timeMin ? {est:e.timeMin, act:p.timeMin, name:m.name} : null; })
      .filter(Boolean);
    if(pairs.length >= 3){
      const ratio = pairs.reduce((s,x)=>s + x.act / x.est, 0) / pairs.length;
      const off = Math.round((ratio - 1) * 100);
      const worst = pairs.slice().sort((a,b)=>Math.abs(b.act/b.est - 1) - Math.abs(a.act/a.est - 1))[0];
      h += '<div class="panel" style="margin-bottom:14px"><h3>'+I.clock+' Slicer estimate against reality</h3>'+
        '<p style="color:var(--dim);font-size:12.5px;line-height:1.65;margin:0 0 10px">Across '+pairs.length+
        ' automatically logged print'+(pairs.length===1?'':'s')+' that matched a model.</p>'+
        '<div class="stats" style="margin:0"><div class="stat"><div class="k">Prints run</div><div class="v">'+
        (off === 0 ? 'on time' : (off > 0 ? off+'%' : Math.abs(off)+'%'))+'</div><div class="sub">'+
        (off === 0 ? 'estimates are holding up' : (off > 0 ? 'longer than the slicer says' : 'quicker than the slicer says'))+
        '</div></div>'+
        '<div class="stat"><div class="k">Furthest out</div><div class="v" style="font-size:17px">'+U.esc(worst.name)+
        '</div><div class="sub">'+U.dur(worst.est)+' estimated, '+U.dur(worst.act)+' actual</div></div></div></div>';
    }

    h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px">';
    h += '<div class="panel"><h3>'+I.print+' Most printed</h3>'+
      (top.length ? '<table class="t"><tbody>'+top.map(([id,n])=>{
        const m = id.indexOf('name:')===0 ? null : Store.model(id);
        const label = id.indexOf('name:')===0 ? '<span style="color:var(--dim2)">'+U.esc(id.slice(5))+'</span>'
          : (m ? '<a href="#" onclick="event.preventDefault();PV.Detail.open(\''+id+'\')">'+U.esc(m.name)+'</a>'
             : '<span style="color:var(--dim2)">(removed)</span>');
        return '<tr><td>'+label+
          '</td><td class="num">'+n+'&times;</td></tr>';
      }).join('')+'</tbody></table>' : '<div style="color:var(--dim2);font-size:12.5px">No prints logged yet.</div>')+'</div>';

    h += '<div class="panel"><h3>'+I.gear+' By printer</h3>'+
      (byPrinter.size ? '<table class="t"><thead><tr><th>Printer</th><th class="num">Prints</th><th class="num">Success</th><th class="num">Hours</th></tr></thead><tbody>'+
        Array.from(byPrinter.entries()).sort((a,b)=>b[1].n-a[1].n).map(([k,x])=>
          '<tr><td>'+U.esc(k)+'</td><td class="num">'+x.n+'</td><td class="num">'+Math.round(x.ok/x.n*100)+'%</td><td class="num">'+U.num(x.t/60,0)+'</td></tr>').join('')+
        '</tbody></table>' : '<div style="color:var(--dim2);font-size:12.5px">No prints logged yet.</div>')+'</div>';

    h += '<div class="panel"><h3>'+I.cube+' Largest models</h3><table class="t"><tbody>'+
      big.map(m=>'<tr><td><a href="#" onclick="event.preventDefault();PV.Detail.open(\''+m.id+'\')">'+U.esc(m.name)+'</a></td>'+
        '<td class="num">'+U.bytes(m.bytes)+'</td></tr>').join('')+'</tbody></table></div>';

    const tags = Store.allTags().slice(0,14);
    h += '<div class="panel"><h3>'+I.tag+' Top tags</h3>'+
      (tags.length ? '<div class="pv-tags">'+tags.map(([t,n])=>
        '<span class="tg a" style="cursor:pointer;padding:5px 9px" onclick="PV.UI.go(\'library\');PV.Library.filter(\'tag\','+JSON.stringify(t).replace(/"/g,'&quot;')+')">'+
        U.esc(t)+' <b>'+n+'</b></span>').join('')+'</div>'
       : '<div style="color:var(--dim2);font-size:12.5px">Nothing tagged yet. Select models in the library with Ctrl+click to tag in bulk.</div>')+'</div>';

    h += '<div class="panel"><h3>'+I.folder+' Storage by folder</h3><table class="t"><tbody>'+
      U.sortBy(Store.roots, r=>r.bytes||0, 'desc').map(r=>
        '<tr><td>'+U.esc(r.name)+'</td><td class="num">'+(r.models||0)+' models</td><td class="num">'+U.bytes(r.bytes)+'</td></tr>').join('')+
      '</tbody></table></div>';
    h += '</div>';
    v.innerHTML = h;
  }
};

  async savePrinter(id){
    const p = Object.assign({id: id||U.id('pr')}, (id?Store.printer(id):null)||{}, {
      name: Modal.val('prName').trim() || 'Printer', model: Modal.val('prModel').trim(),
      bedX: Modal.num('prX'), bedY: Modal.num('prY'), bedZ: Modal.num('prZ'),
      nozzle: Modal.num('prN'), notes: Modal.val('prNotes'),
      addr: Modal.val('prAddr').trim(), apiKey: Modal.val('prKey').trim(),
      flavour: Settings._flavour || (id && Store.printer(id) ? Store.printer(id).flavour : '') || 'moonraker'

  async testPrinter(){
    const el = document.getElementById('prTest');
    const addr = Modal.val('prAddr').trim();
    if(!addr){ if(el) el.textContent = 'Enter an address first'; return; }
    if(!FS.probePrinter){ if(el) el.textContent = 'Desktop app only'; return; }
    if(el) el.textContent = 'Checking...';
    try{
      const info = await FS.probePrinter(addr, Modal.val('prKey').trim());
      Settings._flavour = info.flavour;
      if(el){ el.style.color = 'var(--ok, var(--acc))';
        el.textContent = info.flavour + ' · ' + info.name + ' · ' + info.state; }
    }catch(e){
      if(el){ el.style.color = 'var(--bad)'; el.textContent = (e.message || e); }
    }
  },

  /* Always answers. The startup check says nothing whether it succeeded, found
     nothing, or failed outright, which made a broken updater look exactly like
     an up to date one. */
  async checkUpdate(){
    const btn = document.getElementById('btnUpd'), msg = document.getElementById('updMsg');
    if(!btn) return;
    btn.disabled = true;
    if(msg){ msg.style.color = 'var(--dim2)'; msg.textContent = 'Asking GitHub...'; }
    try{
      const found = await FS._call('pv_check_update');
      if(msg){
        if(found){ msg.style.color = 'var(--ok)'; msg.textContent = found + ' is available.'; }
        else { msg.textContent = 'You have the newest version.'; }
      }
    }catch(e){
      // The whole point: say what went wrong rather than looking identical to
      // having nothing to do.
      const t = String(e && e.message || e);
      if(msg){ msg.style.color = 'var(--bad)'; msg.textContent = t; }
      Toast.err('Update check failed: '+t);
    }finally{ btn.disabled = false; }
  },

  async pickSlicer(){
    if(!FS.pickExe) return Toast.err('Desktop app only');
    const p = await FS.pickExe();
    if(!p) return;
    const list = (Store.settings.slicers || []).slice();
    if(list.some(sl=>sl.path === p)) return Toast.err('That one is already in the list');
    const name = U.stem(U.osBase(p));
    list.push({id: U.id('sl'), name, path: p});
    await Store.setting('slicers', list);
    // Keep the old single setting pointing at the first one, so an older build
    // opening this index still has something to open files with.
    await Store.setting('slicerPath', list[0].path);
    UI.render();
    Toast.ok('Added '+name);
  },

    Modal.open('Rename slicer',

    const v = String(Modal.val('slName')||'').trim();

  async removeSlicer(id){
    const list = (Store.settings.slicers || []).filter(x=>x.id !== id);
    await Store.setting('slicers', list);
    await Store.setting('slicerPath', list.length ? list[0].path : '');

  async unexclude(i){
    const e = (Settings._excl||[])[i]; if(!e) return;
    const r = Store.root(e.r.id); if(!r) return;
    r.excludes = (r.excludes||[]).filter(x=>x !== e.x);
    await Store.put('roots', r);
    UI.render();
    Toast.ok('Will be indexed again on the next scan');
  },

    Modal.confirm('Delete printer?', 'Print logs keep the printer name as text.', async ()=>{
      await Store.remove('printers', id); Modal.close(); UI.render();
    }, 'Delete', true);

  /* Two things count as missing: no preview at all, and a preview id pointing
     at an image that is no longer there. The second kind shows as an empty
     card while still claiming to have a preview, so it never got rebuilt. */
  async regenAll(){
    Prog.start('Checking previews...');
    let have;
    try{ have = new Set(await DB.keys('thumbs')); }catch(e){ have = null; }
    const missing = Store.models.filter(m=>!m.thumbId || (have && !have.has(m.thumbId)));
    if(!missing.length){ Prog.stop(); return Toast.ok('Every model already has a preview'); }
    const dangling = missing.filter(m=>m.thumbId).length;
    for(const m of missing) m.thumbId = null;
    Prog.set('Rebuilding '+missing.length+' previews...', 0, missing.length);
    await Scan.thumbnails(missing, true);
    Prog.stop(); Thumbs._urls.clear(); UI.render();
    Toast.ok('Rebuilt '+missing.filter(m=>m.thumbId).length+' of '+missing.length+
      (dangling ? ', including '+dangling+' that pointed at an image that had gone' : ''));
  },

    return {
      app:'Printery', version:APP_VERSION, exportedAt:new Date().toISOString(),
      settings: Store.settings,
      roots: Store.roots.map(r=>({id:r.id, name:r.name, addedAt:r.addedAt, lastScan:r.lastScan})),
      // rootName travels with each model: root ids are local to one install,
      // the folder name and relative path are what identify it anywhere else
      models: Store.models.map(m=>({id:m.id, rootId:m.rootId, rootName:(Store.root(m.rootId)||{}).name||'',
        path:m.path, name:m.name, tags:m.tags,
        collections:m.collections, source:m.source, creator:m.creator, license:m.license, notes:m.notes,
        rating:m.rating, favorite:m.favorite, createdAt:m.createdAt})),
      parked: Store.parked,   // metadata still waiting for a folder, don't lose it
      prints: Store.prints, filaments: Store.filaments, printers: Store.printers, queue: Store.queue
    };

  importJSON(){
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = async ()=>{
      const file = inp.files[0]; if(!file) return;
      let data;
      try{ data = JSON.parse(await file.text()); }catch(e){ return Toast.err('That is not valid JSON'); }
      // Accepts 'PrintVault' as well, because every backup written before the
      // rename says that, and refusing them would mean the rename quietly ate
      // people's tags, notes and print history the first time they restored.
      if(!data || (data.app !== 'Printery' && data.app !== 'PrintVault'))
        return Toast.err('Not a Printery backup');
      Modal.confirm('Import backup?',
        'Adds <b>'+(data.prints||[]).length+'</b> prints, <b>'+(data.filaments||[]).length+'</b> spools, and metadata for <b>'+
        (data.models||[]).length+'</b> models. Existing entries with the same id are overwritten; nothing is deleted.',
        async ()=>{
          const rootName = {};
          (data.roots||[]).forEach(r=>{ rootName[r.id] = r.name; });

          // Park everything by folder name and path, then let it find its
          // models. Nothing is thrown away for want of a match: whatever
          // can't land now waits in the database for the next scan.
          const bm = (data.models||[]).concat(data.parked||[]);
          await Meta.park(bm.map(m=>Object.assign(
            {rootName:m.rootName||rootName[m.rootId]||'', path:m.path, name:m.name},
            Meta.FIELDS.reduce((o,f)=>(o[f]=m[f], o), {}))));

          for(const k of ['prints','filaments','printers','queue']){
            for(const x of (data[k]||[])) await Store.put(k, x);
          }
          if(data.settings) { Object.assign(Store.settings, data.settings); await Store.saveSettings(); }

          const mm = await Meta.adopt(Store.models);
          Modal.close(); applyTheme(); UI.render();

          const other = (data.prints||[]).length + (data.filaments||[]).length +
                        (data.printers||[]).length + (data.queue||[]).length;
          const held = Store.parked.length;
          if(mm) Toast.ok('Imported '+other+' records and restored metadata for '+mm+' model'+(mm===1?'':'s')+
                          (held ? '. '+held+' more will attach when you scan.' : '.'));
          else if(held) Toast.err('Imported '+other+' prints, spools, printers and queue entries. Tags and notes for '+
                          held+' models are saved and waiting: add the folder and scan it, and they will attach themselves.', 9000);
          else Toast.ok('Imported '+other+' records.');
        }, 'Import');
    };
    inp.click();
  },

  async backupNow(){
    const p = await AutoBackup.run(true);
    if(p) { UI.render(); Toast.ok('Backup written to '+((Store.roots[0]||{}).name||'')+'/'+p); }

      'and have not found their files yet. Import the backup again to bring them back.',

      '<b>Print history, filament, printers, and the queue are kept.</b> No files on disk are touched. You can re-add folders and rescan.',
      async ()=>{

        Store.files=[]; Store.models=[]; Store.roots=[]; Store.reindex();
        Thumbs._urls.clear();
        Modal.close(); UI.render(); Toast.ok('Index cleared');
      }, 'Clear index', true);
  },
  clearAll(){
    Modal.confirm('Erase everything?',
      'Deletes the entire Printery database in this browser: index, print history, filament, printers, and queue. '+
      'This cannot be undone. <b>No files on disk are touched.</b> Export a backup first if you want one.',
      async ()=>{
        await Promise.all(STORES.map(s=>DB.clear(s)));
        location.reload();
      }, 'Erase everything', true);

/* ============================================================
   Boot
   ============================================================ */
/* Accent colours. Each needs its own pair because a hue bright enough to read
   on the dark theme is usually too pale on the light one, so they are picked
   rather than derived from a single value.

   Only the interface follows this. The 3D previews stay orange deliberately:
   they are rendered once and cached, so tying them to the accent would leave a
   whole library the wrong colour until every thumbnail was drawn again. */
const ACCENTS = [
  {id:'orange', name:'Orange', dark:'#ff8a3d', light:'#e06a15'},
  {id:'blue',   name:'Blue',   dark:'#4da3ff', light:'#0b63c4'},
  {id:'green',  name:'Green',  dark:'#3ddc97', light:'#0e8f5d'},
  {id:'purple', name:'Purple', dark:'#a684ff', light:'#6b3fd4'},
  {id:'pink',   name:'Pink',   dark:'#ff7ab0', light:'#c4266f'},
  {id:'amber',  name:'Amber',  dark:'#ffc857', light:'#9a6b00'}
];

function accentVars(hex, light){
  const n = parseInt(hex.slice(1), 16);
  const r = (n>>16)&255, g = (n>>8)&255, b = n&255;
  const d = c=>Math.round(c*0.78);
  return {
    acc: hex,
    accd: '#'+[d(r),d(g),d(b)].map(c=>c.toString(16).padStart(2,'0')).join(''),
    soft: 'rgba('+r+','+g+','+b+','+(light ? '.1' : '.13')+')'
  };
}

function applyTheme(){
  const light = Store.settings.theme === 'light';
  document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
  document.getElementById('btnTheme').innerHTML = light ? I.moon : I.sun;

  const a = ACCENTS.find(x=>x.id === Store.settings.accent) || ACCENTS[0];
  const v = accentVars(light ? a.light : a.dark, light);
  const st = document.documentElement.style;
  // Set on the element so it beats the stylesheet's :root and [data-theme]
  // rules without either of them needing to know these exist.
  st.setProperty('--acc', v.acc);
  st.setProperty('--accd', v.accd);
  st.setProperty('--acc-soft', v.soft);
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', light ? '#f6f7f9' : '#0e1014');
}

function wire(){
  /* The sidebar overlays the content on a phone, so without this there is no
     way to get rid of it and it sits on top of the library. The button only
     shows at that width; on a desktop it stays the column it always was. */
  const btnSide = document.getElementById('btnSide');
  btnSide.innerHTML = I.menu;
  btnSide.onclick = ()=>{
    if(UI.narrow()) UI.setSide(!UI.sideOpen);
    else Library.toggleSide();
  };
  document.getElementById('scrim').onclick = ()=>UI.setSide(false);
  // Tapping a filter should get you to the results, not leave the sidebar
  // covering them. Capture phase, so the render the filter triggers is
  // already the closed one.
  document.getElementById('side').addEventListener('click', e=>{
    if(!UI.narrow() || !e.target.closest('button,a')) return;
    // Set the flag only. Calling setSide here would re-render the sidebar and
    // tear out the button mid-click, so its own handler would never run.
    UI.sideOpen = false;
    btnSide.setAttribute('aria-expanded', 'false');
  }, true);
  /* Rotating a phone, or dragging a window across the breakpoint. Listening to
     resize rather than the media query's change event because the sidebar's
     open state is now width-dependent, and a width that settles late (a slow
     first paint, a pane that sizes itself after load) would otherwise leave
     the boot-time answer stuck on screen with nothing scheduled to correct it. */
  let wasNarrow = UI.narrow();
  window.addEventListener('resize', U.debounce(()=>{
    const now = UI.narrow();
    if(now !== wasNarrow){ wasNarrow = now; UI.setSide(false); }
  }, 120));

  document.getElementById('btnAddRoot').onclick = ()=>Scan.addRoot();
  document.getElementById('btnScan').onclick = ()=>{
    if(!Store.roots.length) return Scan.addRoot();
    Scan.run();
  };
  document.getElementById('btnTheme').onclick = ()=>{
    Store.setting('theme', Store.settings.theme === 'light' ? 'dark' : 'light');
    applyTheme(); UI.render();
  };
  const q = document.getElementById('q');
  q.addEventListener('input', U.debounce(()=>{
    UI.filter.q = q.value.trim();
    UI.page = 1;
    UI.render();
  }, 180));
  q.addEventListener('keydown', e=>{ if(e.key==='Escape'){ q.value=''; UI.filter.q=''; q.blur(); UI.render(); } });
  // Closing or reloading mid-job stops it. Progress is saved as it goes, but the
  // browser still needs to ask, since the rest of the job will not happen.
  window.addEventListener('beforeunload', e=>{
    if(!Scan.busy && !Prog._active) return;
    e.preventDefault();
    e.returnValue = '';
    return '';
  });

  window.addEventListener('hashchange', ()=>{
    const h = location.hash.replace('#','');
    if(TABS.some(t=>t.id===h) && h !== UI.tab) UI.go(h);
  });
}

async function checkPerms(){
  const stale = [];
  for(const r of Store.roots){
    if(!r.handle && !r.path){ stale.push(r.name); continue; }
    try{ if(!(await FS.granted(r))) stale.push(r.name); }
    catch(e){ stale.push(r.name); }
  }
  if(stale.length) Toast.show('Click Scan to reconnect '+stale.length+' folder'+(stale.length===1?'':'s')+
    ' ('+stale.slice(0,3).join(', ')+'). Browsers require a click to restore folder access.', null, 7000);
}

/* ============================================================
   Demo — a throwaway library for ?demo, built in memory
   ============================================================
   Someone arriving from a link has no reason yet to hand us a folder, and
   the app used to greet them with an empty grid and a file picker. This
   fills it instead. Everything is generated at boot: no fixtures, no images
   shipped, nothing fetched. The previews are real WebGL renders of meshes
   built in code, which is why a demo library this size costs no bytes.

   The storage layer is swapped for plain Maps before anything opens the
   database, so the demo can neither see nor touch a real library sitting in
   the same browser profile, and closing the tab is all it takes to undo it.
*/
const Demo = {
  on: /(?:^|[?&])demo(?:[=&]|$)/.test(location.search),
  _mem: null,

  installDB(){
    const mem = Demo._mem = {};
    const st = s => mem[s] || (mem[s] = new Map());
    STORES.forEach(st);
    Object.assign(DB, {
      open: ()=>Promise.resolve(null),
      tx: ()=>Promise.reject(new Error('No transactions in demo mode')),
      get: async (s,id)=>st(s).get(id),
      all: async s=>Array.from(st(s).values()),
      keys: async s=>Array.from(st(s).keys()),
      put: async (s,v)=>{ st(s).set(v.id, v); return v.id; },
      putMany: async (s,vals)=>{ (vals||[]).forEach(v=>st(s).set(v.id, v)); },
      del: async (s,id)=>{ st(s).delete(id); },
      delMany: async (s,ids)=>{ (ids||[]).forEach(id=>st(s).delete(id)); },
      clear: async s=>{ st(s).clear(); },
      byIndex: async (s,idx,val)=>Array.from(st(s).values()).filter(v=>v[idx]===val)
    });
  },

  /* Nothing here has a file behind it, so anything reaching for one should
     say why rather than surface a DOMException from three layers down. */
  guard(){
    const nope = ()=>Promise.reject(new Error('The demo has no files on disk. Download Printery to use your own library.'));
    ['read','readTail','readRange','headTail','writeFile','deleteFile','renameFile',
     'moveToQuarantine','mkdirp','pick'].forEach(k=>{ if(typeof FS[k]==='function') FS[k] = nope; });
    ['btnAddRoot','btnScan'].forEach(id=>{ const el = document.getElementById(id); if(el) el.classList.add('hidden'); });
  },

  banner(){
    const bar = document.createElement('div');
    bar.className = 'pv-demo';
    bar.innerHTML =
      '<b>Demo library.</b>' +
      '<span>Every model, print and spool below is invented, and nothing is saved. ' +
      'The real thing reads a folder you already have.</span>' +
      '<a href="/">Get Printery</a>' +
      '<a class="q" href="./">Exit demo</a>';
    const app = document.querySelector('.pv-app');
    if(app) app.insertBefore(bar, app.firstChild);
  },

  /* --- geometry ------------------------------------------------------
     Enough primitives to make three dozen cards look like different
     objects. Winding is not policed because the shader flips the normal on
     back faces anyway, the same reason a badly exported STL still lights. */

  _tri(o,a,b,c){ o.push(a[0],a[1],a[2], b[0],b[1],b[2], c[0],c[1],c[2]); },
  _quad(o,a,b,c,d){ Demo._tri(o,a,b,c); Demo._tri(o,a,c,d); },

  _box(o, cx,cy,cz, w,d,h, rot){
    const hw=w/2, hd=d/2, hh=h/2, c=Math.cos(rot||0), s=Math.sin(rot||0);
    const p = [[-hw,-hd,-hh],[hw,-hd,-hh],[hw,hd,-hh],[-hw,hd,-hh],
               [-hw,-hd,hh],[hw,-hd,hh],[hw,hd,hh],[-hw,hd,hh]]
      .map(v=>[v[0]*c - v[1]*s + cx, v[0]*s + v[1]*c + cy, v[2]+cz]);
    [[0,3,2,1],[4,5,6,7],[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7]]
      .forEach(q=>Demo._quad(o, p[q[0]], p[q[1]], p[q[2]], p[q[3]]));
  },

  _prism(o, cx,cy,z0, r, sides, h, rot){
    const z1 = z0 + h, at = i => (rot||0) + i/sides*Math.PI*2;
    const p = i => [cx + Math.cos(at(i))*r, cy + Math.sin(at(i))*r];
    for(let i=0;i<sides;i++){
      const a = p(i), b = p((i+1)%sides);
      Demo._quad(o, [a[0],a[1],z0], [b[0],b[1],z0], [b[0],b[1],z1], [a[0],a[1],z1]);
    }
    for(let i=1;i<sides-1;i++){
      const a = p(0), b = p(i), c = p(i+1);
      Demo._tri(o, [a[0],a[1],z1], [b[0],b[1],z1], [c[0],c[1],z1]);
      Demo._tri(o, [c[0],c[1],z0], [b[0],b[1],z0], [a[0],a[1],z0]);
    }
  },

  _cone(o, cx,cy,z0, r, sides, h){
    const tip = [cx,cy,z0+h], at = i => i/sides*Math.PI*2;
    const p = i => [cx + Math.cos(at(i))*r, cy + Math.sin(at(i))*r, z0];
    for(let i=0;i<sides;i++){
      Demo._tri(o, p(i), p((i+1)%sides), tip);
      Demo._tri(o, p((i+1)%sides), p(i), [cx,cy,z0]);
    }
  },

  _mesh(kind){
    const o = [];
    if(kind === 'bin'){
      Demo._box(o, 0,0,2, 46,32,4);                                  // floor
      Demo._box(o, 0,-15,14, 46,2,24); Demo._box(o, 0,15,14, 46,2,24);
      Demo._box(o, -22,0,14, 2,32,24); Demo._box(o, 22,0,14, 2,32,24);
    } else if(kind === 'bracket'){
      Demo._box(o, 0,0,3, 44,26,6);
      Demo._box(o, -19,0,20, 6,26,34);
      Demo._box(o, -12,0,10, 12,6,12, 0.6);                          // gusset
    } else if(kind === 'gear'){
      Demo._prism(o, 0,0,0, 18, 24, 9);
      for(let i=0;i<12;i++) Demo._box(o, Math.cos(i/12*6.283)*21, Math.sin(i/12*6.283)*21, 4.5, 8,5,9, i/12*6.283);
      Demo._prism(o, 0,0,-0.5, 5, 12, 10);
    } else if(kind === 'hex'){
      Demo._prism(o, 0,0,0, 22, 6, 7, 0.26);
      Demo._prism(o, 0,0,7, 16, 6, 3, 0.26);
    } else if(kind === 'tower'){
      Demo._box(o, 0,0,4, 40,40,8); Demo._box(o, 0,0,16, 28,28,16); Demo._box(o, 0,0,30, 16,16,12);
    } else if(kind === 'cone'){
      Demo._prism(o, 0,0,0, 16, 20, 5);
      Demo._cone(o, 0,0,5, 15, 20, 34);
    } else if(kind === 'clip'){
      Demo._box(o, 0,0,3, 34,18,6);
      Demo._box(o, -15,0,15, 4,18,24); Demo._box(o, 15,0,15, 4,18,24);
      Demo._box(o, -11,0,26, 12,18,4, 0.35);
    } else if(kind === 'plate'){
      Demo._box(o, 0,0,2, 58,40,4);
      [[-24,-15],[24,-15],[-24,15],[24,15]].forEach(p=>Demo._prism(o, p[0],p[1],4, 3.5, 10, 9));
      Demo._box(o, 0,0,6, 30,16,4);
    } else if(kind === 'knob'){
      Demo._prism(o, 0,0,0, 17, 28, 14);
      for(let i=0;i<14;i++) Demo._box(o, Math.cos(i/14*6.283)*17, Math.sin(i/14*6.283)*17, 7, 3.5,3.5,14, i/14*6.283);
      Demo._prism(o, 0,0,14, 12, 20, 3);
    } else {                                                          // tile
      Demo._box(o, 0,0,1.5, 54,54,3);
      for(let x=-1;x<=1;x++) for(let y=-1;y<=1;y++) Demo._prism(o, x*17,y*17,3, 6.5, 6, 4, 0.26);
    }
    return new Float32Array(o);
  },

  _normals(pos){
    const n = new Float32Array(pos.length);
    for(let i=0;i<pos.length;i+=9){
      const ax=pos[i+3]-pos[i], ay=pos[i+4]-pos[i+1], az=pos[i+5]-pos[i+2];
      const bx=pos[i+6]-pos[i], by=pos[i+7]-pos[i+1], bz=pos[i+8]-pos[i+2];
      let x=ay*bz-az*by, y=az*bx-ax*bz, z=ax*by-ay*bx;
      const l=Math.hypot(x,y,z)||1; x/=l; y/=l; z/=l;
      for(let k=0;k<9;k+=3){ n[i+k]=x; n[i+k+1]=y; n[i+k+2]=z; }
    }
    return n;
  },

  _bbox(pos){
    let a=[Infinity,Infinity,Infinity], b=[-Infinity,-Infinity,-Infinity];
    for(let i=0;i<pos.length;i+=3) for(let k=0;k<3;k++){
      if(pos[i+k]<a[k]) a[k]=pos[i+k];
      if(pos[i+k]>b[k]) b[k]=pos[i+k];
    }
    return {min:a, max:b, size:[b[0]-a[0], b[1]-a[1], b[2]-a[2]]};
  },

      const grams = 8 + Math.floor(rnd()*120);
      const timeMin = 22 + Math.floor(rnd()*640);
      const mat = /petg/.test(tags) ? 'PETG' : /tpu/.test(tags) ? 'TPU' : 'PLA';

      const own = [];
      const push = (fname, ext, kind, size, extra)=>{
        const f = Object.assign({id:'df'+files.length, rootId:'dr', modelId:id,
          path: mpath + '/' + fname, name: fname, ext, kind, size,
          mtime: now - Math.floor(rnd()*220)*day}, extra||{});
        files.push(f); own.push(f); return f;
      };

      const main = i % 3 === 0 ? 'stl' : '3mf';
      push(stem + '.' + main, main, 'mesh', 240000 + Math.floor(rnd()*7.4e6));
      if(i % 4 === 1) push(stem + '_plate_b.stl', 'stl', 'mesh', 180000 + Math.floor(rnd()*2.4e6));
      if(i % 5 === 2) push(stem + '_0.2mm_' + mat + '_A1.gcode', 'gcode', 'gcode',
        3.2e6 + Math.floor(rnd()*9e6),
        {g:{timeMin, grams, material:mat, layerH:0.2, nozzle:0.4, printer:'Bambu A1'}});
      if(i % 6 === 3) push('cover.png', 'png', 'image', 180000 + Math.floor(rnd()*900000));
      if(i % 7 === 5) push('README.txt', 'txt', 'other', 900 + Math.floor(rnd()*3000));

      models.push({
        id, rootId:'dr', path: mpath, name,
        tags: tags.split(','), collections:[coll],
        source: i % 4 === 0 ? 'https://example.com/things/' + (10000+i) : '',
        creator: Demo.CREATORS[i % Demo.CREATORS.length], license: i % 3 === 0 ? 'CC BY 4.0' : '',
        notes: i % 9 === 4 ? 'Scaled to 105 percent, the original was a hair tight.' : '',
        rating: i % 5 === 0 ? 5 : i % 3 === 0 ? 4 : 0,
        favorite: i % 8 === 1,
        thumbId: 'dt' + (i % 24), thumbSrc: 'embedded', shape,
        fileCount: own.length, bytes: own.reduce((s,f)=>s+f.size,0),
        meshCount: own.filter(f=>f.kind==='mesh').length,
        gcodeCount: own.filter(f=>f.kind==='gcode').length,
        imgCount: own.filter(f=>f.kind==='image').length,
        innerCount: 0, inner: null, isArchive: false, archiveExt: null,
        mtime: own.reduce((s,f)=>Math.max(s,f.mtime),0),
        tris, est: {timeMin, grams, material:mat, layerH:0.2, nozzle:0.4, printer:'Bambu A1'},
        createdAt: now - (200 - i*3)*day, updatedAt: now - Math.floor(rnd()*40)*day
      });
    });

    /* A few genuine duplicates, because an empty Duplicates tab makes the
       feature look broken rather than clean. Same hash, same size, two paths. */
    const twin = (a, b, sha, size)=>{
      const fa = files.find(f=>f.modelId==='dm'+a && f.kind==='mesh');
      const fb = files.find(f=>f.modelId==='dm'+b && f.kind==='mesh');
      if(!fa || !fb) return;
      fa.sha = fb.sha = sha; fa.size = fb.size = size;
      fb.path = fb.path.replace(/\.(stl|3mf)$/, ' (1).$1');
      fb.name = fb.name.replace(/\.(stl|3mf)$/, ' (1).$1');
    };
    twin(4, 5, 'a91c4e77b2', 4180332);
    twin(9, 30, 'c04b18ff3a', 1290448);
    twin(1, 31, 'e7712a0c95', 763120);

    root.files = files.length;
    root.models = models.length;
    root.bytes = files.reduce((s,f)=>s+f.size, 0);

    const printers = [
      {id:'dp1', name:'Bambu A1', model:'A1 with AMS Lite', bedX:256, bedY:256, bedZ:256,
       nozzle:0.4, addr:'', apiKey:'', flavour:'moonraker', notes:'Workhorse.'},
      {id:'dp2', name:'Voron 2.4', model:'350mm', bedX:350, bedY:350, bedZ:330,
       nozzle:0.6, addr:'', apiKey:'', flavour:'moonraker', notes:'Built over a long winter.'}
    ];

    const filaments = [
      ['df1','Polymaker','PLA','Galaxy Black','#22242a',1000,640,21.99],
      ['df2','Prusament','PETG','Prusa Orange','#ff7a2f',1000,215,29.99],
      ['df3','Bambu','PLA Basic','Matte Ivory','#efe7d8',1000,880,24.99],
      ['df4','Sunlu','PLA+','Grey','#8a9099',1000,120,17.5],
      ['df5','Overture','PETG','Teal','#2f9fb5',1000,455,23],
      ['df6','eSun','TPU 95A','Red','#d94848',500,310,28],
      ['df7','Bambu','PLA Basic','Bambu Green','#4fae5f',1000,70,24.99],
      ['df8','Polymaker','ASA','White','#f2f2f0',1000,1000,32]
    ].map(r=>({id:r[0], brand:r[1], material:r[2], colorName:r[3], colorHex:r[4],
      spoolWeightG:r[5], remainingG:r[6], costPerKg:r[7], diameter:1.75,
      tempNozzle: r[2].indexOf('PETG')===0 ? 240 : 215, tempBed: r[2].indexOf('PETG')===0 ? 80 : 60,
      notes:'', archived:false, printer: r[0]==='df8' ? 'Voron 2.4' : 'Bambu A1'}));

    const prints = [];
    for(let j=0;j<28;j++){
      const m = models[Math.floor(rnd()*models.length)];
      const r = rnd();
      const result = r > 0.86 ? 'fail' : r > 0.78 ? 'partial' : 'success';
      const fil = filaments[Math.floor(rnd()*filaments.length)];
      prints.push({
        id:'dpr'+j, modelId:m.id, modelName:m.name,
        date: Demo._date(now, Math.floor(rnd()*150)),
        result, printer: rnd() > 0.35 ? 'Bambu A1' : 'Voron 2.4',
        filamentId: fil.id, material: fil.material,
        layerH: rnd() > 0.5 ? 0.2 : 0.28, nozzle: 0.4,
        grams: Math.max(4, Math.round(m.est.grams * (0.7 + rnd()*0.6))),
        timeMin: Math.max(15, Math.round(m.est.timeMin * (0.8 + rnd()*0.5))),
        infill: [10,15,20,25,40][Math.floor(rnd()*5)],
        notes: result === 'fail' ? 'Warped off the plate about an hour in.'
             : result === 'partial' ? 'Usable, but the overhang needs supports next time.' : '',
        createdAt: now - Math.floor(rnd()*150)*day
      });
    }

    const queue = [
      ['dq1','dm22','Articulated Dragon',1,'hi','Bambu A1','df3','For the school fair on Saturday.'],
      ['dq2','dm28','Multiboard 6x6 Tile',6,'md','Voron 2.4','df1',''],
      ['dq3','dm11','Wall Hook Heavy Duty',4,'md','Bambu A1','df2','Garage rail.'],
      ['dq4','dm36','Dice Tower',1,'lo','','df5',''],
      ['dq5','dm18','Caliper Case',1,'md','Bambu A1','df1','Needs supports.']
    ].map((r,i)=>({id:r[0], modelId:r[1], name:r[2], qty:r[3], priority:r[4], printer:r[5],
      filamentId:r[6], notes:r[7], status: i === 0 ? 'printing' : 'pending',
      addedAt: now - (12 - i*2)*day}));

    await DB.put('meta', {id:'settings', v:{
      view:'grid', sort:'name', dir:'asc', sidebar:true, thumbSize:320,
      defaultPrinter:'Bambu A1', currency:'$', costPerHour:0.15,
      lastScan: now - 2*day, autoBackup:'off'
    }});
    await DB.putMany('roots', [root]);
    await DB.putMany('models', models);
    await DB.putMany('files', files);
    await DB.putMany('printers', printers);
    await DB.putMany('filaments', filaments);
    await DB.putMany('prints', prints);
    await DB.putMany('queue', queue);

    await Demo.thumbs(models);
  },

  /* One render per shape and colour pair rather than one per model, so
     thirty-eight cards cost roughly two dozen renders and stay instant. */
  async thumbs(models){
    const size = 320, done = new Set();
    for(const m of models){
      if(done.has(m.thumbId)) continue;
      done.add(m.thumbId);
      try{
        const pos = Demo._mesh(m.shape);
        const blob = await Render.toBlob(pos, Demo._normals(pos), Demo._bbox(pos),
          {size, color: Demo.COLS[(parseInt(m.thumbId.slice(2),10)*3) % Demo.COLS.length],
           az: -52 + (parseInt(m.thumbId.slice(2),10) % 5) * 9});
        if(blob) await Thumbs.put(m.thumbId, blob);
      }catch(e){ /* no WebGL here, the cards fall back to the cube icon */ }
    }
  }
};

/* ============================================================
   WhatsNew — what changed, in the app
   ============================================================
   Written here rather than fetched from the releases API. The app makes no
   network calls at all and the CSP has nowhere to fetch from, and a changelog
   that only works online would be the one part of it that does not work on a
   machine with no internet. Newest first, and deliberately terser than the
   release notes: this is a reminder, not documentation. */
/* The app has grown keys nothing announces. ? is the usual way to ask, and
   Settings lists them too for anyone who would never think to press it. */
const Keys = {

    ['/', 'Jump to the search box'],
    ['Arrow keys', 'Move around the library'],
    ['Enter', 'Open the model you are on'],
    ['Home / End', 'First or last model'],
    ['Click', 'Open a model'],
    ['MOD-click', 'Add a model to the selection, or take it out'],
    ['← / →', 'Previous or next part, in the 3D view'],
    ['Esc', 'Close whatever is open'],
    ['?', 'This list']
  ],
  open(){
    const mod = U.isMac() ? '⌘' : 'Ctrl';
    Modal.open('Keyboard',
      '<dl class="kv">'+Keys.rows.map(([k,d])=>
        '<dt style="white-space:nowrap"><kbd>'+U.esc(k.replace('MOD', mod))+'</kbd></dt><dd>'+U.esc(d)+'</dd>').join('')+'</dl>',
      '<div class="sp"></div><button class="b p" onclick="PV.Modal.back()">Close</button>');
  }
};

        '<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:6px">'+

          (ver === APP_VERSION ? '<span class="bdg acc">you have this</span>' : '')+

        '<ul style="margin:0;padding-left:18px;color:var(--dim);font-size:12.5px;line-height:1.7">'+

      '<div class="sp"></div><button class="b p" onclick="PV.Modal.back()">Close</button>');
  },

  /* Show it once after an update. Not on a first run: somebody who has never
     opened the app before does not need telling what changed in it. */
  async maybe(){
    const seen = Store.settings.lastSeenVersion;
    if(seen === APP_VERSION) return;
    const firstEver = !seen && !Store.roots.length;
    await Store.setting('lastSeenVersion', APP_VERSION);
    if(!firstEver) WhatsNew.open();
  }
};

(async function boot(){
  // The engine is worth showing at a glance: it decides whether folder access
  // is native or goes through the browser, which is the first thing to ask
  // about when something behaves unexpectedly.
  document.getElementById('verTag').textContent =
    'v'+APP_VERSION + (FS.kind === 'desktop' ? ' · desktop' : '');
  // The swap has to happen before anything opens the database, otherwise the
  // demo would be looking at, and writing over, a real library in this profile.
  if(Demo.on){ Demo.installDB(); document.body.classList.add('demo'); }
  try{
    await DB.open();
    if(Demo.on) await Demo.seed();
    await Store.load();
  }catch(e){
    Toast.err('Database failed to open: '+e.message);
  }
  applyTheme();
  wire();
  const h = location.hash.replace('#','');
  if(TABS.some(t=>t.id===h)) UI.tab = h;
  document.querySelectorAll('.pv-view').forEach(v=>v.classList.toggle('on', v.id === 'v-'+UI.tab));
  UI.render();
  // None of these make sense against invented data: there are no folder
  // permissions to check, no printer to poll and nowhere to write a backup.
  if(Demo.on){ Demo.banner(); Demo.guard(); }
  else {
    checkPerms(); Monitor.start(); AutoBackup.run(); WhatsNew.maybe();
    /* Coming back to the window is the moment you have finished slicing, so
       that is when to look. Both events, because a desktop window regaining
       focus does not always fire visibilitychange and a background browser tab
       does not always fire focus. */
    window.addEventListener('focus', ()=>SliceWatch.check());
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) SliceWatch.check(); });
  }
  if(!Demo.on && (!FS.supported || !FS.secure)){
    document.getElementById('btnAddRoot').classList.add('hidden');
    document.getElementById('btnScan').classList.add('hidden');
  }
  /* Whether the sidebar is a column or an overlay depends on the width, and
     the width is not always final by the time boot reads it. Ask again once
     the first frame has been laid out, otherwise a window that settled wide
     after boot keeps the narrow answer and looks like a sidebar that vanished. */
  requestAnimationFrame(()=>UI.renderSide());
})();

window.PV = {U, I, DB, Store, Toast, Prog, Modal, FS, Scan, Meta, Send, Share, Quarantine, AutoTag, Monitor, TagBox, AutoBackup, Render, Thumbs, Work,
  UI, Library, Detail, Viewer, Archive, Prints, Filament, Queue, Dupes, Stats, Settings, Demo, WhatsNew, Keys, SliceWatch, Cost, APP_VERSION};


})();
