<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!--
    The GitHub repo social preview. 1280x640 is what GitHub asks for, which is a
    different shape from the 1200x630 Open Graph cards, so this is its own file
    rather than a crop of og.svg.

    The copy is deliberately not the site's. "Your STL folder is a landfill" is a
    good hook for someone deciding whether to try it, and the wrong opening for
    someone who has already clicked through to source code and wants to know what
    the thing is and what it is built from.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12161e"/><stop offset="1" stop-color="#0a0c10"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0" stop-color="#ff7a2f" stop-opacity=".26"/><stop offset="1" stop-color="#ff7a2f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a2f"/><stop offset="1" stop-color="#ffb057"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#677184" stroke-opacity=".16" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- corner ticks -->
  <g stroke="#ff7a2f" stroke-opacity=".5" stroke-width="2" fill="none">
    <path d="M40 62V40h22"/><path d="M1218 40h22v22"/><path d="M1240 578v22h-22"/><path d="M62 600H40v-22"/>
  </g>

  <!-- logo mark -->
  <g transform="translate(72,86) scale(1.7)">
    <path d="M16 2 3 9v14l13 7 13-7V9z" fill="none" stroke="#e9edf4" stroke-opacity=".38" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M3 9l13 6.6L29 9M16 15.6V30" fill="none" stroke="#e9edf4" stroke-opacity=".38" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M16 2 3 9l13 6.6L29 9z" fill="#ff7a2f"/>
  </g>
  <text x="140" y="126" font-size="34" font-weight="700" fill="#e9edf4" letter-spacing="-1">Print<tspan fill="#ff7a2f">ery</tspan></text>

  <!-- headline -->
  <text x="72" y="268" font-size="72" font-weight="800" fill="#e9edf4" letter-spacing="-3">A local-first manager</text>
  <text x="72" y="352" font-size="72" font-weight="800" fill="url(#hot)" letter-spacing="-3">for 3D print files.</text>

  <text x="72" y="410" font-size="26" fill="#8f9aac" letter-spacing="-.3">Index your STL, 3MF and gcode folders. Tag them, search them,</text>
  <text x="72" y="446" font-size="26" fill="#8f9aac" letter-spacing="-.3">find the duplicates, and keep a record of what you printed.</text>

  <!-- what it is built from, which is what a repo visitor is here for -->
  <g font-size="18" font-weight="600" letter-spacing="1.4">
    <rect x="72" y="486" width="246" height="46" rx="3" fill="none" stroke="#313d4e"/>
    <text x="94" y="515" fill="#e9edf4">SINGLE HTML FILE</text>
    <rect x="334" y="486" width="214" height="46" rx="3" fill="none" stroke="#313d4e"/>
    <text x="356" y="515" fill="#e9edf4">NO BUILD STEP</text>
    <rect x="564" y="486" width="140" height="46" rx="3" fill="none" stroke="#313d4e"/>
    <text x="586" y="515" fill="#e9edf4">GPL-3.0</text>
  </g>

  <!-- layer stack illustration -->
  <g transform="translate(1000,266)">
    <ellipse cx="105" cy="228" rx="120" ry="20" fill="#ff7a2f" opacity=".18"/>
    <rect x="8" y="212" width="194" height="13" rx="2" fill="#2b3544"/>
    <g fill="url(#hot)">
      <rect x="22" y="198" width="166" height="9" rx="1"/>
      <rect x="27" y="186" width="156" height="9" rx="1"/>
      <rect x="36" y="174" width="138" height="9" rx="1"/>
      <rect x="46" y="162" width="118" height="9" rx="1"/>
      <rect x="54" y="150" width="102" height="9" rx="1"/>
      <rect x="58" y="138" width="94" height="9" rx="1"/>
      <rect x="56" y="126" width="98" height="9" rx="1"/>
      <rect x="50" y="114" width="110" height="9" rx="1"/>
      <rect x="44" y="102" width="122" height="9" rx="1"/>
      <rect x="40" y="90" width="130" height="9" rx="1"/>
      <rect x="43" y="78" width="124" height="9" rx="1"/>
      <rect x="52" y="66" width="106" height="9" rx="1"/>
      <rect x="66" y="54" width="78" height="9" rx="1"/>
    </g>
    <!-- nozzle -->
    <g transform="translate(78,-4)">
      <rect x="12" y="0" width="30" height="34" rx="3" fill="#2b3543" stroke="#3f4b5e" stroke-width="1.5"/>
      <rect x="17" y="7" width="20" height="5" rx="1.5" fill="#ff7a2f" opacity=".85"/>
      <path d="M18 34h18l-5 14h-8z" fill="#404d61" stroke="#4d5b70" stroke-width="1.5"/>
      <path d="M25 48h4l-2 7z" fill="#ff7a2f"/>
    </g>
  </g>

  <!-- footer bar -->
  <rect x="0" y="600" width="1280" height="1" fill="#222a37"/>
  <text x="72" y="578" font-size="19" fill="#67718a" letter-spacing="2.2">BROWSER  ·  WINDOWS  ·  MACOS  ·  LINUX</text>
  <text x="1208" y="578" font-size="19" fill="#67718a" text-anchor="end" letter-spacing="1.4">github.com/magikh0e/Printery</text>
</svg>
