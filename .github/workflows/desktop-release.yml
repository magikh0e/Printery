# Builds the Printery desktop app (Tauri) for macOS, Linux and Windows.
#
# Tauri can't cross-compile, so each installer is produced on its own OS runner.
# There is no frontend build step: desktop/build.mjs copies the single-file app
# from index.html into desktop/dist and stamps the version into the shell.
#
# Trigger:
#   - push a tag matching desktop-v*   (e.g. desktop-v0.2.0)  -> release build
#   - or run manually from the Actions tab (workflow_dispatch)
#
# Output: one DRAFT GitHub Release named "Printery Desktop v<version>" with
# the .dmg (macOS, universal), .AppImage/.deb/.rpm (Linux) and .msi/.exe
# (Windows). Review the draft and hit Publish when you're happy with it.

name: Desktop release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The three runners finish at roughly the same time, and if each is left to
  # create the release itself they race and you end up with two drafts sharing
  # the same tag, one holding the macOS build and one holding the rest. So the
  # release is made once here and the builds upload into it by id.
  release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.mk.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: echo "v=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"
      - name: Create or reuse the draft
        id: mk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: desktop-v${{ steps.v.outputs.v }}
        run: |
          id=$(gh api repos/${{ github.repository }}/releases \
                --jq ".[] | select(.tag_name==\"$TAG\") | .id" | head -1)
          if [ -z "$id" ]; then
            id=$(gh api --method POST repos/${{ github.repository }}/releases \
                  -f tag_name="$TAG" -f name="Printery Desktop v${{ steps.v.outputs.v }}" \
                  -F draft=true -F prerelease=false --jq '.id')
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    strategy:
      fail-fast: false
      # One at a time, deliberately, and it costs about twenty minutes.
      #
      # Every runner appends its platforms to the same latest.json on the
      # release: read it, merge, upload it back. Run in parallel that is three
      # processes racing on one file, and the loser's entries simply are not
      # there afterwards. It bit 0.2.25: macOS lost the race, the job reported
      # "Not Found - update-a-release-asset", and the manifest came out with
      # seven platforms instead of eleven. Every installer was present and
      # correct, so the only visible symptom would have been Macs never being
      # offered the update.
      #
      # Serialising is the boring fix. The alternative, letting them race and
      # rebuilding the manifest afterwards from the .sig files, is faster and
      # has more places to be wrong.
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest # Apple Silicon; builds a universal binary
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04 # older base = wider AppImage compatibility
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS builds a universal binary, so it needs both arch targets.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      # Icons are generated from raw pixels rather than committed as binaries,
      # so they are reproducible and there is nothing to keep in sync by hand.
      - name: Generate icons
        working-directory: desktop
        run: node make-icon.mjs

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundles and latest.json. Without this the in-app
          # updater has nothing it trusts, so installed copies never see the
          # release. The matching public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: desktop
          args: ${{ matrix.args }}
          releaseId: ${{ needs.release.outputs.id }}

  # Publishes SHA256SUMS.txt alongside the installers.
  #
  # The updater checks its own signature before applying an update, but that
  # covers updates, not the first download. Somebody fetching a .dmg or a .msi
  # by hand has nothing to compare it against unless we publish one.
  #
  # Its own job because the three build runners upload independently, so the
  # sums can only be taken once all of them have finished.
  checksums:
    name: Publish checksums
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Publish SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # build.mjs stamps the same version into tauri.conf.json, and that is
          # what the release job derives the tag from. GITHUB_REF_NAME is a
          # branch name when this workflow is started by hand, so do not use it.
          version=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          tag="desktop-v$version"
          echo "Release: $tag"

          # The release is still a DRAFT here. `gh release download` resolves
          # drafts, but /releases/tags/<tag> returns 404 for them, so this
          # cannot be "simplified" into a gh api call.
          mkdir -p dist-check && cd dist-check
          gh release download "$tag" --repo "$GITHUB_REPOSITORY"

          # The updater manifest has to name every platform we just built. A
          # partial one is the failure mode with no symptoms: the installers
          # are all present, the release looks finished, and the platform that
          # went missing simply never gets offered an update again. Serialising
          # the builds should prevent it; this is here so that if it happens
          # anyway the release fails loudly instead of shipping.
          echo "----- checking latest.json covers every platform -----"
          node -e '
            const m = require("./latest.json");
            const keys = Object.keys(m.platforms || {});
            console.log("version:", m.version);
            console.log("platforms:", keys.join(", ") || "(none)");
            const missing = ["darwin", "linux", "windows"].filter(
              os => !keys.some(k => k.startsWith(os))
            );
            const unsigned = keys.filter(k => !m.platforms[k].signature);
            if (missing.length) {
              console.error("MISSING from the update manifest: " + missing.join(", "));
              console.error("A build lost the race writing latest.json. Re-run that job.");
              process.exit(1);
            }
            if (unsigned.length) {
              console.error("Unsigned entries: " + unsigned.join(", "));
              process.exit(1);
            }
            console.log("all three platforms present and signed");
          '

          # Hash what a person actually downloads and runs. The .sig files are
          # the updater's signatures and latest.json is its manifest; neither is
          # something you install, and hashing our own output would be circular.
          rm -f ./*.sig latest.json SHA256SUMS.txt
          if [ -z "$(ls -A)" ]; then
            echo "No installer artifacts found for $tag" >&2
            exit 1
          fi

          sha256sum * > SHA256SUMS.txt
          echo "----- SHA256SUMS.txt -----"
          cat SHA256SUMS.txt

          # --clobber so re-running the workflow replaces the file rather than
          # failing on an asset that already exists.
          gh release upload "$tag" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
