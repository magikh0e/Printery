# Blank issues stay off now that there are two forms. Both ask for the things
# that are tedious to chase one comment at a time, and everything they do not
# cover is a discussion rather than a defect.
blank_issues_enabled: false
contact_links:
  - name: Question, or an idea for a feature
    url: https://github.com/magikh0e/Printery/discussions
    about: Anything that is not broken. Folder habits, what it should do next, how you use it.
  - name: Headfit, the helmet and mask fit bench
    url: https://github.com/magikh0e/headfit/discussions
    about: Linked from Settings, but a separate project with its own issues and discussions.
  - name: Try the demo first
    url: https://printery.magikh0e.com/app/?demo
    about: >
      An invented library in memory, which tells you quickly whether the problem is the
      app or something about your own folders.
