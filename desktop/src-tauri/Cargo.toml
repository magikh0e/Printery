[package]
name = "printvault-desktop"
version = "0.3.1"
description = "Printery desktop client"
authors = ["magikh0e"]
edition = "2021"
rust-version = "1.77"
license = "GPL-3.0-or-later"

# App logic lives in a library crate so main.rs stays a thin shim, matching the
# layout used by the Open Relay desktop build.
[lib]
name = "printvault_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Signed in-app updates, checked against the GitHub release manifest
tauri-plugin-updater = "2"
# Two copies of the app share one WebView2 profile, and two processes on one
# IndexedDB is how an index gets reset. Focus the existing window instead.
tauri-plugin-single-instance = "2"
# Uploading to a printer on the LAN. rustls rather than the system TLS stack
# so Linux builds do not need OpenSSL present at runtime.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["fs"] }
tokio-util = { version = "0.7", features = ["io"] }
# Recursive directory walking. The whole point of the desktop build is that one
# call returns the full listing instead of a browser round trip per file.
walkdir = "2"
# Archive extraction happens here rather than in JS, so entry bytes never cross
# the IPC bridge. Also covers compression methods the browser cannot inflate.
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "zstd"] }
# 7z, which the browser build cannot do: it is LZMA, and shipping a decoder for
# it would mean adding a dependency to a single HTML file that has none. Pure
# Rust, so it needs no C toolchain on any of the three CI runners.
sevenz-rust2 = { version = "0.22", default-features = false }

# The macOS share sheet. These are already in the tree because Tauri itself
# pulls them in on macOS, so this pins nothing new, it just makes them
# directly callable. Kept target-specific so a Linux or Windows build does
# not try to resolve AppKit.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSSharingService", "NSView", "NSWindow", "NSResponder", "NSGraphics"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSURL", "NSString", "NSGeometry"] }

[profile.release]
opt-level = "s"     # a webview shell, not a hot loop
lto = true
strip = true
